exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: "erpnext_enhancements.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]

      - id: ruff
        name: "Run ruff linter"

      - id: ruff-format
        name: "Run ruff formatter"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                erpnext_enhancements/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                erpnext_enhancements/templates/includes/.*|
                erpnext_enhancements/public/js/lib/.*|
                erpnext_enhancements/public/js/gantt_widget/lib/.*|
                erpnext_enhancements/public/css/gantt_widget/dhtmlxgantt.css
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                erpnext_enhancements/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                erpnext_enhancements/templates/includes/.*|
                erpnext_enhancements/public/js/lib/.*|
                erpnext_enhancements/public/js/gantt_widget/lib/.*
            )$

  # The committed-secrets gate, run on what is about to be committed (the index, not the
  # files on disk). CI runs the same script on everything a PR adds and, on main and
  # nightly, on the whole history; this is the cheap place to catch a key, before it is a
  # blob anyone else has. Before pushing, `python scripts/check_no_committed_secrets.py
  # --since origin/main` runs exactly the PR check. Stdlib only, so no environment.
  - repo: local
    hooks:
      - id: no-committed-secrets
        name: No committed secrets (staged files)
        entry: python scripts/check_no_committed_secrets.py --staged
        language: system
        pass_filenames: false
        always_run: true

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
