      # not overnight), the Sales Team rotation (not Sales User, which nearly everybody
      # holds), one ToDo and no "Guest assigned" notification, the one response rule the
      # widget shares, remind-then-escalate once each, and attribution reaching the
      # Opportunity. Own step: installs a frappe stub and removes it in tearDownModule.
      - name: Lead triage and speed-to-lead SLA (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_lead_triage -v
      # Attribution Gaps classification (v1.502.1). The report every stage of the attribution
      # enablement checklist reads. It filed "Unknown (pre-Aug 2026)" as Historical whatever
      # the record's date -- and the source gate tells people to pick exactly that bucket -- so
      # every bypass of the gate read as old debt and the live count stayed at zero. Pins the
      # post-cutoff bucket as a live gap, and CAPTURE_START to the backfill's CUTOFF.
      # Own step: installs a frappe stub and removes it in tearDownModule.
      - name: Attribution Gaps live-gap classification (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_attribution_gaps -v
      # The WordPress capture script lives in docs/website-capture/ and runs on WP Engine, not
      # here -- so this is the only place its behaviour is checked before somebody pastes it
      # in. Session-scoped first touch, a tagged new visit replacing the whole touch, utm_id,
      # the cookie domain (a foreign one makes the browser drop the cookie) and the size cap.
      - name: WordPress attribution capture script (node)
        run: node scripts/test_sf_attribution.js
      # Its own step: installs a frappe stub in sys.modules, so it must not share a
      # process with another stub-installing suite. Guards the distinction the
      # won-date backfill turns on — an audit-trail status transition is evidence of
      # a win only when it isn't part of a bulk edit. 197 of the 220 candidates on
      # this instance were flipped on one day, and trusting those rebuilds the fake
      # revenue spike the sales dashboard was fixed to stop showing.
      - name: Opportunity won-date backfill (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_opportunity_won_date_backfill.py -q
      - name: Fountain move intake (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_fountain_move.py -q
      # Field systems (WP-2/3/8). Its own step because it installs a frappe stub in
      # sys.modules — sharing a process with another stub-installing suite is how
      # they cross-talk. Guards two things that fail expensively and quietly: a
      # PENDING photo upload must keep counting as "captured" (or a technician on a
      # site with no signal cannot clock out), and the payroll workbook's 14 columns
      # must stay in position (the provider's import maps by position, so a
      # reordered column lands somebody's hours in the Bonus field).
      - name: Field photo gate + payroll export (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_field_systems.py -q
      # Account hygiene + pipeline reconciliation. Own step (own frappe stub).
      # The two invariants that cost the most if they break: nothing may bulk-link
      # an Opportunity to a Project (a wrong link corrupts the revenue attribution
      # WP-1 exists to fix), and Customer.industry must never be made mandatory by
      # reqd/mandatory_depends_on — those are evaluated on every save by every
      # caller, and QBO inserts Customers without ignore_mandatory, so a
      # declarative rule parks every synced customer in manual review.
      - name: Account hygiene + reconciliation (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_account_hygiene.py -q
      # Marketing spend import + value-stream dashboard. Own step (own frappe stub).
      # Guards the normalisation path (an unreadable amount must be REFUSED, not
      # coerced to 0 by frappe's flt — a silent zero in the denominator of every
      # cost-per-lead figure), and that no marketing KPI reads `Opportunity.source`
      # / `Lead.source` again: erpnext v15 orphaned those columns, frappe never
      # drops columns, so the queries ran and returned plausible numbers for years.
      - name: Marketing spend + value stream dashboard (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_marketing_spend.py -q
      # Guards the Gantt widget read API's security contract: client-supplied
      # configs must never reach the query layer with an unvalidated fieldname.
      - name: Gantt widget read API (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_gantt_api.py -q
      # The Project Schedule print format draws its Gantt bars as percentage-
      # positioned divs, and a wrong percentage does not raise -- it silently
      # puts the bar in the wrong place on a document that goes to a customer.
      # Its own step (not appended to a unittest module list): these are plain
      # pytest functions, which `python -m unittest` collects nothing from while
      # still reporting success.
      - name: Project print-format geometry (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_project_print_data.py -q
      # Guards the "the badge says Partially Ordered on a line that is fully
      # ordered" class of bug: an item's status must be computed from that item's
      # own ordered-vs-requested quantity, never inherited from its parent
      # document's header status. The Procurement Tracker did exactly that, so 29
      # of 32 item rows on production were mislabelled.
      - name: Procurement quantity/status math (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_procurement_quantities.py -q
      # Receive Items on the Purchase Order (ER-2026-458194): the endpoint is POST-only,
      # the receipt is inserted and submitted through the framework's permission checks
      # (no ignore_permissions), it is built by ERPNext's own mapper, and the form script
      # is loaded in hooks.py and dials a method that exists. Plain pytest, own step.
      - name: Purchase Order Receive Items wiring (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_po_receive_items.py -q
      # The only automated coverage of triton_chat.py, and `grep -c
      # test_triton_personas .github/workflows/ci.yml` returned 0 until this line:
      # the file shipped and then never ran. Everything it guards -- the SSE relay,
      # the per-user persona cache key (a site-wide key would serve one user's
      # private personas to everybody), the path-traversal guard on
      # _custom_persona_path -- was defended by a suite that had never executed.
      # Phase 3 modifies the widget and Phase 5 refactors the relay; both need this
      # net under them first (ADR 0009 Appendix B §12, C1).
      - name: Triton persona proxy + SSE relay (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_triton_personas.py -q
      # Same module, separate suite because it guards a different thing: the
      # widget's default model. Auto is spelled as the empty string, so the old
      # `behavior.default_model or conn_model or _DEFAULT_MODEL` chain could
      # never resolve to it -- blank fell through to Triton Settings'
      # chat_model_id, which is set on every real site. The failure is silent
      # (the picker just opens on Flash), so it needs a test rather than review.
      - name: Triton widget default model (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_triton_widget_defaults.py -q
      # Gemini Enterprise Agent Platform client (v1.476.0). Its own step for the reason the
      # two above have one: it installs its own frappe/requests/google-auth stubs at module
      # scope. What it pins is the shape of the one request this app sends to the platform:
      # the global host with `locations/global` in the path (the regional form 404'd every
      # weekday briefing from 2026-09-16), a bearer token and no `x-goog-api-key`, the
      # lifecycle note on a 404 rather than an IAM hint, and the bearer cleared from the
      # frame before anything raises so it cannot reach the Error Log. Two failures in one
      # string literal went unexercised for the client's whole life; this is the net.
      - name: Gemini Enterprise Agent Platform client (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_gemini_client.py -q
      # Triton chat attachments (v1.375.0). Its own step for the reason the two above have
      # one: each bench-free suite installs its own frappe stub at module scope, and this one
      # extends `frappe.utils` with three date helpers the other two were never written
      # against. Sharing a process would let one suite's stub decide another's outcome.
      #
      # Three of its assertions are security properties rather than tidiness. The prompt
      # preamble must stay byte-identical on turns with no attachment (every context turn the
      # assistant has ever sent uses that string). An attachment ref the caller does not own
      # must produce no line -- getting that wrong is not an error, it is one user's file
      # described into another user's prompt. And a `file_url` sent on the ref must be
      # ignored, because honouring it would turn any session into arbitrary file read under
      # the caller's identity. The fourth is the v1.277.3 Single-default trap: an
      # un-backfilled Int reads None, cint(None) is 0, and a 0 MB cap rejects every upload
      # silently on production only.
      - name: Triton chat attachments (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_triton_attachments.py -q
      # Call routing (v1.403.0). The rules are configured here and matched in Triton --
      # Triton owns the Twilio webhook and already caches this app's get_telephony_routing,
      # so making ERPNext decide per call would put a blocking HTTP request inside a live
      # call. The cost of that split is the same matcher living in two repos that deploy
      # independently, and two copies of an algorithm drift.
      #
      # Hence tests/data/call_routing_vectors.json, committed byte-identical here and in
      # triton/backend/tests/data/. Both suites read it, so a change on one side reddens the
      # other. The failure it exists to catch has no other alarm: the symptom of a
      # disagreement is a phone that does not ring, for one caller in ten, noticed weeks
      # later by someone who assumes they missed the call.
      #
      # Two specifics worth the step surviving a future cleanup. An after-hours window like
      # 17:00-08:00 ends earlier than it starts, and a naive `start <= now < end` makes the
      # most obvious rule anyone would type match at no time of day at all. And every
      # failure path -- unparseable rule, payload from a newer ERPNext, garbage -- must fall
      # back to ringing everyone, because the mistake people can live with is the wrong
      # phone ringing, not silence.
      #
      # Needs no frappe stub: call_routing_match imports nothing but the standard library,
      # which is exactly what makes it portable to Triton. If it ever needs one, something
      # frappe-shaped has leaked into the matcher.
      - name: Call routing matcher (shared vectors, midnight wrap, fail-open)
        run: python -m unittest erpnext_enhancements.tests.test_call_routing -v
      # The gateway-refresh ping fired when a Call Routing Rule is saved. Its own step
      # because it stubs frappe, and separate from the matcher suite above precisely so that
      # one can stay stub-free.
      #
      # Two properties, both invisible from the happy path and both a real incident. It must
      # stay SILENT during migrate/install/patch/import/test -- all of those save documents,
      # so an unguarded hook POSTs to an external service during a deploy, announces rules
      # that do not exist yet on a fresh site, and queues jobs the deploy's own FLUSHDB then
      # destroys. And the shared secret must NOT travel as a frappe.enqueue kwarg, because
      # those are serialised into redis; the worker reads it itself. That second one is easy
      # to "simplify" away by matching Triton Settings.on_update, which does pass it.
      - name: Call routing gateway ping (suppressed on migrate, no secret in the queue)
        run: python -m unittest erpnext_enhancements.tests.test_call_routing_gateway_notify -v
      # The repo's first JavaScript test, and it needs no runner beyond the node
      # already on the GitHub image — deliberately not a new framework.
      #
      # It guards the Pick Routing Map's line arithmetic: the "collect 3" figure a
      # driver reads off a printed pick sheet at a supplier's counter. That number
      # is rendered twice (compact list in the dialog, table on the sheet) from one
      # computation, and a wrong one is discovered across the valley rather than in
      # review. It also covers what production cannot — there is still no partly
      # received Purchase Order on the live site, so the "(n of m received)" and
      # dimmed already-collected states have no real record to exercise them.
      - name: Pick routing line arithmetic + escaping (bench-free, node)
        run: node scripts/test_pick_routing_lines.js
      # The /feedback router, written after a bug that shipped in v1.319.0 and was found by
      # a human clicking the tab. "New request" linked to the bare /feedback and routeTo
      # treated every arrival there as a fresh landing, so a System Manager was sent back to
      # the review queue and the form was unreachable for anyone who reviews. Both halves
      # were correct alone; only the composition was wrong, which is why nothing in CI saw
      # it. This asserts the composition — the tab's own href must resolve to the form for
      # every audience, and landingView must return null for every explicit path, so
      # "override the view somebody just clicked" is not expressible.
      - name: Feedback routing composition (bench-free, node)
        run: node scripts/test_feedback_routes.js
      # The one label on the feedback board that is not a status. `Tasks Created` is a
      # TERMINAL state, so a request whose tasks were all finished read "Tasks Created"
      # forever while the Work column beside it said 2/2 — nothing was broken, there was
      # simply nothing that could ever move it. The fix is a display rule over the task
      # counts the page already holds. The edge worth a CI step is 0/0: `done >= created`
      # on its own calls a request with no work at all "finished", which is the entire
      # plausible bug in a four-line function.
      - name: Feedback derived status label (bench-free, node)
        run: node scripts/test_feedback_status.js
      # The /marketing app's client (TASK-2026-01487, v1.515.0). The pure half -- the router,
      # the calendar arithmetic, the composer's rules -- is checked directly, and the calendar
      # again under three other TZ values: day arithmetic that leaned on the device's clock would
      # drift in one of them, and scheduled_at is the site's time, never the phone's. The preview
      # is checked against what the publishers actually send (Instagram never gets the link).
      - name: Marketing app client logic (bench-free, node)
        run: node scripts/test_marketing_client.js
      # Build-blocking source rules for the same client, adapted from the retired chat SPA's:
      # no innerHTML at all, no Vue, no frappe.*, cross-module names resolve, bundles only, every
      # list renderer reaches the one placeholder writer when empty, every surface that reads
      # shared state writes it too, approve/save/reschedule send the `modified` the page loaded,
      # outbound links are http(s) or text, --ee-brand never carries text, every heading class
      # sets its colour, the CSS comments balance, and the bundle stays under its gzip ceiling.
      - name: Marketing app source rules (bench-free, node)
        run: node scripts/test_marketing_source_rules.js
      # Google address components -> Frappe Address fields. Every rule in that
      # mapping is a judgement call that looks arbitrary until it is wrong, and
      # the branches for UK/Nordic mailing towns and for states with no
      # two-letter form cannot be exercised on this US-only site at all.
      - name: Address component mapping (bench-free, node)
        run: node scripts/test_address_components.js
      # The floating Triton widget's streaming re-entrancy rule: every function that
      # clears the transcript, or switches which session it belongs to, must refuse
      # while a stream is in flight. Two of the four were missing it, and the failure is
      # entirely silent -- pumpText keeps writing into a detached node, finishStreaming
      # runs mermaid against dead DOM, and the turn is still persisted against the
      # session the user walked away from. Nothing throws, so nothing reports it.
      #
      # Ordering is asserted, not just presence: a guard after the destructive line is
      # decoration. Phase 3 rewires session switching entirely, which is exactly when a
      # rule this easy to agree with gets forgotten on the next function.
      #
      # Phase 3's checkpoint added two more rule families to the same file, both
      # silent in production and both invisible to anybody not using the affected
      # input method or keyboard layout: Enter-to-send must ignore an in-flight IME
      # composition (pressing Enter to COMMIT a candidate is how you type Japanese,
      # Chinese or Korean), and Alt+T must ignore AltGr (reported as ctrlKey+altKey
      # on Windows and many EU layouts). Plus the guard on decision #7: the human
      # approved a NEW manifest-backed sources row, not a change to what a turn with
      # no manifest sees -- which is every turn until Phase 5 ships.
      - name: Triton widget source guards (streaming, keyboard, preserved behaviour)
        run: node scripts/test_triton_widget_guards.js
      # Field text wrapping. Same shape, same reason: every rule it covers fails
      # silently. The sharpest is the `finally` around the ControlData.html_element
      # swap -- that static is flipped to "textarea" for the duration of one
      # synchronous make_input() call, so a control that throws inside the window
      # leaves it flipped and turns every Link, Date and Int field rendered
      # afterwards into a textarea, with nothing thrown and nothing logged. The
      # rest: global assets stay bundled rather than raw /assets paths (ADR 0008),
      # the SCSS import stays extension-less (a .css suffix becomes a runtime
      # import that 404s), the swap keeps its exact `!== "Data"` fieldtype test so
      # ControlData's subclasses cannot leak in, Data refuses Enter while Small
      # Text keeps it (two functions, deliberately not merged), and the server
      # flag checks has_field() before get_single_value -- it runs in boot_session
      # on every desk load, and v16 throws there between a deploy and its migrate.
      - name: Field text wrapping source guards (bundle wiring, gating, control swap)
        run: node scripts/test_field_text_wrap.js
      # The Address coordinate gate. Latitude/longitude are user-editable and
      # every map trusts that point over the address text, so this is the one
      # place a typo silently relocates a job site. Both failures it rejects --
      # half a pair, and a transposed pair -- save cleanly without it.
      - name: Address coordinate validation
        run: python -m unittest erpnext_enhancements.tests.test_address_coordinates -v
      # The Gantt export's date range. Every failure mode is silent: a windowed
      # export still produces a chart that still looks like a schedule, it is just
      # wrong about which one. The sharpest is clamp-vs-clip -- a task running
      # March-May, exported for April, must read as crossing both edges of the
      # page; clamped to the window instead it reads as a task that starts on the
      # 1st and ends on the 30th, which is a different fact stated with the same
      # confidence. So bar geometry is kept TRUE and the overflow is hidden by a
      # clipPath, which makes the inverse failure possible too (a bar appended to
      # the unclipped group is drawn across the name column), and both directions
      # are asserted. Plus the boundaries, where a shaped end_date is EXCLUSIVE and
      # the {from,to} a person types is INCLUSIVE: every combination of those two
      # conventions renders a plausible chart and only one is right. The CSV/XLSX
      # half of the same window is in test_gantt_api.py and the two must agree, so
      # the boundary cases are deliberately the same ones.
      - name: Gantt export date range (clip, boundaries, dropped-row count)
        run: node scripts/test_gantt_export_range.js
      # Customer/Supplier quick entry. Executed against a stubbed frappe, not
      # grepped, because every rule it holds fails silently: erpnext's stock
      # dialog collected an address and a contact into keys no visible field
      # shows (so what was typed "vanished"), and never offered the Industry the
      # server then demanded. The dialog must ask only for fields the saved form
      # shows, require Industry under exactly data_quality's rule and type list,
      # open the full form after Save (stock stays on the list) without ever
      # navigating away from a form that created the record through a link
      # field, be wholly stock with the toggle off, and raise the "no address"
      # banner only on a record just created -- 70% of Customers and 97% of
      # Suppliers have no address, so anything broader is wallpaper.
      - name: Customer/Supplier quick entry (dialog fields, industry rule, routing, banner)
        run: node scripts/test_party_quick_entry.js

  # ---------------------------------------------------------------------------
  # Version sync — hard gate.
  #
  # release.yml refuses to tag when __init__.py and package.json disagree
  # ("bump both together"), but it only runs after a merge to main — by then
  # the drift has already silently blocked the release (this bit v0.9.0: only
  # __init__.py was bumped, the Release run failed post-merge, and no tag was
  # cut until a follow-up PR). This job runs the same comparison on every
  # push/PR so a half-finished bump fails *before* merge, where it's cheap.
  # ---------------------------------------------------------------------------
  version-sync:
    name: Version sync (__init__.py == package.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare versions
        run: |
          PY=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' erpnext_enhancements/__init__.py)
          PKG=$(sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' package.json | head -1)
          echo "__init__.py: $PY"
          echo "package.json: $PKG"
          if [ -z "$PY" ] || [ "$PKG" != "$PY" ]; then
            echo "::error::Version drift -- __init__.py is '$PY' but package.json is '$PKG'. Bump both together (release.yml will refuse to tag otherwise)."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Committed secrets — a HARD gate, and deliberately its own job.
  #
  # This app has no service-account JSON key anywhere: Drive and Calendar delegate
  # through the VM's own identity, and the retired Google Chat integration did the
  # same (ADR 0009 was keyless by construction, and ADR 0011 removed it entirely).
  # The design removes the credential; this job is what keeps it removed, because
  # the design holds only until somebody drops a key file in the tree to test
  # something locally.
  #
  # NOT a step in `unit-tests`, for one concrete reason: `actions/checkout` clones
  # at depth 1, and the whole point of the scan is HISTORY. `git rm` does not
  # un-publish anything — a key committed and reverted an hour later is still in
  # the pack, still in every clone, still on GitHub. On a shallow clone the script
  # would examine one commit and report a clean history it never read, which is the
  # precise failure mode ("passes because the pattern is wrong") a secret scanner
  # must not have. So: its own job, `fetch-depth: 0`, and the script itself REFUSES
  # to run on a shallow clone rather than reporting a false pass.
  #
  # NO `continue-on-error`. `ruff check` above is advisory by design, because of a
  # known style backlog; that reasoning does not transfer. An advisory secret scan
  # is not a secret scan.
  #
  # Proven, not assumed (2026-08-08): planting a fake service-account key, an OAuth
  # client secret and a base64 token beside a googleapis URL made it exit 1 on all
  # three; removing them returned it to 0 over 2,187 working-tree files and 7,437
  # history blobs in ~22s. Scanning this repo's real history found nothing.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: No committed secrets (working tree + full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Load-bearing. The default depth of 1 makes the history scan a no-op.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scan every tracked file and every blob in history
        run: python scripts/check_no_committed_secrets.py

  # ---------------------------------------------------------------------------
  # NOTE: A Frappe integration-test job (spinning up a real bench with ERPNext
  # + payments and running `bench run-tests --app erpnext_enhancements`) was
  # removed. On the version-16 toolchain it never reached our own assertions —
  # it kept aborting in Frappe's test-record auto-generation, which walks the
  # entire ERPNext doctype dependency graph and tripped over environment gaps
  # one after another (missing utils, uninstalled companion doctypes like
  # "Payment Gateway", etc.). Each fix only surfaced the next, so the job gated
  # PRs on upstream/environment churn unrelated to this app's code. We rely on
  # the standalone `unit-tests` job above instead. The Frappe-dependent test
  # files under erpnext_enhancements/ remain in the tree and can still be run
  # against a real bench locally (`bench --site <site> run-tests --app
  # erpnext_enhancements`); reintroduce a CI job here once the upstream test
  # harness stabilises.
  # ---------------------------------------------------------------------------
