      # courses landing in real inboxes before anybody has read them. The plan assumed that was
      # impossible because Training Settings ships dormant; prod has training_enabled=1 and
      # auto_assign_enabled=1 against 14 live courses, so `status = Draft` is now the only thing
      # holding. Also pins: every spec validates against the REAL validator (one that does not
      # would abort a migrate), every Single Choice question has exactly one answer, and every
      # assignment rule names a Position or Role that actually exists.
      - name: Quality course drafts (Draft is the only thing between these and real inboxes)
        run: python -m unittest erpnext_enhancements.tests.test_quality_training_courses -v
