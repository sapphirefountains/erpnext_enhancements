      # found by an adversarial review afterwards. Three of them were ORDERING
      # bugs -- work done in validate() that Frappe needs before validate runs --
      # and the existing suites could not have caught them, because they stub
      # frappe wholesale and so never exercise the framework's own sequencing.
      # These assert the ordering contract directly, and against the real frappe
      # source when a bench checkout is present (skipped cleanly when not).
      - name: Training regressions (naming/link ordering, role profiles, answer keys)
        run: python -m unittest erpnext_enhancements.tests.test_training_regressions -v
      # Phase 2. progress is the watched-seconds arithmetic that decides whether
      # somebody passed; grading is the only module allowed to read an answer key,
      # and its suite repeats the walk-the-payload-to-any-depth leak test that
      # caught a real leak in Phase 1.
      - name: Training progress (watched-interval merge, server-clock clamp)
        run: python -m unittest erpnext_enhancements.tests.test_training_progress -v
      - name: Training grading (server-side grading, answer-key isolation)
        run: python -m unittest erpnext_enhancements.tests.test_training_grading -v
      # The player and the progress store speak deliberately different shapes and
      # only api.training._normalise_beat knows both. Drift there is SILENT AND
      # TOTAL -- mismatched keys credit zero seconds, so no video lesson can ever
      # be completed and nothing raises. That is not hypothetical: the two halves
      # were first written against each other with `ranges` vs `intervals`,
      # structured vs integer `seeks`, and a nested vs top-level `hidden`.
      - name: Training heartbeat wire format (player <-> progress)
        run: python -m unittest erpnext_enhancements.tests.test_training_heartbeat_wire -v
      # The Phase 3 seams, specified before the code. Four integration breaks got
      # through the Phase 2 fan-out build and every one was two correct halves
      # with a wrong join, so Phase 3's joins are pinned up front instead.
      # Phase-3 assertions SKIP until the files exist -- they are acceptance
      # criteria, not decoration -- while the Phase 2 contracts they build on are
      # enforced now so they cannot drift underneath the build.
      - name: Training Phase 3 seam contracts
        run: python -m unittest erpnext_enhancements.tests.test_training_phase3_contracts -v
      # AI drafting. The load-bearing assertions are about what must NOT happen:
      # drafting never stamps ai_reviewed_by (a pre-reviewed draft walks straight
      # past the submit-for-review gate), and suggest_checkpoints refuses without
      # a timed transcript rather than letting a model invent timestamps.
      - name: Training AI drafting (strict parsing, review gate, transcript gate)
        run: python -m unittest erpnext_enhancements.tests.test_training_ai -v
      # Phase 4 seams. The load-bearing one is compliance: it fires on a maintenance
      # visit or task assignment, by which point a truck is usually already at a
      # site, so a hard block there means the work happens with NO RECORD AT ALL --
      # worse than the uncertified assignment it was flagging. The suite asserts
      # frappe.throw appears nowhere in that module and that an exception inside the
      # check cannot propagate.
      - name: Training Phase 4 seam contracts
        run: python -m unittest erpnext_enhancements.tests.test_training_phase4_contracts -v
      - name: Training certificates (issuance, snapshot, verify PII, recertification)
        run: python -m unittest erpnext_enhancements.tests.test_training_certificates -v
      # The learner API's HTTP surface. Until v1.299.4 none of the thirteen endpoints
      # declared methods=, so every one also answered a GET -- which puts the attempt
      # id, lesson key and checkpoint timestamp into the access log, the browser
      # history and the next Referer header. The client had posted all along and said
      # so in a comment, so the two sides disagreed in the direction where the server
      # was the looser of the two and nothing compared them. Also pins the player's
      # METHOD map against the real function names: a rename with no matching edit
      # there is a 404 the learner sees and CI does not.
      - name: Training endpoint surface (POST-only, and the player's dial map agrees)
        run: python -m unittest erpnext_enhancements.tests.test_training_endpoint_surface -v
      # The transport's own contract. It left www/training.html in v1.429.0, when the
      # portal page stopped being the only host -- four suites already assert things
      # ABOUT it from their own angle, and this is the home for the properties that
      # are its own and that nothing else watches: the 20s deadline (fetch has none,
      # and one hung request freezes the heartbeat for the life of the page), the
      # synchronous boolean sendBeacon (a Promise there is truthy, so video.js drops
      # every queued beat as delivered), the un-set Content-Type on the multipart
      # upload, and the METHOD-above-PREFIX declaration order that three other suites
      # read as a text slice.
      - name: Training transport (deadline, beacon, upload, declaration order)
        run: python -m unittest erpnext_enhancements.tests.test_training_transport -v
      # The learner palette, now that two hosts disagree about what "dark" means. The
      # portal carries no data-theme and follows prefers-color-scheme; the desk always
      # stamps data-theme, having already resolved its own "automatic" mode -- so
      # honouring only the media query put a dark player inside a light desk for anyone
      # whose OS is dark. The two dark blocks are deliberate duplicates (a media block
      # and a plain rule cannot share a declaration list) and this pins them identical,
      # because one edited and the other not is invisible until somebody opens the page
      # in the theme nobody tested.
      - name: Training desk theme (three-way palette, one declaration site)
        run: python -m unittest erpnext_enhancements.tests.test_training_desk_theme -v
      # The learner Desk Page. It is a HOST for the existing player, and nothing at
      # runtime would tell you if it quietly became a second player -- a fork renders
      # perfectly and drifts one commit at a time. Two of these are correctness: the
      # teardown on "hide" (frappe creates the page div once and never removes it, and
      # there is no on_page_hide hook, so without it a <video> keeps downloading and the
      # heartbeat keeps claiming watch time for a lesson nobody is looking at), and the
      # route name (the router resolves segment 0 against workspaces before pages, and
      # allowed_workspaces is per-user, so a page named after a workspace is one URL
      # with two destinations).
      - name: Training desk page (host not fork, teardown, route name)
        run: python -m unittest erpnext_enhancements.tests.test_training_desk_page -v
      # /training retired to a redirect. Both halves fail silently: delete the route
      # and every training email ever sent 404s (six senders have emailed that URL
      # since v1.208.0 and the messages are still in inboxes); keep the page and there
      # are two learner surfaces drifting apart. Every assertion comes in a pair --
      # something absent AND its replacement present -- because "no occurrences of
      # /training" is satisfied just as well by a file somebody emptied.
      - name: Training portal retirement (the route redirects, the links moved)
        run: python -m unittest erpnext_enhancements.tests.test_training_portal_retirement -v
      # Being given a course has to reach the person it is given to. notify_assigned
      # had exactly two callers and hooks.py named Training Assignment only in its two
      # permission hooks, so a manager pressing New produced no email, no bell, no
      # ToDo and no sign of any kind -- the first anybody knew was the overdue sweep
      # days later. This pins that there is exactly ONE path (a doc_event, not a third
      # explicit call), that it cannot abort the insert, and that the ToDo is raised
      # from the enqueued job because assign_to.add can frappe.throw.
      - name: Training assignment notice (one path, and it cannot break the insert)
        run: python -m unittest erpnext_enhancements.tests.test_training_assignment_notice -v
      # Chaptered video. The vertical mirrors in-video checkpoints -- standalone
      # doctype keyed by (lesson, block_key), authored on the canvas, serialized at
      # publish, read by video.js -- and stops mirroring at one place worth pinning:
      # chapters are PUBLIC where checkpoints are not, because a chapter is a label
      # and a number and has to reach the browser to be clickable. Also pins that no
      # new endpoint was added (they ride the get_lesson payload) and that the editor
      # is offered only on a real Video block, since an External Embed is a
      # cross-origin iframe with no currentTime and no seek.
      - name: Training video chapters (public payload, no new endpoint, real video only)
        run: python -m unittest erpnext_enhancements.tests.test_training_video_chapters -v
      # The Training rail -- one sidebar shared by the learner page and the manager
      # dashboard. Three silent failures: a class the script emits with no rule in the
      # stylesheet renders as an unstyled div; a link offered to somebody the Page
      # refuses lands them on "Not permitted", which reads as broken rather than as not
      # theirs (so the role lists are asserted against the Page documents); and the rail
      # must keep taking the boot payload the player already fetched rather than growing
      # a read of its own, because "open" and "overdue" are predicates the server
      # defines and a nullable-date filter written in the browser is how "no expiry"
      # once became "expired" here.
      - name: Training desk rail (class contract, role gate, no second read)
        run: python -m unittest erpnext_enhancements.tests.test_training_desk_nav -v
      # The training dashboard. Two things are gated here and one of them is a
      # DECISION rather than a bug: scores never reach a manager. What makes that
      # durable is the shape -- get_person_dashboard does not build them, so there
      # is no key to omit and no argument that can put them back. A filter would be
      # one refactor away from leaking; an absent branch is not. The other is that
      # nothing is counted twice: "open", "overdue" and "visible" are predicates
      # owned by api/training.py, and this module has already shipped the cost of a
      # second definition twice.
      - name: Training dashboard (no scores to a manager, no second predicate)
        run: python -m unittest erpnext_enhancements.tests.test_training_dashboard -v
      # Uploading a video without putting it through the site. The obvious build does
      # NOT work: frappe enforces a 25MB ceiling twice and streams the body through a
      # gunicorn worker synchronously, so pointing FileUploader at a video fails on any
      # real one and would take the site down for the ones it accepted. These pin that
      # the bytes go browser -> bucket, that the two things a browser is not trusted
      # for stay untrusted (the object name is minted server-side; the size is re-read
      # from GCS), and that a zero duration is refused -- because duration_source
      # 'Manual' makes grading waive the video-coverage gate ENTIRELY.
      - name: Training video upload (browser to bucket, nothing through a worker)
        run: python -m unittest erpnext_enhancements.tests.test_training_video_upload -v
      # Every dotted path in hooks.py must name something that exists. Frappe
      # resolves after_migrate at the very END of `bench migrate`, so a typo there
      # fails the deploy after every schema change has already been applied -- the
      # most expensive possible moment to find one. It cost a production build.
      - name: Hook targets resolve (no dangling hooks.py paths)
        run: python -m unittest erpnext_enhancements.tests.test_hook_targets_resolve -v
      - name: Training compliance (warn-only, never blocks a save)
        run: python -m unittest erpnext_enhancements.tests.test_training_compliance -v
      # Regressions from the FIRST REAL EXECUTION of the module. Four phases of
      # reading found a lot; running it once found three more, and the most useful
      # assertion here is static: every field name written through _doc_payload is
      # cross-checked against the DocType JSON. That would have caught the score
      # bug -- a learner who scored 100 getting a certificate reading 0 -- before it
      # ever ran, with no bench required.
      - name: Training runtime regressions (field names, sign-off gate)
        run: python -m unittest erpnext_enhancements.tests.test_training_runtime_regressions -v
      # The authoring ENTRY PATH, as opposed to any single function on it. Both of
      # the first two bugs here were reported by a real author on day one and
      # neither is catchable by unit-testing a function: a placeholder that
      # outlived its feature, and a refusal that named the wrong state. Static
      # reads of the desk JS, which never runs in CI and has no bench here.
      # `test_training_builder_entry` was deleted with the classic builder in v1.422.0 (R3).
      # Its 50 tests guarded that page's internals; the page is gone, and the canvas suite
      # below is what guards authoring now.
      # The WYSIWYG canvas. This suite existed from the day the canvas shipped and
      # was never wired here, so the one Training surface with no CI coverage was
      # the one an author spends all day in -- and it held a live defect
      # (`callout_tone: "info"` against a Select declaring Tip/Warning/Danger)
      # that killed the whole lesson autosave on the first Callout anyone created.
      - name: Training canvas (WYSIWYG authoring surface)
        run: python -m unittest erpnext_enhancements.tests.test_training_canvas -v
      # Are the suites above collectable the way a DEVELOPER runs them, not just the
      # way this file runs them? `python -m unittest <module>` collects every TestCase
      # wherever it is declared; `python <file>` stops at `unittest.main()`. Eight
      # suites had that block in the middle, hiding 211 tests from the direct run --
      # test_training_boot_wire collected 29 of 100, test_training_canvas 62 of 94, and
      # the 32 it dropped were the newest ones, i.e. exactly what their author was most
      # likely to be checking. CI never noticed because CI uses the other path. A green
      # run over a subset is worse than no run, so this fails the build on it.
      - name: Tests are collectable both ways they are run
        run: python -m unittest erpnext_enhancements.tests.test_test_collection -v
      # Retiring the classic Training Builder (R2). The POLARITY is the whole design:
      # Training Settings is a Single, and a `default` on a NEW field of a Single never
      # reaches the row that already exists, so every live site reads None -> 0. The flag
      # is named `classic_builder_retired` with default 0 so that reading IS the status
      # quo. The inverse -- `_enabled` defaulting to 1 -- would switch the builder off on
      # prod the day it deployed, chosen by nobody, while the JSON still read 1 so every
      # cheap check said it was on. This suite also refuses to let the switch exist while
      # anything in the app still routes to the page it closes.
      - name: Classic builder retirement flag (polarity, gate, reversibility)
        run: python -m unittest erpnext_enhancements.tests.test_classic_builder_retirement -v
      # The chat module's retirement (ADR 0011, v1.426.0). Two sweeps and a survivor list.
      #
      # The survivor half is the one that earns its place: three things the deletion nearly
      # took with it were all SILENT. `triton_widget.js` imports three browser modules that
      # lived under `public/js/chat/` and ships in the GLOBAL Desk bundle, so a stale import
      # is a failed `bench build` -- which the deploy runs AFTER `bench migrate` has already
      # committed. And ~60 lines of decision #7's citation CSS sat inside the "PHASE 3" block
      # that was otherwise deleted wholesale; losing them strips inline citations off every
      # Triton answer with nothing anywhere failing.
      - name: Chat module retirement (the sweep, and what had to survive it)
        run: python -m unittest erpnext_enhancements.tests.test_chat_module_retirement -v
      # The Single default-drift backfill. This patch keys on FALSINESS, which is the
      # opposite of the chat settings backfill this repo used to carry, and unsafe in
      # general -- every one of
      # its 22 fields already HAS a tabSingles row holding '0', so the row-absence predicate
      # would match nothing, commit, and log itself as a success (the v1.280.3 shape). What
      # makes it safe is the contents, not the predicate: no Check field is in the table, so
      # it cannot re-tick a box anyone deliberately unticked. That is the assertion this
      # suite exists for, plus the migrate-safety mechanics (set_single_value never save(),
      # never a direct tabSingles read, guarded and wrapped so it cannot abort the deploy).
      - name: Single default drift backfill (table, safety, migrate mechanics)
        run: python -m unittest erpnext_enhancements.tests.test_single_default_drift -v
      # frappe.rename_doc on a DOCTYPE does not move its stored passwords: a Password field
      # keeps a masked placeholder in tabSingles and the real encrypted value in __Auth,
      # keyed by (doctype, name, fieldname). The Poseidon->Triton rename stranded four
      # secrets, invisibly, because a Password field renders blank either way -- so every
      # Vertex feature had never worked and every inbound Twilio webhook was rejected. This
      # suite pins the two properties that make the repair safe against live credentials:
      # it never materialises the plaintext (re-files the row, never decrypts, never selects
      # `password`), and it never rolls a hand-entered newer credential backwards.
      - name: Renamed-doctype secrets (__Auth rescue, no plaintext, no rollback)
        run: python -m unittest erpnext_enhancements.tests.test_renamed_doctype_secrets -v
      # WI-074 F. The load-bearing fact this pins: Position requirements do NOT inherit down
      # the tree -- progression.requirements_for and skills_matrix each read ONE doc's own
      # child table, neither walks parent_position. So a baseline on the All Positions root
      # would apply to nobody, and every leaf spells out its whole set (Driver's License
      # appears 19 times and that is not duplication). If inheritance is ever added the seed
      # becomes 19-fold duplication overnight and nothing else would notice. Also pins that
      # is_mandatory means something rather than being set everywhere, that the seed cannot
      # overwrite a hand-edit, and that the leaver backfill checks existence BEFORE calling
      # ensure_checklist (which returns the EXISTING name, so a count from its result would
      # report success over nothing).
      - name: Position requirements seed + leaver backfill (WI-074 F)
        run: python -m unittest erpnext_enhancements.tests.test_position_requirements_seed -v
      # Does recording a sign-off actually finish anything? It did not: Training
      # Signoff had no on_submit at all, so `Competent` moved nothing and the
      # assignment stayed at "Awaiting Sign-off" for ever. Same suite pins the
      # recertification window on the attestation (a check that PASSED when it
      # should have failed) and the row-scoping on the three doctypes that grant
      # Training Learner read -- a role customer Website Users hold.
      - name: Training sign-off loop (on_submit, expiry, row scoping)
        run: python -m unittest erpnext_enhancements.tests.test_training_signoff_loop -v
      # The HR module, and mostly one question: can the people it is for actually
      # SEE it? A Frappe workspace whose module is not in the user's allow_modules
      # does not 403, it silently is not there -- desktop.py raises PermissionError
      # and the sidebar builder swallows it -- and allow_modules is built only from
      # DocPerms. `Position` granting read to `Employee` is what holds that door
      # open for ordinary staff, so it is asserted rather than assumed. Also pins
      # the tier predicate (never a peer, never across job families, never a
      # retired rung) and checks the workspace has no dead card/shortcut references,
      # which render as blank space with no error.
      - name: HR module (reachability, position ladder, workspace wiring)
        run: python -m unittest erpnext_enhancements.tests.test_hr_module -v
