      # because each suite installs its own `frappe` stub in setUpModule and they cross-talk
      # in a shared process -- run together these six go red for reasons that have nothing to
      # do with the code under test.
      - name: Chat write path / outbox (seq allocation, relay refusal, edit+delete ordering)
        run: python -m pytest erpnext_enhancements/tests/test_chat_outbox.py -q
      - name: Chat outbound relay (state machine, token bucket, sweeper, kill switch, chaos 4-9)
        run: python -m pytest erpnext_enhancements/tests/test_chat_outbound.py -q
      - name: Chat inbound ingest + Pub/Sub puller (echo ladder, the §4.D race, defer timer)
        run: python -m pytest erpnext_enhancements/tests/test_chat_inbound.py -q
      - name: Chat provisioning + membership (three modes, revert cap, converging diff)
        run: python -m pytest erpnext_enhancements/tests/test_chat_provisioning.py -q
      - name: Chat attachments (permission parity, upload cost, Drive links stay links)
        run: python -m pytest erpnext_enhancements/tests/test_chat_attachments.py -q
      - name: Chat subscription lifecycle + reconciliation sweep (chaos 10)
        run: python -m pytest erpnext_enhancements/tests/test_chat_subscriptions.py -q
      # Raw SQL is the one path the permission stack does NOT cover: a
      # permission_query_conditions fragment is appended by get_list and by nothing else, and
      # frappe.get_all is get_list(ignore_permissions=True) wearing a friendlier name. So this
      # walks every module under chat/ with `ast` and asserts each raw query either lives in an
      # allowlisted operational table or ANDs in permissions.membership_filter_sql itself.
      # Mutation-tested in both directions when it was written: a planted non-compliant query
      # turns it red and naming the offender, and the same query with the filter turns it green.
      - name: Chat raw-SQL membership guard (the likeliest route to a real data leak)
        run: python -m unittest erpnext_enhancements.tests.test_chat_rawsql_guard -v
