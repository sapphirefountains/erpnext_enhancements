      # must say so rather than draw an empty checklist, because an empty checklist
      # reads as "ready". Same failure shape as the dispatch advisory that could
      # never fire and the whitespace queries that passed vacuously.
      - name: HR progression (the route up the ladder, and the empty case)
        run: python -m unittest erpnext_enhancements.tests.test_hr_progression -v
