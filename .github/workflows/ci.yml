      #
      # What makes the step worth having rather than folding in: the safety argument
      # is an ORDERING -- exact match first, model only on an answer already
      # rejected, so the AI can be generous and never harsh -- and an ordering is
      # exactly what a tidy-up reverses without changing any other assertion. It is
      # pinned by execution with a judge stubbed to reject everything, and verified
