name: CI

# `push` is scoped to main ON PURPOSE. With a bare `push:` every commit on a PR
# branch fired the workflow TWICE -- once for `push`, once for `pull_request` --
# because the two events carry different `github.ref` values
# (`refs/heads/<branch>` vs `refs/pull/<n>/merge`) and so landed in different
# concurrency groups, deduplicating neither. Four jobs became eight competing for
# runners on every push.
#
# That was merely wasteful until 2026-08-06, when a GitHub Actions capacity
# incident turned it expensive: the doubled demand met a starved queue, and
# `cancel-in-progress` then cancelled the losers -- and a CANCELLED job makes its
# whole run report `failure`. So PRs showed red X's for jobs that had never run,
# on commits with nothing wrong. A red X that means "a duplicate got cancelled"
# teaches people to skim past red X's, which is the same rot as an advisory lint
# job nobody reads.
#
# Every branch here is merged via a PR, so the `pull_request` run is the one that
# matters; scoping `push` to main keeps CI on the deploy branch (main deploys
# automatically) without re-running the same commit twice. The trade-off, stated
# plainly: a branch pushed with NO open PR now gets no CI until the PR is opened.
on:
  push:
    branches: [main]
  pull_request:

# Keyed on the PR number for PR runs so a new commit supersedes the previous run
# for that same PR -- which is what cancel-in-progress is actually for. Falls
# back to `github.ref` for pushes to main. Before this, cancellation happened
# between two events racing over one commit, which is not a supersede at all.
# Cancellation is for PRs only. On a PR, a newer commit genuinely supersedes the
# older run -- same branch, same question, stale answer. On `main` it does not:
# every push is a DIFFERENT commit, and cancelling one to start the next means
# the superseded commit's CI never finishes.
#
# That is not hypothetical. On 2026-08-07 four `main` runs were cancelled, three
# of them within 31 seconds, because PRs were merged back to back. Each of those
# commits had passed CI as a PR -- but a PR runs against the *merge ref* as main
# stood at that moment, so the run on `main` is the only check of the tree that
# actually resulted. Three merged states were never validated, and `main` deploys
# automatically.
#
# So: supersede on PRs, never on main. The cost is that back-to-back merges queue
# instead of collapsing, which is the correct trade for the deploy branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Lint — advisory, but much closer to a gate than it was.
  #
  # v1.253.2 ran `ruff check --fix` across the app (306 findings: whitespace,
  # import sorting, f-strings, stale noqa) and moved RUF001/2/3 to the ignore
  # list, since every occurrence was deliberate typography — en dashes, `×` in
  # dimensions, a real minus sign — that "fixing" would have rewritten into ASCII.
  # That took the backlog from 429 to 73.
  #
  # The remaining 73 are NOT auto-fixable and are judgement calls, not bugs:
  # B905 (`zip()` without `strict=`) is a behavioural decision per call site,
  # E722 (bare `except`) is deliberate in the defensive handlers this app relies
  # on, and the rest are idiom preferences (UP030/UP031, RUF005/007/012/015/046).
  # Clearing those, then `ruff format` (391 files, ~68k lines — time it when
  # nothing is in flight), is what stands between here and dropping
  # `continue-on-error`. Tracked as TASK-2026-01241 on PRJ-00580.
  #
  # F821 is already a hard gate in its own job below; that is the rule that
  # actually catches runtime failures, and it does not wait for this.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.1
      - name: ruff check
        continue-on-error: true
        run: ruff check erpnext_enhancements/ --output-format=github

  # ---------------------------------------------------------------------------
  # Undefined names — a HARD gate, carved out of the advisory job above.
  #
  # F821 is not style. An undefined name is a NameError at runtime, and this app
  # swallows exceptions on purpose in the places it is most likely to bite:
  # scheduler jobs, doc_events and notification helpers all wrap their bodies in
  # `except Exception: frappe.log_error(...)` so a notification problem cannot
  # cost the work it was reporting on. That guard is correct — and it converts a
  # NameError into silence.
  #
  # It already had. `kpi_dashboards/snapshots.py` used `_()` without importing
  # it, so the marketing data-source alert raised NameError on every firing, got
  # swallowed, and logged under a title reading "KPI marketing web — source
  # alert" — which looks like the ALERTING broke, not the data source. A dead GA4
  # or Search Console feed therefore produced no notification at all, and the one
  # thing standing between a stale marketing number and somebody reading it as
  # real had never once run. Fixed in v1.250.1; this stops it recurring.
  #
  # Separate job rather than a step in "Lint (ruff, advisory)" so that job's name
  # stays honest and a red build here is unambiguous about what broke. Deliberately
  # ONE rule: the wider 433-finding style backlog stays advisory above.
  # ---------------------------------------------------------------------------
  undefined-names:
    name: No undefined names (F821)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.1
      - name: ruff check --select F821
        run: ruff check erpnext_enhancements/ --select F821 --output-format=github

  # ---------------------------------------------------------------------------
  # Standalone unit tests — no Frappe/bench required, so they run fast on every
  # push. Covers the time-kiosk consolidation algorithm, plus the bench-free
  # suites that guard the security-sensitive AI write gate
  # (assistant_tools/_gate.py), the FAC assistant-tool contract, and the
  # Integrations Health tone helpers. The latter three import their tool
  # modules under the sys.modules stubs installed by test_assistant_tools_schema
  # (no live frappe / FAC), so they run here as plain unittest. A final check
  # (test_doctype_modules) asserts every custom DocType sits in its declared
  # module — pure filesystem, no stubs.
  #
  # The QuickBooks Online suite is bench-free too but is plain pytest functions
  # (the `monkeypatch` fixture), which `python -m unittest` silently cannot
  # collect — it ran nowhere in CI and broke unnoticed for weeks. It gets its
  # own pytest step below; any future pytest-style bench-free suite belongs on
  # that step, not the unittest module list.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Standalone unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip httpx pytest jinja2
      - run: python -m unittest test_sync_time_kiosk.py -v
      # test_chat_mcp_denylist is APPENDED here rather than given its own step, and it is
      # the one place in this file where appending is right rather than wrong: it exercises
      # _gate.py under the sys.modules stub set that test_assistant_tools_schema installs,
      # so it needs to share a process with it. Every other bench-free suite gets its own
      # step precisely so the stub sets cannot cross-talk.
      - name: AI gate + assistant-tool contract + integrations health + device mgmt
        run: >-
          python -m unittest
          erpnext_enhancements.tests.test_assistant_tools_schema
          erpnext_enhancements.tests.test_ai_gate_unit
          erpnext_enhancements.tests.test_chat_mcp_denylist
          erpnext_enhancements.tests.test_integrations_health
          erpnext_enhancements.tests.test_device_management
          erpnext_enhancements.tests.test_mdm_integration
          erpnext_enhancements.tests.test_drive_match -v
      # Its own step, and not appended above, because it installs its own `frappe` stub —
      # the rule every bench-free suite here follows except the one noted above.
      #
      # It guards two things that failed silently in production: that a Triton error body
      # gives up its `code` and `request_id` and NEVER its `message` (the message can quote
      # the prompt, and the prompt is the transcript), and that a cached Triton session id
      # Triton no longer has costs one retry rather than thirty days of a dead room.
      - name: Triton chat client + bot credential link
        run: python -m unittest erpnext_enhancements.tests.test_chat_triton_client -v
      # Also its own step, and for the same reason: `chat/invoke/handler.py` reaches the
      # invocation-log controller at import, so this one needs `frappe.model.document` on
      # top of the client suite's stubs.
      #
      # It guards the *other* half of that message rule. The client is careful never to log
      # a Triton error body; the handler was so careful it logged nothing at all, recording
      # `model turn failed: TritonUnavailable` for four unrelated causes in four different
      # files. The message that class carries is written to be safe — and only that class's.
      - name: Triton model-failure detail (the reason survives, and only the safe one)
        run: python -m unittest erpnext_enhancements.tests.test_chat_invoke_failure_detail -v
      # The A1 read tools each wrap a function that returns more than a reader
      # should see: a live billable Google Maps browser key, the e-signature
      # evidence (token hashes, the agreement text as signed, signature image,
      # signer IP, consent wording), a certificate's verification code, and
      # per-learner answers behind an "aggregate" item analysis. Static, and
      # checked against the live doctypes, so a field renamed later cannot drop
      # out of the list it is supposed to be in.
      - name: Assistant tool redaction (what the read tools must never return)
        run: python -m unittest erpnext_enhancements.tests.test_assistant_tools_redaction -v
      # KPI Snapshot's DocPerms had to widen past System Manager for the KPI
      # assistant tool to be visible to the managers who own the numbers, and a
      # DocPerm is doctype-wide -- so the widening only stays safe while the row
      # filter ships with it. This pins both halves together, and pins that
      # "HR User" is never granted: it is one keystroke from the correct role and
      # every employee on this site holds it.
      - name: KPI Snapshot permissions (widened reads stay department-scoped)
        run: python -m unittest erpnext_enhancements.tests.test_kpi_snapshot_permissions -v
      # Three UOM patches whose ORDER is load-bearing: the Gallon rename has to
      # land before the disable pass, or that pass sees `Gallon` unused and
      # switches off a UOM three live documents point at. Also pins that the
      # rename is an EXACT match -- `Pound/Gallon (UK)` and friends are densities,
      # and a substring rename would merge two different units in a system that
      # prices by them.
      - name: UOM cleanup (rename, disable, default)
        run: python -m unittest erpnext_enhancements.tests.test_uom_cleanup -v
      # Notification recipients. Two things that are easy to get wrong and
      # invisible when they are: `company@` is the WHOLE-COMPANY mailing list, so
      # a routine alert there mails everyone; and the document-field recipients
      # (New ToDo -> allocated_to, Remind Me -> user) are personal BY DESIGN, so
      # "point everything at groups" applied literally breaks the one case where a
      # named individual is the entire purpose. Also pins that every Notification
      # fixture carries an explicit `enabled: 1` -- without it they import
      # disabled and re-disable on every migrate.
      - name: Notification recipients (group addresses, and the exceptions)
        run: python -m unittest erpnext_enhancements.tests.test_notification_recipients -v
      # The activity feed and its stylesheet are two halves of one behaviour, and
      # they fail silently apart: a class nothing styles, or a rule nothing sets.
      # Also pins that the first tab is found POSITIONALLY -- several of our
      # doctypes have renamed Details to Overview or Summary, so a title check
      # would quietly stop matching and the feed would follow you around again.
      - name: Activity feed on the first tab only (JS + CSS agree)
        run: python -m unittest erpnext_enhancements.tests.test_activity_first_tab_only -v
      # The payment step's follow-up button and its two whitelisted endpoints.
      # The suites that exercise the real behaviour need a bench and so never
      # run here -- which is why the seam is pinned statically: a renamed
      # endpoint or a dropped STEP_ACTIONS entry raises nowhere, the button
      # just stops working in production. Also pins the step rename, which
      # lives in three places at once (seed patch, migration, prose).
      - name: Initial-payment follow-up wiring + step rename
        run: python -m unittest erpnext_enhancements.tests.test_payment_followup_wire -v
      - name: DocType module placement
        run: python -m unittest erpnext_enhancements.tests.test_doctype_modules -v
      # Filesystem + ast only, its own step like every other bench-free suite that
      # installs no stub set. Guards the marketing data model's three silent-failure
      # promises: POSITIVE_DIALS agreeing with the JSON defaults it heals to, the
      # identity fields the record names are built from staying set_only_once (the
      # restate-as-upsert guarantee), and no credential-shaped field appearing on a
      # doctype Sales Manager can read.
      - name: Marketing settings dials + ad-model identity
        run: python -m unittest erpnext_enhancements.tests.test_marketing_settings -v
      # The placement test above says a DocType is in the right folder. This one says the
      # folder gets INSTALLED. Adding a module to modules.txt is not sufficient on an
      # already-installed site: frappe.model.sync.sync_for() iterates
      # frappe.local.app_modules, a snapshot taken once at frappe.init() from redis that no
      # part of `bench migrate` rebuilds. A migrate that starts with a stale snapshot walks
      # the PREVIOUS release's module list, skips the whole new module folder, creates no
      # table, logs nothing and exits 0 -- and the post_model_sync patches that touch those
      # tables burn their Patch Log entries against a schema that is not there, which in
      # Frappe means they can never run again. v1.261.0 shipped the Chat module exactly
      # that way on 2026-08-09. Unittest (TestCase-based), so it belongs on this step list
      # and NOT on a pytest step.
      - name: Module installability (modules.txt alone does not install a module)
        run: python -m unittest erpnext_enhancements.tests.test_module_installability -v
      # Same failure shape as the www/ controller check: Frappe computes a script
      # report's import path from scrub(report_name) rather than reading the
      # directory, so a plausibly-misnamed folder migrates cleanly, lists in the
      # desk, and only 500s when somebody opens the report. Two "Hand-Off ..."
      # reports shipped that way -- scrub() turns the hyphen into its own
      # underscore (hand_off_), the hand-written folder said handoff_.
      - name: Report module placement (folder == scrub(report_name))
        run: python -m unittest erpnext_enhancements.tests.test_report_modules -v
      # hooks.py is one big dict literal, and Python resolves a repeated key by keeping
      # the LAST and silently discarding the earlier value -- no error, no warning, the
      # hooks just never fire. Two duplicated doc_events keys cost six live handlers
      # (recurring task generation, project date sync, next-visit dates) and nobody
      # noticed, because the symptom is absence. ruff flags it as F601 but that job is
      # advisory here, so it does not fail a PR. This does.
      - name: hooks.py integrity (no duplicate keys or handlers)
        run: python -m unittest erpnext_enhancements.tests.test_hooks_integrity -v
      # Guards the silent workspace failure mode: `content` (the layout) and the
      # child tables (the data) are joined by label and nothing keeps them in sync,
      # so a block with no row renders an empty div and a row with no block never
      # appears. v1.146.0 shipped exactly that across seven widgets.
      - name: Workspace structure (content <-> child rows, WI-018)
        run: python -m unittest erpnext_enhancements.tests.test_workspaces -v
      # The customer-facing sales formats. A print format fails in the worst way --
      # the deploy succeeds, nothing logs, and the defect is found by a customer
      # holding the PDF. This compiles AND renders all three against sample documents
      # (1 item, 10 items, no items, no taxes, every optional field blank).
      - name: Sales print formats (WI-020, bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_sales_print_formats -v
      - name: PO approval threshold (WI-013, bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_po_approval -v
      # Purchase Order Order Stage. Pins the backfill rule, which CANNOT key on an empty
      # column -- Purchase Order is a normal doctype, so the ALTER that adds the field
      # writes its default into all 157 existing rows, and an emptiness predicate would
      # match nothing and log itself a success (the v1.280.3 failure). Also pins that the
      # Select options come from one list, and that neither Purchase Receipt hook can
      # raise or assume the column exists.
      # Own step: installs its own frappe stub in setUpModule.
      - name: Purchase Order order stage (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_po_order_stage -v
      # Two things about the Purchase Order format, both invisible until production.
      # WHAT IT SAYS: our address and phone in the header -- the address prefers the
      # document's billing_address_display and the phone is a constant, because the
      # number is stored nowhere in ERPNext. WHICH RIVALS GO: the three that ship with
      # ERPNext re-sync from its JSON on migrate, so a patch that deleted them would
      # appear to work and undo itself at the next migrate -- and nobody looks again
      # until they print a PO weeks later.
      # Own step: installs its own frappe stub in setUpModule to exec the setup module.
      - name: Purchase Order print format (contents + delete vs disable)
        run: python -m unittest erpnext_enhancements.tests.test_purchase_order_print_formats -v
      # Own step: installs its own frappe stub in setUpModule, so it must not
      # share a process with the other bench-free suites.
      - name: Administrator login alerts (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_security_alerts -v
      # Frappe v16 force-downloads FOUR extensions from /private/files/ and serves everything
      # else inline; frappe's own develop branch widened that list to fourteen. The seven in
      # the gap (.xhtml .svgz .shtml .mhtml .xsl .xslt .swf) are served from OUR origin with a
      # scriptable Content-Type and Content-Disposition: inline - stored XSS with the viewer's
      # session cookies. Anyone who can attach a file to anything can upload one.
      #
      # Fixed in monkeypatches.py rather than nginx because startup_script.sh runs
      # `bench setup production` on every boot, which regenerates the nginx config from bench's
      # template - a hand-edited rule is erased at the next reboot.
      #
      # Own step: installs its own frappe stub in setUpModule.
      - name: Private files are never served inline (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_private_file_serving -v
      # Guards the "routes the truck to the wrong address, confidently" class of
      # bug: the supplier pick-up address fallback order, our own yard never
      # becoming a stop, and the PO -> Project union that either link alone drops.
      - name: Supplier pick-up routing (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_pickup_routing -v
      # Guards the "set a primary here, silently re-point it over there" class of
      # bug: is_primary_contact / is_primary_address are columns on the
      # Contact/Address record, so only Customer and Supplier can own them. A
      # Project or Opportunity context must be refused, not quietly applied to
      # whichever account happened to be nearby. Also fences the Supplier path
      # that the pick-up routing address ordering depends on.
      - name: Primary contact/address scoping (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_sync_contact_primary -v
      # Own step, not folded into a multi-module list: each bench-free suite
      # installs its own `frappe` stub in setUpModule, and a separate process
      # keeps them from cross-talking.
      - name: PO separation of duties (WI-066, bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_po_segregation -v
      # Guards the seeded mermaid charts (must start with "graph ", no raw "<",
      # no pre-escaped entities). It existed but ran nowhere until WI-066.
      - name: Seeded process documents (mermaid contract)
        run: python -m unittest erpnext_enhancements.tests.test_process_documents -v
      - name: Contract e-signature (tokens, sig() fallthrough, template patch)
        run: python -m unittest erpnext_enhancements.tests.test_contract_esign -v
      # Own step for the same reason as the suites above: its frappe stub points
      # get_app_path at the repo so the real logo.svg is read. Guards the print
      # format fixture too — the footer's #footer-html / .page / .topage hooks
      # and the one rule that keeps that footer off every non-PDF surface.
      - name: Contract branding (letterhead, footer, print CSS)
        run: python -m unittest erpnext_enhancements.tests.test_contract_style -v
      - name: KPI dashboard metrics (pure math) + cockpit workspace constants
        run: >-
          python -m unittest
          erpnext_enhancements.tests.test_kpi_metrics
          erpnext_enhancements.tests.test_custom_html_blocks -v
      # Department dashboard widgets: the registry, the settings toggles, the
      # seeder's placement map and the shipped workspace JSONs must agree. A
      # placement naming an unseeded block renders an empty div with no error, so
      # the wiring is asserted here rather than discovered on a dashboard.
      - name: Department dashboard widget wiring
        run: python -m unittest erpnext_enhancements.tests.test_dashboard_widgets -v
      # Own step: installs its own frappe stub in setUpModule, so it must not
      # share a process with the other stub-installing suites.
      #
      # The F821 job guards the bug class statically; this guards the BEHAVIOUR
      # that class was hiding. The marketing source alert raised NameError on
      # every firing and the function's own `except Exception` swallowed it, so
      # a broken GA4 feed notified nobody and the only trace was an Error Log row
      # that read as though the alerting had failed. The load-bearing assertions
      # are therefore "a failing source notifies somebody" and "no Error Log row
      # is written" -- before the fix those were exactly inverted.
      - name: KPI marketing source alert (a dead feed must notify)
        run: python -m unittest erpnext_enhancements.tests.test_kpi_source_alert -v
      # Pure filesystem, like test_doctype_modules: it reads the desk JS rather
      # than running it, because there is no JS runner here and the Project
      # toolbar is assembled by five scripts that cannot see each other.
      #
      # This suite shipped with v1.183.0 and was never added to any step, so it
      # ran NOWHERE -- the exact failure mode CLAUDE.md warns about -- and the
      # regression it existed to catch shipped anyway: project_form_script.js was
      # hiding the whole "View" dropdown, so the Project Brief button that same
      # release folded into it was invisible on every project for a week.
      - name: Project toolbar grouping (bench-free, source-level)
        run: python -m unittest erpnext_enhancements.tests.test_project_toolbar -v
      - name: Water engineering (pure engine + design issues + controller helpers)
        run: >-
          python -m unittest
          erpnext_enhancements.tests.test_water_engine
          erpnext_enhancements.tests.test_water_design_issues
          erpnext_enhancements.tests.test_water_design_controller -v
      # Own step: this suite installs its own frappe stub in setUpModule, so it
      # must not share a process with the other stub-installing suites. It guards
      # the hourly Drive shadow sync's survival when the DB connection drops
      # mid-run -- the failure mode that leaves no trace anywhere, because the
      # error handler's own rollback and log_error both need the connection it
      # just lost.
      - name: Drive shadow sync (survives a dropped DB connection)
        run: python -m unittest erpnext_enhancements.tests.test_drive_sync_recovery -v
      # Own step for the same reason -- its own frappe stub in setUpModule.
      # Guards the two v1.254.0 Error Log fixes: the Task -> Google Calendar
      # payload (which called .isoformat() on a field that is a str on the
      # after_insert doc, and so failed on every Task created through the desk),
      # and the log_error circuit breaker that exists because one expired
      # credential wrote 44,069 Error Log rows in thirty hours.
      - name: Error Log fixes (calendar payload + log_error circuit breaker)
        run: python -m unittest erpnext_enhancements.tests.test_error_log_fixes -v
      # Own step, same reason -- its own frappe stub in setUpModule, plus a fake
      # googleapiclient (the real one is NOT installed on this runner, and both
      # finance_calendar.py and drive_sync.py import HttpError at module scope).
      # Covers the five v1.254.0 behaviour changes that shipped untested: the
      # Google-API error handling, the migrate guard, the Drive retry, and both
      # permission hooks.
      - name: Error Log follow-up (API error handling, migrate guard, retries, permissions)
        run: python -m unittest erpnext_enhancements.tests.test_error_log_followup -v
      # Own step for the same reason -- its own frappe stub in setUpModule. Guards
      # the linked-folder reconciliation: a deleted Drive folder must end up
      # flagged ON THE RECORD, or the Open Drive Folder button keeps handing
      # people a Google 404 (PRJ-00706).
      - name: Drive link reconciliation (dead folders are flagged on the record)
        run: python -m unittest erpnext_enhancements.tests.test_drive_link_reconcile -v
      # THREE separate steps, not one `unittest a b c`. Each installs its own
      # frappe stub in setUpModule, and running them in one process cross-talks:
      # the roles suite imports the real erpnext_enhancements.training.roles, and
      # `from ... import roles` in training.assignment then resolves the attribute
      # already set on the package rather than the assignment suite's stub. That
      # combination fails; individually all three pass. Verified 2026-08-01.
      #
      # The publish suite is the load-bearing one: it walks the serialized
      # learner-facing payload to any depth and fails if a correct-answer marker
      # appears anywhere, so a newly added field that leaks the quiz key is caught
      # here rather than by a learner. It already caught one — per-option feedback
      # text ("why this option is wrong") was being shipped before the learner
      # answered.
      - name: Training publish (answer key never reaches the learner payload)
        run: python -m unittest erpnext_enhancements.tests.test_training_publish -v
      - name: Training roles (desk_access, profile-vs-direct grant)
        run: python -m unittest erpnext_enhancements.tests.test_training_roles -v
      - name: Training assignment rules (targeting, first-match, save guards)
        run: python -m unittest erpnext_enhancements.tests.test_training_assignment_rules -v
      # V4 signing is hand-rolled (google-cloud-storage cannot be installed on
      # the host), and it has exactly one failure mode worth guarding: a subtly
      # wrong signature still produces a well-formed URL, and the only symptom is
      # an opaque 403 from GCS that is impossible to diagnose by inspection. So
      # this suite rebuilds the string-to-sign independently from the spec and
      # compares, rather than asserting the implementation's own output.
      - name: Training media (V4 signed URL canonical request)
        run: python -m unittest erpnext_enhancements.tests.test_training_gcs_media -v
      # Regressions for four defects that shipped in 1.207.0-1.209.0 and were
      # found by an adversarial review afterwards. Three of them were ORDERING
      # bugs -- work done in validate() that Frappe needs before validate runs --
      # and the existing suites could not have caught them, because they stub
      # frappe wholesale and so never exercise the framework's own sequencing.
      # These assert the ordering contract directly, and against the real frappe
      # source when a bench checkout is present (skipped cleanly when not).
      - name: Training regressions (naming/link ordering, role profiles, answer keys)
        run: python -m unittest erpnext_enhancements.tests.test_training_regressions -v
      # Phase 2. progress is the watched-seconds arithmetic that decides whether
      # somebody passed; grading is the only module allowed to read an answer key,
      # and its suite repeats the walk-the-payload-to-any-depth leak test that
      # caught a real leak in Phase 1.
      - name: Training progress (watched-interval merge, server-clock clamp)
        run: python -m unittest erpnext_enhancements.tests.test_training_progress -v
      - name: Training grading (server-side grading, answer-key isolation)
        run: python -m unittest erpnext_enhancements.tests.test_training_grading -v
      # The player and the progress store speak deliberately different shapes and
      # only api.training._normalise_beat knows both. Drift there is SILENT AND
      # TOTAL -- mismatched keys credit zero seconds, so no video lesson can ever
      # be completed and nothing raises. That is not hypothetical: the two halves
      # were first written against each other with `ranges` vs `intervals`,
      # structured vs integer `seeks`, and a nested vs top-level `hidden`.
      - name: Training heartbeat wire format (player <-> progress)
        run: python -m unittest erpnext_enhancements.tests.test_training_heartbeat_wire -v
      # The Phase 3 seams, specified before the code. Four integration breaks got
      # through the Phase 2 fan-out build and every one was two correct halves
      # with a wrong join, so Phase 3's joins are pinned up front instead.
      # Phase-3 assertions SKIP until the files exist -- they are acceptance
      # criteria, not decoration -- while the Phase 2 contracts they build on are
      # enforced now so they cannot drift underneath the build.
      - name: Training Phase 3 seam contracts
        run: python -m unittest erpnext_enhancements.tests.test_training_phase3_contracts -v
      # AI drafting. The load-bearing assertions are about what must NOT happen:
      # drafting never stamps ai_reviewed_by (a pre-reviewed draft walks straight
      # past the submit-for-review gate), and suggest_checkpoints refuses without
      # a timed transcript rather than letting a model invent timestamps.
      - name: Training AI drafting (strict parsing, review gate, transcript gate)
        run: python -m unittest erpnext_enhancements.tests.test_training_ai -v
      # Phase 4 seams. The load-bearing one is compliance: it fires on a maintenance
      # visit or task assignment, by which point a truck is usually already at a
      # site, so a hard block there means the work happens with NO RECORD AT ALL --
      # worse than the uncertified assignment it was flagging. The suite asserts
      # frappe.throw appears nowhere in that module and that an exception inside the
      # check cannot propagate.
      - name: Training Phase 4 seam contracts
        run: python -m unittest erpnext_enhancements.tests.test_training_phase4_contracts -v
      - name: Training certificates (issuance, snapshot, verify PII, recertification)
        run: python -m unittest erpnext_enhancements.tests.test_training_certificates -v
      # Every dotted path in hooks.py must name something that exists. Frappe
      # resolves after_migrate at the very END of `bench migrate`, so a typo there
      # fails the deploy after every schema change has already been applied -- the
      # most expensive possible moment to find one. It cost a production build.
      - name: Hook targets resolve (no dangling hooks.py paths)
        run: python -m unittest erpnext_enhancements.tests.test_hook_targets_resolve -v
      - name: Training compliance (warn-only, never blocks a save)
        run: python -m unittest erpnext_enhancements.tests.test_training_compliance -v
      # Regressions from the FIRST REAL EXECUTION of the module. Four phases of
      # reading found a lot; running it once found three more, and the most useful
      # assertion here is static: every field name written through _doc_payload is
      # cross-checked against the DocType JSON. That would have caught the score
      # bug -- a learner who scored 100 getting a certificate reading 0 -- before it
      # ever ran, with no bench required.
      - name: Training runtime regressions (field names, sign-off gate)
        run: python -m unittest erpnext_enhancements.tests.test_training_runtime_regressions -v
      # The authoring ENTRY PATH, as opposed to any single function on it. Both of
      # the first two bugs here were reported by a real author on day one and
      # neither is catchable by unit-testing a function: a placeholder that
      # outlived its feature, and a refusal that named the wrong state. Static
      # reads of the desk JS, which never runs in CI and has no bench here.
      - name: Training builder entry path (routing, guards, change_type)
        run: python -m unittest erpnext_enhancements.tests.test_training_builder_entry -v
      # Does the learner page's stylesheet style the page the scripts build? It
      # did not: 130 of the 138 classes the player emits had no rule, because the
      # CSS was written against an earlier vocabulary and never followed the
      # rewrite. Nothing catches that at runtime -- an unstyled element is not an
      # error, it just renders wrongly -- so it took a person opening the page.
      - name: Training player CSS contract (every rendered class has a rule)
        run: python -m unittest erpnext_enhancements.tests.test_training_player_css_contract -v
      # Does the player read the keys the server sends? It did not: the bootstrap
      # returns `assigned`/`library` and the player read `courses`/`catalog`, so
      # /training told every learner nothing was assigned to them, always. A
      # missing key in JS is undefined, and `undefined || []` renders perfectly --
      # there is nothing at runtime that could notice.
      - name: Training bootstrap wire (player reads what the API sends)
        run: python -m unittest erpnext_enhancements.tests.test_training_boot_wire -v
      # The generalisation of the step above, and the one that closes the whole
      # bug class. The suites either side of it each pin ONE side of a seam, which
      # is exactly why they stayed green through eight releases of the same
      # defect. This one enumerates every whitelisted reply's keys -- following
      # the helpers in grading.py and progress.py that add to them -- and every
      # key the player reads off a reply, then fails on anything present on one
      # side only. Deliberate asymmetries live in two allowlists that must each
      # carry a reason, and a third test prunes them when they stop being true.
      - name: Training boundary contract (every reply key has a reader, and vice versa)
        run: python -m unittest erpnext_enhancements.tests.test_training_boundary_contract -v
      # The kiosk service worker is registered at ROOT scope, so what it answers
      # for is every page's problem. It used to serve the whole app's assets
      # cache-first with ignoreSearch, which froze JavaScript across the site for
      # any browser that had ever opened /kiosk -- found with a training player
      # four releases stale that no ?v= could reach.
      - name: Kiosk service worker scope (must not answer for the app's assets)
        run: python -m unittest erpnext_enhancements.tests.test_kiosk_service_worker -v
      # Semi-monthly commission periods. Every failure mode here is a *plausible*
      # statement -- right shape, wrong rows -- which nothing downstream can
      # notice: a boundary day in neither period (the live report was dropping
      # deals closed on a 1st or a 16th), the closed period and the running one
      # swapped, or a second statement for a period already paid.
      - name: Pay-period commission report (window math, send-once, restore)
        run: python -m unittest erpnext_enhancements.tests.test_pay_period_reports -v
      # The Closed-Won hand-off gate. Its own step because it installs a frappe
      # stub in setUpModule, and sharing a process with another stub-installing
      # suite is how they cross-talk.
      #
      # Guards a failure mode that is invisible from the outside: a gate that
      # stops gating looks exactly like a gate that is working. The 2026-08-06
      # audit measured the cost of that — 8 of 28 projects created off-process,
      # 17 of 17 hand-off meetings past SLA — and nothing reported either. Also
      # pins the over-firing direction (a legacy Closed-Won deal must NOT be
      # blocked, or a 227-deal backlog freezes), the business-day maths across a
      # weekend, and that step 5 never escalates while step 4 does.
      - name: Closed-Won hand-off gate (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_handoff_gate -v
      - name: QuickBooks Online sync (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_quickbooks_online.py -q
      - name: Stripe Payments (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_stripe_payments.py -q
      # A www/ controller whose filename contains a hyphen is never imported by
      # frappe, so its get_context() silently never runs. stripe-return.py was
      # broken this way from the day it was written until v1.159.10.
      - name: www controller filenames must be importable
        run: python scripts/check_www_controllers.py
      # Frappe calls orjson.loads() on EVERY file in the app-level directories named by
      # IMPORTABLE_DOCTYPES — no *.json filter. One stray file aborts the whole schema
      # sync, so the site fails to migrate on deploy. This killed production's migrate on
      # 2026-07-31 when Frappe 16.29.0 added ("desk", "workspace_sidebar") to that list
      # and a README that had sat there harmlessly for two days became an import target.
      - name: app-level import directories must contain only JSON
        run: python scripts/check_import_dirs.py
      # Guards the "writes to a field that doesn't exist, silently" class of bug:
      # every field the Lead/Opportunity hooks assign must be a declared Custom
      # Field, and nothing may target the removed `source` field.
      - name: Lead/Opportunity attribution (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_lead_attribution.py -q
      # Its own step: installs a frappe stub in sys.modules, so it must not share a
      # process with another stub-installing suite. Guards the distinction the
      # won-date backfill turns on — an audit-trail status transition is evidence of
      # a win only when it isn't part of a bulk edit. 197 of the 220 candidates on
      # this instance were flipped on one day, and trusting those rebuilds the fake
      # revenue spike the sales dashboard was fixed to stop showing.
      - name: Opportunity won-date backfill (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_opportunity_won_date_backfill.py -q
      - name: Fountain move intake (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_fountain_move.py -q
      # Field systems (WP-2/3/8). Its own step because it installs a frappe stub in
      # sys.modules — sharing a process with another stub-installing suite is how
      # they cross-talk. Guards two things that fail expensively and quietly: a
      # PENDING photo upload must keep counting as "captured" (or a technician on a
      # site with no signal cannot clock out), and the payroll workbook's 14 columns
      # must stay in position (the provider's import maps by position, so a
      # reordered column lands somebody's hours in the Bonus field).
      - name: Field photo gate + payroll export (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_field_systems.py -q
      # Account hygiene + pipeline reconciliation. Own step (own frappe stub).
      # The two invariants that cost the most if they break: nothing may bulk-link
      # an Opportunity to a Project (a wrong link corrupts the revenue attribution
      # WP-1 exists to fix), and Customer.industry must never be made mandatory by
      # reqd/mandatory_depends_on — those are evaluated on every save by every
      # caller, and QBO inserts Customers without ignore_mandatory, so a
      # declarative rule parks every synced customer in manual review.
      - name: Account hygiene + reconciliation (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_account_hygiene.py -q
      # Marketing spend import + value-stream dashboard. Own step (own frappe stub).
      # Guards the normalisation path (an unreadable amount must be REFUSED, not
      # coerced to 0 by frappe's flt — a silent zero in the denominator of every
      # cost-per-lead figure), and that no marketing KPI reads `Opportunity.source`
      # / `Lead.source` again: erpnext v15 orphaned those columns, frappe never
      # drops columns, so the queries ran and returned plausible numbers for years.
      - name: Marketing spend + value stream dashboard (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_marketing_spend.py -q
      # Guards the Gantt widget read API's security contract: client-supplied
      # configs must never reach the query layer with an unvalidated fieldname.
      - name: Gantt widget read API (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_gantt_api.py -q
      # The Project Schedule print format draws its Gantt bars as percentage-
      # positioned divs, and a wrong percentage does not raise -- it silently
      # puts the bar in the wrong place on a document that goes to a customer.
      # Its own step (not appended to a unittest module list): these are plain
      # pytest functions, which `python -m unittest` collects nothing from while
      # still reporting success.
      - name: Project print-format geometry (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_project_print_data.py -q
      # Guards the "the badge says Partially Ordered on a line that is fully
      # ordered" class of bug: an item's status must be computed from that item's
      # own ordered-vs-requested quantity, never inherited from its parent
      # document's header status. The Procurement Tracker did exactly that, so 29
      # of 32 item rows on production were mislabelled.
      - name: Procurement quantity/status math (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_procurement_quantities.py -q
      # -----------------------------------------------------------------------
      # Chat / Google Chat (ADR 0009, Phase 1). SIX steps, one file each, and the
      # split between them is not cosmetic.
      #
      # Five of these are pytest-style (plain functions, `monkeypatch`) and get
      # their own `python -m pytest` step. Appending one of them to a `python -m
      # unittest` module list above would collect ZERO tests and report success --
      # the exact failure that left the QuickBooks suite running nowhere for weeks,
      # and that left test_triton_personas.py never executed at all. The guardrails
      # suite is TestCase-based and so is the one that belongs on unittest.
      #
      # One file per step for the other reason too: each bench-free suite installs
      # its own `frappe` stub, and a shared process is how they cross-talk.
      #
      # The security-relevant one is the webhook verifier. `chat.gchat.webhook.handle`
      # is `allow_guest=True` -- world-reachable -- and the JWT is the only thing
      # between it and an open relay. Two of its six negative cases (a valid Google
      # token with the wrong issuer, and one minted for another audience) are exactly
      # what a generic ID-token verification waves through, so they are pinned by
      # name. Verified 2026-08-08 by deleting the issuer check from a copy of the
      # module: ten assertions went red, the rest stayed green.
      - name: Chat guardrails (DocPerms, realtime targeting, transport containment)
        run: python -m unittest erpnext_enhancements.tests.test_chat_guardrails -v
      - name: Chat Google client (backoff, id derivation, dry-run calls nothing)
        run: python -m pytest erpnext_enhancements/tests/test_chat_gchat_client.py -q
      - name: Chat DWD assertion claims (exp <= 10 min, no key material logged)
        run: python -m pytest erpnext_enhancements/tests/test_chat_auth_claims.py -q
      - name: Chat webhook JWT verification (six negative cases, 401 with no DB write)
        run: python -m pytest erpnext_enhancements/tests/test_chat_webhook_verify.py -q
      - name: Chat Settings budget arithmetic (tier budgets + reserve <= ceiling)
        run: python -m pytest erpnext_enhancements/tests/test_chat_settings_budget.py -q
      # Phase 2's pure tier. These six exist BECAUSE this is the only tier with automatic
      # regression protection in this repo, so leaving any of them unwired would defeat the
      # entire reason the modules were written frappe-free. One file per step, same as the
      # suites above: each installs its own `frappe` stub in setUpModule and a shared
      # process is how they cross-talk.
      #
      # The decisions suite is the one to look at first when it goes red. Its table IS the
      # echo-suppression specification, and the failure mode it guards is asymmetric: a
      # duplicated message is visible and annoying, while a SUPPRESSED one is a coworker's
      # message that silently never arrives. Test names say which direction they defend.
      - name: Chat relay state machine (every legal transition, and every illegal one raising)
        run: python -m pytest erpnext_enhancements/tests/test_chat_sync_states.py -q
      - name: Chat echo suppression + event parsing (the decision matrix is the spec)
        run: python -m pytest erpnext_enhancements/tests/test_chat_sync_decisions.py -q
      - name: Chat 32,000-byte budget (emoji, CJK, no split codepoints)
        run: python -m pytest erpnext_enhancements/tests/test_chat_budget.py -q
      - name: Chat per-space token bucket arithmetic (GCRA, pure half only)
        run: python -m pytest erpnext_enhancements/tests/test_chat_ratelimit.py -q
      - name: Chat realtime targeting (never a bare room, never task_id, always after_commit)
        run: python -m pytest erpnext_enhancements/tests/test_chat_realtime_targeting.py -q
      - name: Chat fake API harness (quotas, requestId replay, tombstones, the race)
        run: python -m pytest erpnext_enhancements/tests/test_chat_fake_api.py -q
      # The engine. Separate steps rather than one pytest invocation over the directory,
      # because each suite installs its own `frappe` stub in setUpModule and they cross-talk
      # in a shared process -- run together these six go red for reasons that have nothing to
      # do with the code under test.
      - name: Chat write path / outbox (seq allocation, relay refusal, edit+delete ordering)
        run: python -m pytest erpnext_enhancements/tests/test_chat_outbox.py -q
      - name: Chat outbound relay (state machine, token bucket, sweeper, kill switch, chaos 4-9)
        run: python -m pytest erpnext_enhancements/tests/test_chat_outbound.py -q
      - name: Chat inbound ingest + Pub/Sub puller (echo ladder, the §4.D race, defer timer)
        run: python -m pytest erpnext_enhancements/tests/test_chat_inbound.py -q
      - name: Chat provisioning + membership (three modes, revert cap, converging diff)
        run: python -m pytest erpnext_enhancements/tests/test_chat_provisioning.py -q
      - name: Chat attachments (permission parity, upload cost, Drive links stay links)
        run: python -m pytest erpnext_enhancements/tests/test_chat_attachments.py -q
      - name: Chat subscription lifecycle + reconciliation sweep (chaos 10)
        run: python -m pytest erpnext_enhancements/tests/test_chat_subscriptions.py -q
      # Raw SQL is the one path the permission stack does NOT cover: a
      # permission_query_conditions fragment is appended by get_list and by nothing else, and
      # frappe.get_all is get_list(ignore_permissions=True) wearing a friendlier name. So this
      # walks every module under chat/ with `ast` and asserts each raw query either lives in an
      # allowlisted operational table or ANDs in permissions.membership_filter_sql itself.
      # Mutation-tested in both directions when it was written: a planted non-compliant query
      # turns it red and naming the offender, and the same query with the filter turns it green.
      - name: Chat raw-SQL membership guard (the likeliest route to a real data leak)
        run: python -m unittest erpnext_enhancements.tests.test_chat_rawsql_guard -v
      # Phase 5's fence, and it lands before the code it polices -- a scan written after
      # the search functions exist is a scan that gets argued with, one exemption at a
      # time, by an author who has already written the query. Four rules: the index tables
      # (Chat Context Chunk and the two digests) are named from exactly one file; every
      # query builder in chat/retrieval/ takes `allowed_rooms` as a REQUIRED FIRST
      # POSITIONAL parameter, so omitting it is a TypeError in development rather than an
      # unfiltered query in production; the package exports exactly two symbols; and the
      # entry point has no parameter at all by which a caller supplies room ids.
      #
      # The failure this guards is the only one in Phase 5 that nobody notices: every other
      # bug here produces a wrong answer, and this one produces a correct answer delivered
      # to somebody who is not in the room.
      - name: Chat retrieval gate has one door (the ungated-SQL source scan)
        run: python -m unittest erpnext_enhancements.tests.test_chat_gate_source_scan -v
      # `origin_timestamp` was selected from Chat Message, which has no such field. MariaDB
      # answers that with 1054 on every execution, and it ran on production for two hours
      # because nothing had ever executed that statement: the pure suites test the chunker,
      # and the SQL that feeds it needs a database. A wrong column name is invisible to every
      # bench-free test, and review does not catch it either - the name was entirely
      # plausible. Both sides of the check are files, so it needs no bench.
      # Triton's answers rendered three different ways on three surfaces, all wrong: the SPA
      # showed literal **bold**, the widget's frappe.markdown lives in the Desk bundle and fell
      # back SILENTLY to escaped text on /chat, and Google Chat got raw CommonMark whose double
      # asterisks its single-asterisk bold turns into bold-plus-a-stray-character.
      #
      # The renderer builds NODES, never HTML strings, because the input is model output: it
      # carries prompt-injected content and quotes employees' messages back verbatim. The suite
      # asserts that directly - no innerHTML is ever assigned, and no element is created that
      # the renderer does not itself construct - plus the §4.G.7 hostile corpus through every
      # link path.
      # Phase 6 §4.A.4 and §4.D.3 layer 4. Chat Audit Log shipped in v1.285.0 as a vault
      # with nothing in it - four immutability layers and no writer, which is §6 step 5's
      # ordering. This is the first writer, and two properties need a test rather than a
      # comment.
      #
      # ONE CHAIN PER TABLE. Interleaving two writers into a single chain makes every
      # concurrent write a fork, and the verifier reports a fork as a permanent break that is
      # indistinguishable from tampering. Separate genesis strings, separate locks.
      #
      # And every DATA FIELD is signed, checked by set equality against the DocType JSON. The
      # per-field test alone is not enough: deleting a field from the signed tuple makes that
      # loop skip it, so it stays green while the field becomes editable without breaking the
      # chain - which is exactly what the chain exists to catch.
      #
      # Own step: installs its own frappe stub in setUpModule.
      - name: Chat governance audit (the second chain, and the role-grant hook)
        run: python -m unittest erpnext_enhancements.tests.test_chat_governance_audit -v
      # The unified access report - ONE definition of a non-participant read, over both audit
      # tables. Two tables is acceptable; two definitions of a read is not, and a consumer
      # querying either table directly counts a request that spanned four rooms as one read or
      # as four depending which table it picked.
      #
      # The half asserted here is the pure half: how a reason is graded (the failure mode that
      # matters is the placeholder that CLEARS the length bar, because that one only appears
      # once somebody has worked out the field is unread), what the subject projection is
      # allowed to contain, and that `reason_category` is signed only when present - which is
      # what let a governance column join an already-hashed log without re-serialising every
      # historical row into a false "tampered" verdict.
      #
      # Own step: installs its own frappe stub in setUpModule.
      - name: Chat access report (the unified read record, and optional chaining)
        run: python -m unittest erpnext_enhancements.tests.test_chat_access_report -v
      # The oversight read path. `retrieve_for_oversight()` had ZERO callers for its whole
      # life, and two defects only a caller would have surfaced: T1 was gated on a single
      # `room` (the oversight path names a SET and no thread, so the verbatim tier never ran
      # and the read answered with summaries while looking complete), and the authored tier
      # ran as the auditor, returning their OWN messages in place of the ones under audit.
      #
      # AST rather than behaviour, because the rows need a bench and the WIRING is what
      # regressed. Verified to bite: reintroducing either defect fails this step.
      - name: Chat oversight read (whose messages, and which tier)
        run: python -m unittest erpnext_enhancements.tests.test_chat_oversight_read -v
      # The oversight viewer's gates. Three properties make this surface safe to switch on:
      # G6-10 (a bad reason is REFUSED, not accepted-and-blanked, graded by the same function
      # the compliance report uses so there is one threshold rather than two), G6-6 (no
      # realtime at all - a socket join on a room the auditor is not in is a read this module
      # cannot audit), and that the free-text reason never reaches the subject.
      #
      # AST and comment-stripped text, because three separate text scans in this change
      # flagged the prose explaining why a thing is absent. A guard that cannot tell an
      # explanation from a call gets satisfied by deleting the explanation.
      - name: Chat oversight viewer (the reason gate, and the absent socket)
        run: python -m unittest erpnext_enhancements.tests.test_chat_oversight_viewer -v
      # The export bundle - the artefact that LEAVES the building, so its contents are a
      # legal question wearing a serialization costume. Two G6-9 properties:
      #
      #  * the deleted body is in revisions.jsonl and NOT in messages.jsonl. That is a
      #    DECISION, not a filter: on this schema an is_deleted=1 row RETAINS its text
      #    (divergence D4), so a naive dump hands over every deleted message in the file a
      #    reader opens first. Verified to bite - removing the redaction fails two tests.
      #  * a re-export is byte-identical apart from the timestamp and the export id, which
      #    is what makes the manifest worth anything.
      #
      # Pure: chat/governance/export.py imports nothing from Frappe, so no stub is needed.
      - name: Chat export (what leaves the building, and what does not)
        run: python -m unittest erpnext_enhancements.tests.test_chat_export -v
      # The export runner's WIRING - the things a database hides rather than reveals:
      # the frappe.enqueue kwarg name (this package has been bitten twice, once by a kwarg
      # called `event` that the enqueue machinery ate before the job saw it), that the
      # download endpoint writes its audit row BEFORE the bytes are attached and fails
      # closed when that write does not happen, and that the job cannot strand a row in
      # "In Progress".
      #
      # Own step: installs its own frappe stub in setUpModule.
      - name: Chat export runner (the queue contract, and the download that records itself)
        run: python -m unittest erpnext_enhancements.tests.test_chat_export_runner -v
      # Seeing through a delete. `tombstone_expanded` was the third event Chat Audit Log
      # had declared since v1.285.0 with nothing able to produce it.
      #
      # The property asserted: the audit row is written BEFORE the body is returned, and a
      # failed write REFUSES the read - record_governance_event swallows its failures and
      # returns None, so a caller that ignores the return has assumed a record that does not
      # exist. Plus: only a deleted message (a live one goes through the viewer, so the
      # event type keeps one meaning and stays countable), and one shared reason grader.
      #
      # Own step: no frappe import needed, the module is only ever parsed.
      - name: Chat tombstone expand (recorded before revealed, or refused)
        run: python -m unittest erpnext_enhancements.tests.test_chat_tombstone -v
      # The alert path's JUDGEMENT, executed rather than inspected - alert_rules.py imports
      # nothing, which was the point of splitting it out. The property that most wants a real
      # test: the deduplication key never carries a measurement. A key holding the queue depth
      # changes every time the depth does, so nothing matches its predecessor and the table
      # grows exactly as fast as it would with no deduplication at all - while the code, the
      # schema and the dashboard all claim the alerts are deduplicated. Invisible until
      # somebody counts rows.
      #
      # Pure: no frappe stub needed.
      - name: Chat alert rules (dedup, doubling schedule, terminal resolve)
        run: python -m unittest erpnext_enhancements.tests.test_chat_alert_rules -v
      # The SHAPE of the module that performs those decisions, which no unit test can see:
      # the log-file line happens before any database work (the failure class where an alert
      # matters most is the one where a database-backed alert is least likely to survive),
      # nothing raises, the ops-space post passes no ignore_permissions, and email is
      # frappe.sendmail and never a Notification Log row (G6-18).
      #
      # Scans DOCSTRING-STRIPPED source. Six text-matching assertions in this series flagged
      # prose rather than code, and both new files discuss the forbidden name at length.
      #
      # Own step: no frappe import needed, the modules are only ever parsed.
      - name: Chat alert surface (logged first, never raises, no membership bypass)
        run: python -m unittest erpnext_enhancements.tests.test_chat_alerts_surface -v
      # What counts as drift, and what merely counts as SWITCHED OFF. This app ships dormant
      # - enabled=0, dry_run_mode=1, relay_outbound_enabled=0, relay_inbound_enabled=0 - so on
      # a shipped-state site every message has an empty gchat_message_name and no Google
      # resource has an ERPNext row. A detector keyed on ABSENCE reports the entire corpus as
      # drifted, forever, and cannot tell "the mirror drifted" from "the mirror was never
      # turned on". DormantSiteTest is that scenario run against the real classifier: the
      # verdict must flip on one affirmative fact (a relay job completed) and on nothing else.
      #
      # Pure: drift_rules.py imports nothing at all, which PurityTest asserts.
      - name: Chat drift rules (evidence the mirror ran, never an empty column)
        run: python -m unittest erpnext_enhancements.tests.test_chat_drift_rules -v
      # The promises the census makes that no unit test can see: it issues NO Google call of
      # any kind, it repairs nothing, it never selects a body column, it refuses on the master
      # switch before the feature switch, and it CLEARS findings it stops observing - a census
      # that can only open findings produces a board of things that were once true.
      #
      # Own step: no frappe import needed, the modules are only ever parsed.
      - name: Chat drift surface (no Google call, no repair, no bodies)
        run: python -m unittest erpnext_enhancements.tests.test_chat_drift_surface -v
      # The survives-a-purge table, asserted for SET EQUALITY against chat/doctype/ on disk,
      # so a chat DocType added next year fails the build until somebody decides what a purge
      # does to it. Containment would let a new table be treated by accident, and the accident
      # is silent in both directions - purged when it should survive, or kept when it holds a
      # body. Plus the eligibility rule, which returns EVERY hold rather than the first.
      #
      # Pure: purge_rules.py imports nothing at all.
      - name: Chat purge rules (what survives a purge, and why it cannot run)
        run: python -m unittest erpnext_enhancements.tests.test_chat_purge_rules -v
      # The prerequisite the purge is blocked on: retiring derived coverage of destroyed
      # messages. Two assertions here came out of a design review and were both wrong in the
      # obvious version. The delete predicate keys on first_seq, not last_seq - for a snapped
      # mark the two are equivalent, but the field is read_only on the DocField, which is not
      # a database constraint, and for a mark set by hand last_seq leaves a chunk holding the
      # retired transcript verbatim that can never be cleaned up, because the monotonicity
      # rule forbids lowering the mark to re-snap it. And is_straddler is a DETECTION
      # predicate as well as a construction-time one: the chunk sweep reads a room's messages
      # and commits later, so a mark committed in between produces a straddler the snap never
      # saw.
      #
      # Pure: chat/retire_rules.py imports nothing at all. It sits at the PACKAGE ROOT, not in
      # chat/indexing, and that is load-bearing: chat/indexing is the writer package whose
      # exemption rests on four properties, the fourth being "no endpoint importing it", and
      # the retrieval gate needs this fragment.
      - name: Chat retirement rules (the boundary, by arithmetic rather than re-chunking)
        run: python -m unittest erpnext_enhancements.tests.test_chat_retire_rules -v
      # The WIRING of that arithmetic - a mark nothing reads is a column. The one that
      # matters most is the watermark floor: indexer._rooms_needing_chunks computes its
      # watermark as max(last_seq) over sealed chunks with NO staleness filter, so deleting a
      # room's retired chunks would drop it and the ten-minute sweep would re-read every
      # surviving message above the hole and re-chunk it VERBATIM with a fresh embedding. That
      # is the specific reason purge_rules marked three doctypes BLOCKED.
      #
      # The gate half is correctness: a retired chunk or digest must never be served, and there
      # are five separate queries that could serve one. The fragment is declared once.
      - name: Chat retirement wiring (the floor, the gate, the emptied room)
        run: python -m unittest erpnext_enhancements.tests.test_chat_retire_wiring -v
      # The WRITER, and the refusal that makes it safe to have at all. The mark asserts
      # "every message at or below this seq is gone forever" and every consumer acts on that:
      # the chunk sweep never reads below it, the digest sweep drops the room, the gate stops
      # serving anything covering it. Set it over messages that still EXIST and you have not
      # retired anything - you have made a stretch of live, readable conversation permanently
      # invisible to the assistant, which nobody reports as a bug. They report that Triton
      # "doesn't know about" a conversation, and the cause is a column nobody looks at.
      #
      # So the order is forced by code: destroy first, then retire. There is deliberately no
      # argument that bypasses the check, and its absence is asserted - the case for a force=
      # is always "I know they are gone", which is the belief the check exists to test.
      - name: Chat retirement writer (destroy first, then retire)
        run: python -m unittest erpnext_enhancements.tests.test_chat_retire_writer -v
      # The assistant's own answers must never become indexed content. handler.py posts
      # Triton's reply as a REAL Chat Message through the ordinary outbox, and its text is
      # composed from the chunk bodies and digest summaries retrieval just handed it - so
      # indexing it made a second verbatim copy of the quoted conversation that OUTLIVES the
      # original, because every retention mechanism is a floor keyed on seq and the reply sits
      # at the top of the room with its own creation date.
      #
      # The exclusion is deliberately narrow: T0 (room digest) and T2 (cross-room chunks) are
      # excluded; T1 (thread) is untouched because gate._thread_messages reads Chat Message
      # directly, so a follow-up still sees the earlier answer at no cost. The suite asserts
      # BOTH halves - a later tidy-up that "completes" the exclusion would quietly cost Triton
      # the ability to follow up on itself.
      - name: Chat assistant replies are not indexed (TASK-2026-01569)
        run: python -m unittest erpnext_enhancements.tests.test_chat_assistant_not_indexed -v
      # The assertion that 4.F as shipped CANNOT destroy anything: no delete_doc, no db.delete,
      # no DELETE literal, no set_value, no body column, in either module. This matters more
      # than the usual surface test because the destructive half was designed, reviewed by
      # three adversarial passes and CUT - so the obvious next commit is somebody adding the
      # twenty lines that "finish" it. This is what that commit collides with, and the failure
      # message names the blocker: Phase 5's derived layer has a staleness story and no
      # retirement story, so a purge can neither keep nor destroy the chunks and digests
      # covering what it removes.
      #
      # Own step: no frappe import needed, the modules are only ever parsed.
      - name: Chat purge surface (the planner cannot destroy anything)
        run: python -m unittest erpnext_enhancements.tests.test_chat_purge_surface -v
      # The chat clients survive a 429, which is not a hypothetical: frappe.rate_limiter is
      # wired into the request lifecycle in frappe/app.py, so frappe.conf.rate_limit applies a
      # GLOBAL limiter to every request whether or not any endpoint carries a decorator.
      # Before v1.294.1 no chat client mentioned 429 anywhere and four paths failed SILENTLY -
      # presence kept beating into the limiter and read as absent (notification spam), the read
      # mark was LOST because take() advances the cursor before the POST, push memoised the
      # failed promise and stayed dead for the tab's session, and a refused room open left the
      # tab joined to no socket room.
      #
      # A source scan because this repo has no JS test runner - package.json declares lint and
      # nothing else. Comment-stripped, because every file it reads discusses 429 at length.
      - name: Chat clients survive a 429 (presence, read marks, push)
        run: python -m unittest erpnext_enhancements.tests.test_chat_client_throttling -v
      # The SPA received NO realtime events at all - not another person's message, not
      # @triton's reply, not even its own - and looked healthy doing it, because every symptom
      # pointed away from the cause. Frappe's socket server namespaces connections by site and
      # its auth middleware compares `socket.nsp.name` against the resolved site; connecting to
      # the bare origin lands in `/`, so the comparison is "" != site and the connection is
      # refused. The engine.io handshake still succeeds (it runs before namespace middleware),
      # the rejection happens inside the Node process so nothing reaches ERPNext's Error Log,
      # and connect_error only set a status nobody surfaced.
      #
      # socketUrl is pure, so the one thing that mattered is directly assertable.
      - name: Chat realtime connection URL carries the site namespace
        run: node scripts/test_chat_socket_url.mjs
      - name: Chat markdown renderer (browser half)
        run: node scripts/test_chat_markdown.mjs
      # The server half. Pure `re`, imports no frappe, so it gets its own step and can never
      # cross-talk with another suite's stub set. The interesting assertion is that the
      # conversion is NOT idempotent and that this is a property to know rather than a bug to
      # fix: `*x*` is Chat's bold and CommonMark's italic, so no translator between them can be.
      # What keeps it safe is the call site, which converts from the stored markdown every time.
      - name: Chat markdown to Google Chat formatting (server half)
        run: python -m unittest erpnext_enhancements.tests.test_chat_gchat_markdown -v
      - name: Chat SQL only names columns that exist (the 1054 guard)
        run: python -m unittest erpnext_enhancements.tests.test_chat_sql_columns -v
      # Phase 6 §4.G.5. Two findings and one property.
      #
      # The findings: `enroll_org_units` and `start_org_mirror` shipped with NO role gate at
      # all, so any authenticated System User could create Chat Room rows and open a
      # provisioning run - and `dry_run` is a caller-supplied parameter, so the default that
      # exists to make the irreversible half deliberate was one query-string value away from
      # being skipped. And 42 of 43 chat endpoints declared no `methods=`, so every
      # state-changer answered GET, which is CSRF-able whatever the token handling does.
      #
      # The property is the one that matters in a year: `chat/endpoints.py` is compared to
      # the AST by SET EQUALITY, so a new @frappe.whitelist() in the package fails this suite
      # until somebody classifies it as mutating or not. A hardcoded list nothing compares
      # against the source is the same bug as no list, arriving later and with more
      # confidence - the precedent is the chat MCP denylist, checked the same way.
      #
      # Its own step, like every other bench-free chat suite, so no other module's frappe
      # stub is in sys.modules when it runs. This one imports no frappe at all.
      - name: Chat HTTP surface is enumerated, POST-only where it mutates, role-gated where it must be
        run: python -m unittest erpnext_enhancements.tests.test_chat_endpoint_surface -v
      # Five of the seven retrieval modules import nothing but the stdlib, and this is why:
      # what they decide fails SILENTLY when it is wrong. A chunker that is not deterministic
      # makes the content hash meaningless and re-running the indexer duplicative. A ranker
      # that adds raw scores instead of fusing ranks lets whichever tier has the larger
      # numbers decide the answer. A ladder that degrades out of order throws away the thread
      # the question was asked in. An assembly whose stable prefix is not byte-stable costs
      # the entire prompt-cache discount on every request with no error and no log line. And
      # a boolean-mode query built from raw user text turns "-20%" into an exclusion and
      # returns fewer rows for no stated reason.
      #
      # Its own pytest step, like every other bench-free chat suite: `python -m unittest`
      # silently collects zero tests from a file of plain functions and reports success.
      - name: Chat retrieval pure logic (chunking, ranking, budget ladder, assembly order)
        run: python -m pytest erpnext_enhancements/tests/test_chat_retrieval_pure.py -q
      # Decision #12 buys a non-participant read with a record of it, and that trade only holds
      # while the record cannot be quietly altered afterwards. Immutability has to be argued in
      # layers because each mechanism is bypassed by the next one down: DocPerm is bypassed by
      # ignore_permissions (which the writer needs), the controller's before_save/on_trash are
      # bypassed by db_set/db.set_value/raw SQL (none of which load a document), and both are
      # bypassed by a direct MariaDB edit. This step is the layer that can see the controller's
      # blind spot -- it walks the whole app and fails if any module other than the one
      # allowlisted writer names an audit table beside a mutating call. Mutation-tested in both
      # directions: eleven planted defects, including a guard neutered to `if False:` and a
      # handler narrowed from Exception to ValueError, each confirmed caught.
      - name: Chat audit log is append-only (the layer the controller cannot enforce)
        run: python -m unittest erpnext_enhancements.tests.test_chat_audit_immutability -v
      # The Phase 2 checkpoint gate. Two hundred messages both ways through the fake Chat API --
      # edits, deletes, attachments, three 10-in-2-second bursts, a 60-second outage, every tenth
      # event redelivered, both out-of-order pairs, a worker killed mid-relay -- then the whole
      # thing replayed to prove reprocessing the backlog is a no-op.
      #
      # It asserts ARRIVAL counts per origin, not just the absence of duplicates, and that is
      # deliberate: both of the worst bugs this phase produced were SUPPRESSIONS -- a real
      # message consumed while believed to be our own echo -- and a soak that only counted
      # duplicates would have passed with both of them present.
      - name: Chat 200-message two-way soak (checkpoint gate, cold + replay)
        run: python -m pytest erpnext_enhancements/tests/test_chat_soak.py -q
      # Phase 3's server surface: the read/write API the SPA runs on, which Phase 2
      # deliberately did not ship (there was no get_rooms, no get_messages, no
      # send_message at all). Its own pytest step, like every other bench-free chat
      # suite, because each installs its own `frappe` stub in module scope and they
      # cross-talk in a shared process.
      #
      # The rows that matter: a deleted row never emits its body (is_deleted = 1 rows
      # KEEP their text -- Google's tombstone is content-free, so ERPNext is the only
      # copy -- and one read path forgetting to strip it leaks exactly the thing the
      # user chose to delete); the membership fragment never returns "" (an empty
      # fragment disappears out of a hand-written WHERE and the query then returns
      # everything); paging is keyset on `seq` and never OFFSET or a timestamp; and
      # every whitelisted endpoint calls a gate before it reads.
      - name: Chat Phase 3 API contracts (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_chat_api_contracts.py -q
      # Phase 4's suppression matrix -- ADR 0009 §H.1's twelve rows, asserted against a
      # LITERAL expectation table rather than a re-implementation. This is the one rule
      # deciding whether twenty people's phones buzz, and every way of getting it wrong
      # is invisible: nobody reports the notification they did not receive, and a
      # correctly-suppressed message and a silently-broken one look identical from the
      # sender's side, the recipient's side and the server log.
      # It also carries the two named tests that stop presence quietly becoming a sticky
      # flag: stop the heartbeat with NO cooperation from the client (no pagehide, no
      # disconnect, no key deletion), advance past the TTL, and assert notifications
      # resume. A flag-based design leaves a crashed browser suppressing its owner's
      # messages forever, which people report as chat being broken rather than as a
      # notification bug.
      # No frappe stub: the module under test imports nothing outside the standard
      # library, and the suite asserts that too -- a `frappe` import appearing there
      # would delete this whole step from CI silently.
      - name: Chat Phase 4 notification policy (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_chat_notification_policy.py -q
      # The chat log-retention sync. Guards a bug whose whole nature is that nothing
      # errors: `Chat Settings.relay_job_retention_days` and `inbound_event_retention_days`
      # shipped in Phase 1, were validated, and were then read by NOTHING -- while both
      # controllers carried a `clear_old_logs` Frappe never called, because nothing ever
      # registered either doctype with Log Settings. Two dead controls, two dead
      # implementations, two unbounded queue tables, and no symptom until somebody looks.
      # The tests are mostly about the wiring being real rather than about arithmetic: a
      # typo'd fieldname reads as 0, and 0 now means NEVER PURGE, so a typo silently
      # restores the original bug. It also asserts the design decision -- that these two
      # doctypes are NOT in `default_log_clearing_doctypes` -- because a static hook fights
      # the settings field and `add_default_logtypes` re-adds any row removed to mean never.
      - name: Chat log retention sync (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_chat_retention.py -q
      # The Web Push key schedule, pinned to RFC 8291's published example byte for byte.
      # A round-trip test cannot substitute for this and it is worth saying why: every
      # mistake available in that code is SYMMETRIC. Swap the two public keys in
      # key_info, use the message salt where the auth secret belongs, write 0x01 as the
      # padding delimiter instead of 0x02 -- in each case encryption and decryption still
      # agree perfectly, the round trip passes, and every real browser silently discards
      # the payload while the push service returns 201 and the server logs a success.
      # Only an answer computed by somebody else catches a uniformly-wrong implementation.
      #
      # This is the ONE step that installs a package, and the exception is deliberate
      # rather than drift: `cryptography` is already on the production bench (46.0.7,
      # measured), nothing shipped gains a dependency, and the alternative is having no
      # automated check at all on ~200 lines of hand-rolled authenticated crypto. The
      # suite skips itself without the library, so the install is not optional -- a
      # skipped step reads as a passing one.
      - name: Chat Phase 4 Web Push crypto (RFC 8291 known-answer vectors)
        run: |
          python -m pip install cryptography
          python -m pytest erpnext_enhancements/tests/test_chat_webpush_crypto.py -q
      # The only automated coverage of triton_chat.py, and `grep -c
      # test_triton_personas .github/workflows/ci.yml` returned 0 until this line:
      # the file shipped and then never ran. Everything it guards -- the SSE relay,
      # the per-user persona cache key (a site-wide key would serve one user's
      # private personas to everybody), the path-traversal guard on
      # _custom_persona_path -- was defended by a suite that had never executed.
      # Phase 3 modifies the widget and Phase 5 refactors the relay; both need this
      # net under them first (ADR 0009 Appendix B §12, C1).
      - name: Triton persona proxy + SSE relay (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_triton_personas.py -q
      # Same module, separate suite because it guards a different thing: the
      # widget's default model. Auto is spelled as the empty string, so the old
      # `behavior.default_model or conn_model or _DEFAULT_MODEL` chain could
      # never resolve to it -- blank fell through to Triton Settings'
      # chat_model_id, which is set on every real site. The failure is silent
      # (the picker just opens on Flash), so it needs a test rather than review.
      - name: Triton widget default model (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_triton_widget_defaults.py -q
      # The repo's first JavaScript test, and it needs no runner beyond the node
      # already on the GitHub image — deliberately not a new framework.
      #
      # It guards the Pick Routing Map's line arithmetic: the "collect 3" figure a
      # driver reads off a printed pick sheet at a supplier's counter. That number
      # is rendered twice (compact list in the dialog, table on the sheet) from one
      # computation, and a wrong one is discovered across the valley rather than in
      # review. It also covers what production cannot — there is still no partly
      # received Purchase Order on the live site, so the "(n of m received)" and
      # dimmed already-collected states have no real record to exercise them.
      - name: Pick routing line arithmetic + escaping (bench-free, node)
        run: node scripts/test_pick_routing_lines.js
      # Google address components -> Frappe Address fields. Every rule in that
      # mapping is a judgement call that looks arbitrary until it is wrong, and
      # the branches for UK/Nordic mailing towns and for states with no
      # two-letter form cannot be exercised on this US-only site at all.
      - name: Address component mapping (bench-free, node)
        run: node scripts/test_address_components.js
      # The floating Triton widget's streaming re-entrancy rule: every function that
      # clears the transcript, or switches which session it belongs to, must refuse
      # while a stream is in flight. Two of the four were missing it, and the failure is
      # entirely silent -- pumpText keeps writing into a detached node, finishStreaming
      # runs mermaid against dead DOM, and the turn is still persisted against the
      # session the user walked away from. Nothing throws, so nothing reports it.
      #
      # Ordering is asserted, not just presence: a guard after the destructive line is
      # decoration. Phase 3 rewires session switching entirely, which is exactly when a
      # rule this easy to agree with gets forgotten on the next function.
      #
      # Phase 3's checkpoint added two more rule families to the same file, both
      # silent in production and both invisible to anybody not using the affected
      # input method or keyboard layout: Enter-to-send must ignore an in-flight IME
      # composition (pressing Enter to COMMIT a candidate is how you type Japanese,
      # Chinese or Korean), and Alt+T must ignore AltGr (reported as ctrlKey+altKey
      # on Windows and many EU layouts). Plus the guard on decision #7: the human
      # approved a NEW manifest-backed sources row, not a change to what a turn with
      # no manifest sees -- which is every turn until Phase 5 ships.
      - name: Triton widget source guards (streaming, keyboard, preserved behaviour)
        run: node scripts/test_triton_widget_guards.js
      # Field text wrapping. Same shape, same reason: every rule it covers fails
      # silently. The sharpest is the `finally` around the ControlData.html_element
      # swap -- that static is flipped to "textarea" for the duration of one
      # synchronous make_input() call, so a control that throws inside the window
      # leaves it flipped and turns every Link, Date and Int field rendered
      # afterwards into a textarea, with nothing thrown and nothing logged. The
      # rest: global assets stay bundled rather than raw /assets paths (ADR 0008),
      # the SCSS import stays extension-less (a .css suffix becomes a runtime
      # import that 404s), the swap keeps its exact `!== "Data"` fieldtype test so
      # ControlData's subclasses cannot leak in, Data refuses Enter while Small
      # Text keeps it (two functions, deliberately not merged), and the server
      # flag checks has_field() before get_single_value -- it runs in boot_session
      # on every desk load, and v16 throws there between a deploy and its migrate.
      - name: Field text wrapping source guards (bundle wiring, gating, control swap)
        run: node scripts/test_field_text_wrap.js
      # ------------------------------------------------------------------
      # Phase 3's chat client. Three node steps, no runner and no npm install --
      # the same shape as the three guards above, and for the same reason: a test
      # framework that needs `npm ci` is a test framework this deploy pipeline does
      # not have, and one that is installed but never invoked is worse than none.
      #
      # These are .mjs because the code under test is ESM. Node prints a
      # MODULE_TYPELESS_PACKAGE_JSON warning on the imported .js files; do NOT
      # silence it by adding "type": "module" to package.json, which would turn the
      # two CommonJS guards above into parse errors.
      # ------------------------------------------------------------------
      # The whole §4.10 degradation table as executable rows. Every failure mode it
      # covers is INVISIBLE in production: a dropped token looks like the model chose
      # not to cite, a truncated tail looks like the model stopped early, a split
      # token looks like a glitch nobody can reproduce. The row that matters most is
      # "no citations event at all renders identically to today" -- that is what lets
      # Phase 3 ship before Phase 5 exists.
      - name: Chat inline citation renderer (bench-free, node)
        run: node scripts/test_chat_citations.mjs
      # Routes, the three-tier restoration precedence, the handoff record, optimistic
      # reconciliation, the read batcher, typing and the multi-tab presence union.
      #
      # Each is a rule that is impossible to notice breaking: the URL losing to
      # restored state dumps people in the wrong room only when they happen to have
      # restored state; a non-idempotent reconciliation duplicates a message in only
      # one of four orderings; a presence union that takes the last writer makes
      # notifications stop when somebody opens a second tab. It found three real
      # defects on its first run.
      - name: Chat SPA pure client logic (bench-free, node)
        run: node scripts/test_chat_client_logic.mjs
      # Source rules "we were careful" cannot keep: no innerHTML anywhere in the chat
      # client (every message body, sender name, room title and filename is written
      # by an employee and rendered to every other employee), no Vue in the SPA
      # bundle (the two-runtime hazard, which presents six weeks later as "the widget
      # stopped updating after I opened chat"), and the realtime event names matching
      # between chat/realtime.py and chat/socket.js (a name added on one side only is
      # indistinguishable, from the client, from a quiet room).
      - name: Chat client source rules (bench-free, node)
        run: node scripts/test_chat_source_rules.js
      # The Address coordinate gate. Latitude/longitude are user-editable and
      # every map trusts that point over the address text, so this is the one
      # place a typo silently relocates a job site. Both failures it rejects --
      # half a pair, and a transposed pair -- save cleanly without it.
      - name: Address coordinate validation
        run: python -m unittest erpnext_enhancements.tests.test_address_coordinates -v

  # ---------------------------------------------------------------------------
  # Version sync — hard gate.
  #
  # release.yml refuses to tag when __init__.py and package.json disagree
  # ("bump both together"), but it only runs after a merge to main — by then
  # the drift has already silently blocked the release (this bit v0.9.0: only
  # __init__.py was bumped, the Release run failed post-merge, and no tag was
  # cut until a follow-up PR). This job runs the same comparison on every
  # push/PR so a half-finished bump fails *before* merge, where it's cheap.
  # ---------------------------------------------------------------------------
  version-sync:
    name: Version sync (__init__.py == package.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare versions
        run: |
          PY=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' erpnext_enhancements/__init__.py)
          PKG=$(sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' package.json | head -1)
          echo "__init__.py: $PY"
          echo "package.json: $PKG"
          if [ -z "$PY" ] || [ "$PKG" != "$PY" ]; then
            echo "::error::Version drift -- __init__.py is '$PY' but package.json is '$PKG'. Bump both together (release.yml will refuse to tag otherwise)."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Committed secrets — a HARD gate, and deliberately its own job.
  #
  # ADR 0009 makes the Google integration keyless: the VM mints its own tokens via
  # IAM Credentials `signJwt`, there is no service-account JSON key, and
  # `Chat Settings` holds identifiers only. That design removes the credential.
  # This job is what keeps it removed, because the design holds only until somebody
  # drops a key file in the tree to test something locally.
  #
  # NOT a step in `unit-tests`, for one concrete reason: `actions/checkout` clones
  # at depth 1, and the whole point of the scan is HISTORY. `git rm` does not
  # un-publish anything — a key committed and reverted an hour later is still in
  # the pack, still in every clone, still on GitHub. On a shallow clone the script
  # would examine one commit and report a clean history it never read, which is the
  # precise failure mode ("passes because the pattern is wrong") a secret scanner
  # must not have. So: its own job, `fetch-depth: 0`, and the script itself REFUSES
  # to run on a shallow clone rather than reporting a false pass.
  #
  # NO `continue-on-error`. `ruff check` above is advisory by design, because of a
  # known style backlog; that reasoning does not transfer. An advisory secret scan
  # is not a secret scan.
  #
  # Proven, not assumed (2026-08-08): planting a fake service-account key, an OAuth
  # client secret and a base64 token beside a googleapis URL made it exit 1 on all
  # three; removing them returned it to 0 over 2,187 working-tree files and 7,437
  # history blobs in ~22s. Scanning this repo's real history found nothing.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: No committed secrets (working tree + full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Load-bearing. The default depth of 1 makes the history scan a no-op.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scan every tracked file and every blob in history
        run: python scripts/check_no_committed_secrets.py

  # ---------------------------------------------------------------------------
  # NOTE: A Frappe integration-test job (spinning up a real bench with ERPNext
  # + payments and running `bench run-tests --app erpnext_enhancements`) was
  # removed. On the version-16 toolchain it never reached our own assertions —
  # it kept aborting in Frappe's test-record auto-generation, which walks the
  # entire ERPNext doctype dependency graph and tripped over environment gaps
  # one after another (missing utils, uninstalled companion doctypes like
  # "Payment Gateway", etc.). Each fix only surfaced the next, so the job gated
  # PRs on upstream/environment churn unrelated to this app's code. We rely on
  # the standalone `unit-tests` job above instead. The Frappe-dependent test
  # files under erpnext_enhancements/ remain in the tree and can still be run
  # against a real bench locally (`bench --site <site> run-tests --app
  # erpnext_enhancements`); reintroduce a CI job here once the upstream test
  # harness stabilises.
  # ---------------------------------------------------------------------------
