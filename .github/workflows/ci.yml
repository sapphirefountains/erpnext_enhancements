      # mapping is a judgement call that looks arbitrary until it is wrong, and
      # the branches for UK/Nordic mailing towns and for states with no
      # two-letter form cannot be exercised on this US-only site at all.
      - name: Address component mapping (bench-free, node)
        run: node scripts/test_address_components.js
      # The floating Triton widget's streaming re-entrancy rule: every function that
      # clears the transcript, or switches which session it belongs to, must refuse
      # while a stream is in flight. Two of the four were missing it, and the failure is
      # entirely silent -- pumpText keeps writing into a detached node, finishStreaming
      # runs mermaid against dead DOM, and the turn is still persisted against the
      # session the user walked away from. Nothing throws, so nothing reports it.
      #
      # Ordering is asserted, not just presence: a guard after the destructive line is
      # decoration. Phase 3 rewires session switching entirely, which is exactly when a
      # rule this easy to agree with gets forgotten on the next function.
      #
      # Phase 3's checkpoint added two more rule families to the same file, both
      # silent in production and both invisible to anybody not using the affected
      # input method or keyboard layout: Enter-to-send must ignore an in-flight IME
      # composition (pressing Enter to COMMIT a candidate is how you type Japanese,
      # Chinese or Korean), and Alt+T must ignore AltGr (reported as ctrlKey+altKey
      # on Windows and many EU layouts). Plus the guard on decision #7: the human
      # approved a NEW manifest-backed sources row, not a change to what a turn with
      # no manifest sees -- which is every turn until Phase 5 ships.
      - name: Triton widget source guards (streaming, keyboard, preserved behaviour)
        run: node scripts/test_triton_widget_guards.js
      # ------------------------------------------------------------------
      # Phase 3's chat client. Three node steps, no runner and no npm install --
      # the same shape as the three guards above, and for the same reason: a test
      # framework that needs `npm ci` is a test framework this deploy pipeline does
      # not have, and one that is installed but never invoked is worse than none.
      #
      # These are .mjs because the code under test is ESM. Node prints a
      # MODULE_TYPELESS_PACKAGE_JSON warning on the imported .js files; do NOT
      # silence it by adding "type": "module" to package.json, which would turn the
      # two CommonJS guards above into parse errors.
      # ------------------------------------------------------------------
      # The whole §4.10 degradation table as executable rows. Every failure mode it
      # covers is INVISIBLE in production: a dropped token looks like the model chose
      # not to cite, a truncated tail looks like the model stopped early, a split
      # token looks like a glitch nobody can reproduce. The row that matters most is
      # "no citations event at all renders identically to today" -- that is what lets
      # Phase 3 ship before Phase 5 exists.
      - name: Chat inline citation renderer (bench-free, node)
        run: node scripts/test_chat_citations.mjs
      # Routes, the three-tier restoration precedence, the handoff record, optimistic
      # reconciliation, the read batcher, typing and the multi-tab presence union.
      #
      # Each is a rule that is impossible to notice breaking: the URL losing to
      # restored state dumps people in the wrong room only when they happen to have
      # restored state; a non-idempotent reconciliation duplicates a message in only
      # one of four orderings; a presence union that takes the last writer makes
      # notifications stop when somebody opens a second tab. It found three real
      # defects on its first run.
      - name: Chat SPA pure client logic (bench-free, node)
        run: node scripts/test_chat_client_logic.mjs
      # Source rules "we were careful" cannot keep: no innerHTML anywhere in the chat
      # client (every message body, sender name, room title and filename is written
      # by an employee and rendered to every other employee), no Vue in the SPA
      # bundle (the two-runtime hazard, which presents six weeks later as "the widget
      # stopped updating after I opened chat"), and the realtime event names matching
      # between chat/realtime.py and chat/socket.js (a name added on one side only is
      # indistinguishable, from the client, from a quiet room).
      - name: Chat client source rules (bench-free, node)
        run: node scripts/test_chat_source_rules.js
      # The Address coordinate gate. Latitude/longitude are user-editable and
      # every map trusts that point over the address text, so this is the one
      # place a typo silently relocates a job site. Both failures it rejects --
      # half a pair, and a transposed pair -- save cleanly without it.
      - name: Address coordinate validation
        run: python -m unittest erpnext_enhancements.tests.test_address_coordinates -v

  # ---------------------------------------------------------------------------
  # Version sync — hard gate.
  #
  # release.yml refuses to tag when __init__.py and package.json disagree
  # ("bump both together"), but it only runs after a merge to main — by then
  # the drift has already silently blocked the release (this bit v0.9.0: only
  # __init__.py was bumped, the Release run failed post-merge, and no tag was
  # cut until a follow-up PR). This job runs the same comparison on every
  # push/PR so a half-finished bump fails *before* merge, where it's cheap.
  # ---------------------------------------------------------------------------
  version-sync:
    name: Version sync (__init__.py == package.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare versions
        run: |
          PY=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' erpnext_enhancements/__init__.py)
          PKG=$(sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' package.json | head -1)
          echo "__init__.py: $PY"
          echo "package.json: $PKG"
          if [ -z "$PY" ] || [ "$PKG" != "$PY" ]; then
            echo "::error::Version drift -- __init__.py is '$PY' but package.json is '$PKG'. Bump both together (release.yml will refuse to tag otherwise)."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Committed secrets — a HARD gate, and deliberately its own job.
  #
  # ADR 0009 makes the Google integration keyless: the VM mints its own tokens via
  # IAM Credentials `signJwt`, there is no service-account JSON key, and
  # `Chat Settings` holds identifiers only. That design removes the credential.
  # This job is what keeps it removed, because the design holds only until somebody
  # drops a key file in the tree to test something locally.
  #
  # NOT a step in `unit-tests`, for one concrete reason: `actions/checkout` clones
  # at depth 1, and the whole point of the scan is HISTORY. `git rm` does not
  # un-publish anything — a key committed and reverted an hour later is still in
  # the pack, still in every clone, still on GitHub. On a shallow clone the script
  # would examine one commit and report a clean history it never read, which is the
  # precise failure mode ("passes because the pattern is wrong") a secret scanner
  # must not have. So: its own job, `fetch-depth: 0`, and the script itself REFUSES
  # to run on a shallow clone rather than reporting a false pass.
  #
  # NO `continue-on-error`. `ruff check` above is advisory by design, because of a
  # known style backlog; that reasoning does not transfer. An advisory secret scan
  # is not a secret scan.
  #
  # Proven, not assumed (2026-08-08): planting a fake service-account key, an OAuth
  # client secret and a base64 token beside a googleapis URL made it exit 1 on all
  # three; removing them returned it to 0 over 2,187 working-tree files and 7,437
  # history blobs in ~22s. Scanning this repo's real history found nothing.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: No committed secrets (working tree + full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Load-bearing. The default depth of 1 makes the history scan a no-op.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Scan every tracked file and every blob in history
        run: python scripts/check_no_committed_secrets.py

  # ---------------------------------------------------------------------------
  # NOTE: A Frappe integration-test job (spinning up a real bench with ERPNext
  # + payments and running `bench run-tests --app erpnext_enhancements`) was
  # removed. On the version-16 toolchain it never reached our own assertions —
  # it kept aborting in Frappe's test-record auto-generation, which walks the
  # entire ERPNext doctype dependency graph and tripped over environment gaps
  # one after another (missing utils, uninstalled companion doctypes like
  # "Payment Gateway", etc.). Each fix only surfaced the next, so the job gated
  # PRs on upstream/environment churn unrelated to this app's code. We rely on
  # the standalone `unit-tests` job above instead. The Frappe-dependent test
  # files under erpnext_enhancements/ remain in the tree and can still be run
  # against a real bench locally (`bench --site <site> run-tests --app
  # erpnext_enhancements`); reintroduce a CI job here once the upstream test
  # harness stabilises.
  # ---------------------------------------------------------------------------
