name: CI

# `push` is scoped to main ON PURPOSE. With a bare `push:` every commit on a PR
# branch fired the workflow TWICE -- once for `push`, once for `pull_request` --
# because the two events carry different `github.ref` values
# (`refs/heads/<branch>` vs `refs/pull/<n>/merge`) and so landed in different
# concurrency groups, deduplicating neither. Four jobs became eight competing for
# runners on every push.
#
# That was merely wasteful until 2026-08-06, when a GitHub Actions capacity
# incident turned it expensive: the doubled demand met a starved queue, and
# `cancel-in-progress` then cancelled the losers -- and a CANCELLED job makes its
# whole run report `failure`. So PRs showed red X's for jobs that had never run,
# on commits with nothing wrong. A red X that means "a duplicate got cancelled"
# teaches people to skim past red X's, which is the same rot as an advisory lint
# job nobody reads.
#
# Every branch here is merged via a PR, so the `pull_request` run is the one that
# matters; scoping `push` to main keeps CI on the deploy branch (main deploys
# automatically) without re-running the same commit twice. The trade-off, stated
# plainly: a branch pushed with NO open PR now gets no CI until the PR is opened.
on:
  push:
    branches: [main]
  pull_request:

# Keyed on the PR number for PR runs so a new commit supersedes the previous run
# for that same PR -- which is what cancel-in-progress is actually for. Falls
# back to `github.ref` for pushes to main. Before this, cancellation happened
# between two events racing over one commit, which is not a supersede at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint — advisory, but much closer to a gate than it was.
  #
  # v1.253.2 ran `ruff check --fix` across the app (306 findings: whitespace,
  # import sorting, f-strings, stale noqa) and moved RUF001/2/3 to the ignore
  # list, since every occurrence was deliberate typography — en dashes, `×` in
  # dimensions, a real minus sign — that "fixing" would have rewritten into ASCII.
  # That took the backlog from 429 to 73.
  #
  # The remaining 73 are NOT auto-fixable and are judgement calls, not bugs:
  # B905 (`zip()` without `strict=`) is a behavioural decision per call site,
  # E722 (bare `except`) is deliberate in the defensive handlers this app relies
  # on, and the rest are idiom preferences (UP030/UP031, RUF005/007/012/015/046).
  # Clearing those, then `ruff format` (391 files, ~68k lines — time it when
  # nothing is in flight), is what stands between here and dropping
  # `continue-on-error`. Tracked as TASK-2026-01241 on PRJ-00580.
  #
  # F821 is already a hard gate in its own job below; that is the rule that
  # actually catches runtime failures, and it does not wait for this.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.1
      - name: ruff check
        continue-on-error: true
        run: ruff check erpnext_enhancements/ --output-format=github

  # ---------------------------------------------------------------------------
  # Undefined names — a HARD gate, carved out of the advisory job above.
  #
  # F821 is not style. An undefined name is a NameError at runtime, and this app
  # swallows exceptions on purpose in the places it is most likely to bite:
  # scheduler jobs, doc_events and notification helpers all wrap their bodies in
  # `except Exception: frappe.log_error(...)` so a notification problem cannot
  # cost the work it was reporting on. That guard is correct — and it converts a
  # NameError into silence.
  #
  # It already had. `kpi_dashboards/snapshots.py` used `_()` without importing
  # it, so the marketing data-source alert raised NameError on every firing, got
  # swallowed, and logged under a title reading "KPI marketing web — source
  # alert" — which looks like the ALERTING broke, not the data source. A dead GA4
  # or Search Console feed therefore produced no notification at all, and the one
  # thing standing between a stale marketing number and somebody reading it as
  # real had never once run. Fixed in v1.250.1; this stops it recurring.
  #
  # Separate job rather than a step in "Lint (ruff, advisory)" so that job's name
  # stays honest and a red build here is unambiguous about what broke. Deliberately
  # ONE rule: the wider 433-finding style backlog stays advisory above.
  # ---------------------------------------------------------------------------
  undefined-names:
    name: No undefined names (F821)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.1
      - name: ruff check --select F821
        run: ruff check erpnext_enhancements/ --select F821 --output-format=github

  # ---------------------------------------------------------------------------
  # Standalone unit tests — no Frappe/bench required, so they run fast on every
  # push. Covers the time-kiosk consolidation algorithm, plus the bench-free
  # suites that guard the security-sensitive AI write gate
  # (assistant_tools/_gate.py), the FAC assistant-tool contract, and the
  # Integrations Health tone helpers. The latter three import their tool
  # modules under the sys.modules stubs installed by test_assistant_tools_schema
  # (no live frappe / FAC), so they run here as plain unittest. A final check
  # (test_doctype_modules) asserts every custom DocType sits in its declared
  # module — pure filesystem, no stubs.
  #
  # The QuickBooks Online suite is bench-free too but is plain pytest functions
  # (the `monkeypatch` fixture), which `python -m unittest` silently cannot
  # collect — it ran nowhere in CI and broke unnoticed for weeks. It gets its
  # own pytest step below; any future pytest-style bench-free suite belongs on
  # that step, not the unittest module list.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Standalone unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip httpx pytest jinja2
      - run: python -m unittest test_sync_time_kiosk.py -v
      - name: AI gate + assistant-tool contract + integrations health + device mgmt
        run: >-
          python -m unittest
          erpnext_enhancements.tests.test_assistant_tools_schema
          erpnext_enhancements.tests.test_ai_gate_unit
          erpnext_enhancements.tests.test_integrations_health
          erpnext_enhancements.tests.test_device_management
          erpnext_enhancements.tests.test_mdm_integration
          erpnext_enhancements.tests.test_drive_match -v
      - name: DocType module placement
        run: python -m unittest erpnext_enhancements.tests.test_doctype_modules -v
      # hooks.py is one big dict literal, and Python resolves a repeated key by keeping
      # the LAST and silently discarding the earlier value -- no error, no warning, the
      # hooks just never fire. Two duplicated doc_events keys cost six live handlers
      # (recurring task generation, project date sync, next-visit dates) and nobody
      # noticed, because the symptom is absence. ruff flags it as F601 but that job is
      # advisory here, so it does not fail a PR. This does.
      - name: hooks.py integrity (no duplicate keys or handlers)
        run: python -m unittest erpnext_enhancements.tests.test_hooks_integrity -v
      # Guards the silent workspace failure mode: `content` (the layout) and the
      # child tables (the data) are joined by label and nothing keeps them in sync,
      # so a block with no row renders an empty div and a row with no block never
      # appears. v1.146.0 shipped exactly that across seven widgets.
      - name: Workspace structure (content <-> child rows, WI-018)
        run: python -m unittest erpnext_enhancements.tests.test_workspaces -v
      # The customer-facing sales formats. A print format fails in the worst way --
      # the deploy succeeds, nothing logs, and the defect is found by a customer
      # holding the PDF. This compiles AND renders all three against sample documents
      # (1 item, 10 items, no items, no taxes, every optional field blank).
      - name: Sales print formats (WI-020, bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_sales_print_formats -v
      - name: PO approval threshold (WI-013, bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_po_approval -v
      # Own step: installs its own frappe stub in setUpModule, so it must not
      # share a process with the other bench-free suites.
      - name: Administrator login alerts (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_security_alerts -v
      # Guards the "routes the truck to the wrong address, confidently" class of
      # bug: the supplier pick-up address fallback order, our own yard never
      # becoming a stop, and the PO -> Project union that either link alone drops.
      - name: Supplier pick-up routing (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_pickup_routing -v
      # Guards the "set a primary here, silently re-point it over there" class of
      # bug: is_primary_contact / is_primary_address are columns on the
      # Contact/Address record, so only Customer and Supplier can own them. A
      # Project or Opportunity context must be refused, not quietly applied to
      # whichever account happened to be nearby. Also fences the Supplier path
      # that the pick-up routing address ordering depends on.
      - name: Primary contact/address scoping (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_sync_contact_primary -v
      # Own step, not folded into a multi-module list: each bench-free suite
      # installs its own `frappe` stub in setUpModule, and a separate process
      # keeps them from cross-talking.
      - name: PO separation of duties (WI-066, bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_po_segregation -v
      # Guards the seeded mermaid charts (must start with "graph ", no raw "<",
      # no pre-escaped entities). It existed but ran nowhere until WI-066.
      - name: Seeded process documents (mermaid contract)
        run: python -m unittest erpnext_enhancements.tests.test_process_documents -v
      - name: Contract e-signature (tokens, sig() fallthrough, template patch)
        run: python -m unittest erpnext_enhancements.tests.test_contract_esign -v
      # Own step for the same reason as the suites above: its frappe stub points
      # get_app_path at the repo so the real logo.svg is read. Guards the print
      # format fixture too — the footer's #footer-html / .page / .topage hooks
      # and the one rule that keeps that footer off every non-PDF surface.
      - name: Contract branding (letterhead, footer, print CSS)
        run: python -m unittest erpnext_enhancements.tests.test_contract_style -v
      - name: KPI dashboard metrics (pure math) + cockpit workspace constants
        run: >-
          python -m unittest
          erpnext_enhancements.tests.test_kpi_metrics
          erpnext_enhancements.tests.test_custom_html_blocks -v
      # Department dashboard widgets: the registry, the settings toggles, the
      # seeder's placement map and the shipped workspace JSONs must agree. A
      # placement naming an unseeded block renders an empty div with no error, so
      # the wiring is asserted here rather than discovered on a dashboard.
      - name: Department dashboard widget wiring
        run: python -m unittest erpnext_enhancements.tests.test_dashboard_widgets -v
      # Own step: installs its own frappe stub in setUpModule, so it must not
      # share a process with the other stub-installing suites.
      #
      # The F821 job guards the bug class statically; this guards the BEHAVIOUR
      # that class was hiding. The marketing source alert raised NameError on
      # every firing and the function's own `except Exception` swallowed it, so
      # a broken GA4 feed notified nobody and the only trace was an Error Log row
      # that read as though the alerting had failed. The load-bearing assertions
      # are therefore "a failing source notifies somebody" and "no Error Log row
      # is written" -- before the fix those were exactly inverted.
      - name: KPI marketing source alert (a dead feed must notify)
        run: python -m unittest erpnext_enhancements.tests.test_kpi_source_alert -v
      # Pure filesystem, like test_doctype_modules: it reads the desk JS rather
      # than running it, because there is no JS runner here and the Project
      # toolbar is assembled by five scripts that cannot see each other.
      #
      # This suite shipped with v1.183.0 and was never added to any step, so it
      # ran NOWHERE -- the exact failure mode CLAUDE.md warns about -- and the
      # regression it existed to catch shipped anyway: project_form_script.js was
      # hiding the whole "View" dropdown, so the Project Brief button that same
      # release folded into it was invisible on every project for a week.
      - name: Project toolbar grouping (bench-free, source-level)
        run: python -m unittest erpnext_enhancements.tests.test_project_toolbar -v
      - name: Water engineering (pure engine + design issues + controller helpers)
        run: >-
          python -m unittest
          erpnext_enhancements.tests.test_water_engine
          erpnext_enhancements.tests.test_water_design_issues
          erpnext_enhancements.tests.test_water_design_controller -v
      # Own step: this suite installs its own frappe stub in setUpModule, so it
      # must not share a process with the other stub-installing suites. It guards
      # the hourly Drive shadow sync's survival when the DB connection drops
      # mid-run -- the failure mode that leaves no trace anywhere, because the
      # error handler's own rollback and log_error both need the connection it
      # just lost.
      - name: Drive shadow sync (survives a dropped DB connection)
        run: python -m unittest erpnext_enhancements.tests.test_drive_sync_recovery -v
      # Own step for the same reason -- its own frappe stub in setUpModule. Guards
      # the linked-folder reconciliation: a deleted Drive folder must end up
      # flagged ON THE RECORD, or the Open Drive Folder button keeps handing
      # people a Google 404 (PRJ-00706).
      - name: Drive link reconciliation (dead folders are flagged on the record)
        run: python -m unittest erpnext_enhancements.tests.test_drive_link_reconcile -v
      # THREE separate steps, not one `unittest a b c`. Each installs its own
      # frappe stub in setUpModule, and running them in one process cross-talks:
      # the roles suite imports the real erpnext_enhancements.training.roles, and
      # `from ... import roles` in training.assignment then resolves the attribute
      # already set on the package rather than the assignment suite's stub. That
      # combination fails; individually all three pass. Verified 2026-08-01.
      #
      # The publish suite is the load-bearing one: it walks the serialized
      # learner-facing payload to any depth and fails if a correct-answer marker
      # appears anywhere, so a newly added field that leaks the quiz key is caught
      # here rather than by a learner. It already caught one — per-option feedback
      # text ("why this option is wrong") was being shipped before the learner
      # answered.
      - name: Training publish (answer key never reaches the learner payload)
        run: python -m unittest erpnext_enhancements.tests.test_training_publish -v
      - name: Training roles (desk_access, profile-vs-direct grant)
        run: python -m unittest erpnext_enhancements.tests.test_training_roles -v
      - name: Training assignment rules (targeting, first-match, save guards)
        run: python -m unittest erpnext_enhancements.tests.test_training_assignment_rules -v
      # V4 signing is hand-rolled (google-cloud-storage cannot be installed on
      # the host), and it has exactly one failure mode worth guarding: a subtly
      # wrong signature still produces a well-formed URL, and the only symptom is
      # an opaque 403 from GCS that is impossible to diagnose by inspection. So
      # this suite rebuilds the string-to-sign independently from the spec and
      # compares, rather than asserting the implementation's own output.
      - name: Training media (V4 signed URL canonical request)
        run: python -m unittest erpnext_enhancements.tests.test_training_gcs_media -v
      # Regressions for four defects that shipped in 1.207.0-1.209.0 and were
      # found by an adversarial review afterwards. Three of them were ORDERING
      # bugs -- work done in validate() that Frappe needs before validate runs --
      # and the existing suites could not have caught them, because they stub
      # frappe wholesale and so never exercise the framework's own sequencing.
      # These assert the ordering contract directly, and against the real frappe
      # source when a bench checkout is present (skipped cleanly when not).
      - name: Training regressions (naming/link ordering, role profiles, answer keys)
        run: python -m unittest erpnext_enhancements.tests.test_training_regressions -v
      # Phase 2. progress is the watched-seconds arithmetic that decides whether
      # somebody passed; grading is the only module allowed to read an answer key,
      # and its suite repeats the walk-the-payload-to-any-depth leak test that
      # caught a real leak in Phase 1.
      - name: Training progress (watched-interval merge, server-clock clamp)
        run: python -m unittest erpnext_enhancements.tests.test_training_progress -v
      - name: Training grading (server-side grading, answer-key isolation)
        run: python -m unittest erpnext_enhancements.tests.test_training_grading -v
      # The player and the progress store speak deliberately different shapes and
      # only api.training._normalise_beat knows both. Drift there is SILENT AND
      # TOTAL -- mismatched keys credit zero seconds, so no video lesson can ever
      # be completed and nothing raises. That is not hypothetical: the two halves
      # were first written against each other with `ranges` vs `intervals`,
      # structured vs integer `seeks`, and a nested vs top-level `hidden`.
      - name: Training heartbeat wire format (player <-> progress)
        run: python -m unittest erpnext_enhancements.tests.test_training_heartbeat_wire -v
      # The Phase 3 seams, specified before the code. Four integration breaks got
      # through the Phase 2 fan-out build and every one was two correct halves
      # with a wrong join, so Phase 3's joins are pinned up front instead.
      # Phase-3 assertions SKIP until the files exist -- they are acceptance
      # criteria, not decoration -- while the Phase 2 contracts they build on are
      # enforced now so they cannot drift underneath the build.
      - name: Training Phase 3 seam contracts
        run: python -m unittest erpnext_enhancements.tests.test_training_phase3_contracts -v
      # AI drafting. The load-bearing assertions are about what must NOT happen:
      # drafting never stamps ai_reviewed_by (a pre-reviewed draft walks straight
      # past the submit-for-review gate), and suggest_checkpoints refuses without
      # a timed transcript rather than letting a model invent timestamps.
      - name: Training AI drafting (strict parsing, review gate, transcript gate)
        run: python -m unittest erpnext_enhancements.tests.test_training_ai -v
      # Phase 4 seams. The load-bearing one is compliance: it fires on a maintenance
      # visit or task assignment, by which point a truck is usually already at a
      # site, so a hard block there means the work happens with NO RECORD AT ALL --
      # worse than the uncertified assignment it was flagging. The suite asserts
      # frappe.throw appears nowhere in that module and that an exception inside the
      # check cannot propagate.
      - name: Training Phase 4 seam contracts
        run: python -m unittest erpnext_enhancements.tests.test_training_phase4_contracts -v
      - name: Training certificates (issuance, snapshot, verify PII, recertification)
        run: python -m unittest erpnext_enhancements.tests.test_training_certificates -v
      # Every dotted path in hooks.py must name something that exists. Frappe
      # resolves after_migrate at the very END of `bench migrate`, so a typo there
      # fails the deploy after every schema change has already been applied -- the
      # most expensive possible moment to find one. It cost a production build.
      - name: Hook targets resolve (no dangling hooks.py paths)
        run: python -m unittest erpnext_enhancements.tests.test_hook_targets_resolve -v
      - name: Training compliance (warn-only, never blocks a save)
        run: python -m unittest erpnext_enhancements.tests.test_training_compliance -v
      # Regressions from the FIRST REAL EXECUTION of the module. Four phases of
      # reading found a lot; running it once found three more, and the most useful
      # assertion here is static: every field name written through _doc_payload is
      # cross-checked against the DocType JSON. That would have caught the score
      # bug -- a learner who scored 100 getting a certificate reading 0 -- before it
      # ever ran, with no bench required.
      - name: Training runtime regressions (field names, sign-off gate)
        run: python -m unittest erpnext_enhancements.tests.test_training_runtime_regressions -v
      # The authoring ENTRY PATH, as opposed to any single function on it. Both of
      # the first two bugs here were reported by a real author on day one and
      # neither is catchable by unit-testing a function: a placeholder that
      # outlived its feature, and a refusal that named the wrong state. Static
      # reads of the desk JS, which never runs in CI and has no bench here.
      - name: Training builder entry path (routing, guards, change_type)
        run: python -m unittest erpnext_enhancements.tests.test_training_builder_entry -v
      # Does the learner page's stylesheet style the page the scripts build? It
      # did not: 130 of the 138 classes the player emits had no rule, because the
      # CSS was written against an earlier vocabulary and never followed the
      # rewrite. Nothing catches that at runtime -- an unstyled element is not an
      # error, it just renders wrongly -- so it took a person opening the page.
      - name: Training player CSS contract (every rendered class has a rule)
        run: python -m unittest erpnext_enhancements.tests.test_training_player_css_contract -v
      # Does the player read the keys the server sends? It did not: the bootstrap
      # returns `assigned`/`library` and the player read `courses`/`catalog`, so
      # /training told every learner nothing was assigned to them, always. A
      # missing key in JS is undefined, and `undefined || []` renders perfectly --
      # there is nothing at runtime that could notice.
      - name: Training bootstrap wire (player reads what the API sends)
        run: python -m unittest erpnext_enhancements.tests.test_training_boot_wire -v
      # The kiosk service worker is registered at ROOT scope, so what it answers
      # for is every page's problem. It used to serve the whole app's assets
      # cache-first with ignoreSearch, which froze JavaScript across the site for
      # any browser that had ever opened /kiosk -- found with a training player
      # four releases stale that no ?v= could reach.
      - name: Kiosk service worker scope (must not answer for the app's assets)
        run: python -m unittest erpnext_enhancements.tests.test_kiosk_service_worker -v
      # Semi-monthly commission periods. Every failure mode here is a *plausible*
      # statement -- right shape, wrong rows -- which nothing downstream can
      # notice: a boundary day in neither period (the live report was dropping
      # deals closed on a 1st or a 16th), the closed period and the running one
      # swapped, or a second statement for a period already paid.
      - name: Pay-period commission report (window math, send-once, restore)
        run: python -m unittest erpnext_enhancements.tests.test_pay_period_reports -v
      # The Closed-Won hand-off gate. Its own step because it installs a frappe
      # stub in setUpModule, and sharing a process with another stub-installing
      # suite is how they cross-talk.
      #
      # Guards a failure mode that is invisible from the outside: a gate that
      # stops gating looks exactly like a gate that is working. The 2026-08-06
      # audit measured the cost of that — 8 of 28 projects created off-process,
      # 17 of 17 hand-off meetings past SLA — and nothing reported either. Also
      # pins the over-firing direction (a legacy Closed-Won deal must NOT be
      # blocked, or a 227-deal backlog freezes), the business-day maths across a
      # weekend, and that step 5 never escalates while step 4 does.
      - name: Closed-Won hand-off gate (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_handoff_gate -v
      - name: QuickBooks Online sync (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_quickbooks_online.py -q
      - name: Stripe Payments (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_stripe_payments.py -q
      # A www/ controller whose filename contains a hyphen is never imported by
      # frappe, so its get_context() silently never runs. stripe-return.py was
      # broken this way from the day it was written until v1.159.10.
      - name: www controller filenames must be importable
        run: python scripts/check_www_controllers.py
      # Frappe calls orjson.loads() on EVERY file in the app-level directories named by
      # IMPORTABLE_DOCTYPES — no *.json filter. One stray file aborts the whole schema
      # sync, so the site fails to migrate on deploy. This killed production's migrate on
      # 2026-07-31 when Frappe 16.29.0 added ("desk", "workspace_sidebar") to that list
      # and a README that had sat there harmlessly for two days became an import target.
      - name: app-level import directories must contain only JSON
        run: python scripts/check_import_dirs.py
      # Guards the "writes to a field that doesn't exist, silently" class of bug:
      # every field the Lead/Opportunity hooks assign must be a declared Custom
      # Field, and nothing may target the removed `source` field.
      - name: Lead/Opportunity attribution (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_lead_attribution.py -q
      - name: Fountain move intake (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_fountain_move.py -q
      # Field systems (WP-2/3/8). Its own step because it installs a frappe stub in
      # sys.modules — sharing a process with another stub-installing suite is how
      # they cross-talk. Guards two things that fail expensively and quietly: a
      # PENDING photo upload must keep counting as "captured" (or a technician on a
      # site with no signal cannot clock out), and the payroll workbook's 14 columns
      # must stay in position (the provider's import maps by position, so a
      # reordered column lands somebody's hours in the Bonus field).
      - name: Field photo gate + payroll export (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_field_systems.py -q
      # Account hygiene + pipeline reconciliation. Own step (own frappe stub).
      # The two invariants that cost the most if they break: nothing may bulk-link
      # an Opportunity to a Project (a wrong link corrupts the revenue attribution
      # WP-1 exists to fix), and Customer.industry must never be made mandatory by
      # reqd/mandatory_depends_on — those are evaluated on every save by every
      # caller, and QBO inserts Customers without ignore_mandatory, so a
      # declarative rule parks every synced customer in manual review.
      - name: Account hygiene + reconciliation (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_account_hygiene.py -q
      # Marketing spend import + value-stream dashboard. Own step (own frappe stub).
      # Guards the normalisation path (an unreadable amount must be REFUSED, not
      # coerced to 0 by frappe's flt — a silent zero in the denominator of every
      # cost-per-lead figure), and that no marketing KPI reads `Opportunity.source`
      # / `Lead.source` again: erpnext v15 orphaned those columns, frappe never
      # drops columns, so the queries ran and returned plausible numbers for years.
      - name: Marketing spend + value stream dashboard (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_marketing_spend.py -q
      # Guards the Gantt widget read API's security contract: client-supplied
      # configs must never reach the query layer with an unvalidated fieldname.
      - name: Gantt widget read API (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_gantt_api.py -q
      # Guards the "the badge says Partially Ordered on a line that is fully
      # ordered" class of bug: an item's status must be computed from that item's
      # own ordered-vs-requested quantity, never inherited from its parent
      # document's header status. The Procurement Tracker did exactly that, so 29
      # of 32 item rows on production were mislabelled.
      - name: Procurement quantity/status math (bench-free pytest suite)
        run: python -m pytest erpnext_enhancements/tests/test_procurement_quantities.py -q
      # The repo's first JavaScript test, and it needs no runner beyond the node
      # already on the GitHub image — deliberately not a new framework.
      #
      # It guards the Pick Routing Map's line arithmetic: the "collect 3" figure a
      # driver reads off a printed pick sheet at a supplier's counter. That number
      # is rendered twice (compact list in the dialog, table on the sheet) from one
      # computation, and a wrong one is discovered across the valley rather than in
      # review. It also covers what production cannot — there is still no partly
      # received Purchase Order on the live site, so the "(n of m received)" and
      # dimmed already-collected states have no real record to exercise them.
      - name: Pick routing line arithmetic + escaping (bench-free, node)
        run: node scripts/test_pick_routing_lines.js
      # Google address components -> Frappe Address fields. Every rule in that
      # mapping is a judgement call that looks arbitrary until it is wrong, and
      # the branches for UK/Nordic mailing towns and for states with no
      # two-letter form cannot be exercised on this US-only site at all.
      - name: Address component mapping (bench-free, node)
        run: node scripts/test_address_components.js
      # The Address coordinate gate. Latitude/longitude are user-editable and
      # every map trusts that point over the address text, so this is the one
      # place a typo silently relocates a job site. Both failures it rejects --
      # half a pair, and a transposed pair -- save cleanly without it.
      - name: Address coordinate validation
        run: python -m unittest erpnext_enhancements.tests.test_address_coordinates -v

  # ---------------------------------------------------------------------------
  # Version sync — hard gate.
  #
  # release.yml refuses to tag when __init__.py and package.json disagree
  # ("bump both together"), but it only runs after a merge to main — by then
  # the drift has already silently blocked the release (this bit v0.9.0: only
  # __init__.py was bumped, the Release run failed post-merge, and no tag was
  # cut until a follow-up PR). This job runs the same comparison on every
  # push/PR so a half-finished bump fails *before* merge, where it's cheap.
  # ---------------------------------------------------------------------------
  version-sync:
    name: Version sync (__init__.py == package.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare versions
        run: |
          PY=$(sed -n 's/^__version__ *= *"\([^"]*\)".*/\1/p' erpnext_enhancements/__init__.py)
          PKG=$(sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' package.json | head -1)
          echo "__init__.py: $PY"
          echo "package.json: $PKG"
          if [ -z "$PY" ] || [ "$PKG" != "$PY" ]; then
            echo "::error::Version drift -- __init__.py is '$PY' but package.json is '$PKG'. Bump both together (release.yml will refuse to tag otherwise)."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # NOTE: A Frappe integration-test job (spinning up a real bench with ERPNext
  # + payments and running `bench run-tests --app erpnext_enhancements`) was
  # removed. On the version-16 toolchain it never reached our own assertions —
  # it kept aborting in Frappe's test-record auto-generation, which walks the
  # entire ERPNext doctype dependency graph and tripped over environment gaps
  # one after another (missing utils, uninstalled companion doctypes like
  # "Payment Gateway", etc.). Each fix only surfaced the next, so the job gated
  # PRs on upstream/environment churn unrelated to this app's code. We rely on
  # the standalone `unit-tests` job above instead. The Frappe-dependent test
  # files under erpnext_enhancements/ remain in the tree and can still be run
  # against a real bench locally (`bench --site <site> run-tests --app
  # erpnext_enhancements`); reintroduce a CI job here once the upstream test
  # harness stabilises.
  # ---------------------------------------------------------------------------
