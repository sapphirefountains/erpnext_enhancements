      # thing that leaks if you get it wrong: Employee Credential grants read to the
      # `Employee` role (deliberately -- it is what puts a technician's own card on
      # their own profile and what keeps the module inside allow_modules), so the
      # scoping hook has to ship in the same release, not after it. Also pins that
      # status is derived rather than typed, that revocation beats the calendar, and
      # that "Expiring" still reads as qualified -- a horizon that reads as a refusal
      # does the opposite of its job.
      - name: HR credentials (scoping, expiry, skills matrix)
        run: python -m unittest erpnext_enhancements.tests.test_hr_credentials -v
      # The safety check that reported clean because it had nothing to look at.
      # compliance.py warns when somebody is scheduled onto work they are not
      # certified for -- and on this site it has never produced a single finding,
      # because all three of its sources required the person to have ALREADY been
      # assigned the course, and there were no assignment rules. Note the failure
      # direction: it PASSES. Same family as the PAD SPACE whitespace queries.
      - name: Training dispatch advisory (it fires, and it only ever warns)
        run: python -m unittest erpnext_enhancements.tests.test_training_dispatch_advisory -v
      # The profile, and the line between "my record" and "a colleague's entry".
      # The construction is what is pinned, not the field list: the colleague
      # payload is built by SELECTING public fields, never by deleting private
      # ones -- with a subtractive filter every field added later is public until
      # somebody remembers to exclude it, and the person adding a field is never
      # thinking about the directory. Also pins that customers are kept out by
      # requiring EMPLOYMENT rather than by checking a role, since Training
      # Learner is held by every customer contact and a role can be granted by
      # accident.
      - name: HR profile (what a colleague may see, and what a customer may not)
        run: python -m unittest erpnext_enhancements.tests.test_hr_profile -v
      # WI-072 shipped a ladder whose tier IS the sign-off authority, and no route
      # up it -- prod has four Junior Technicians and ONE Senior, so one person is
      # the only one in the company who can attest for any of them. This pins the
