name: CI

# `push` is scoped to main ON PURPOSE. With a bare `push:` every commit on a PR
# branch fired the workflow TWICE -- once for `push`, once for `pull_request` --
# because the two events carry different `github.ref` values
# (`refs/heads/<branch>` vs `refs/pull/<n>/merge`) and so landed in different
# concurrency groups, deduplicating neither. Four jobs became eight competing for
# runners on every push.
#
# That was merely wasteful until 2026-08-06, when a GitHub Actions capacity
# incident turned it expensive: the doubled demand met a starved queue, and
# `cancel-in-progress` then cancelled the losers -- and a CANCELLED job makes its
# whole run report `failure`. So PRs showed red X's for jobs that had never run,
# on commits with nothing wrong. A red X that means "a duplicate got cancelled"
# teaches people to skim past red X's, which is the same rot as an advisory lint
# job nobody reads.
#
# Every branch here is merged via a PR, so the `pull_request` run is the one that
# matters; scoping `push` to main keeps CI on the deploy branch (main deploys
# automatically) without re-running the same commit twice. The trade-off, stated
# plainly: a branch pushed with NO open PR now gets no CI until the PR is opened.
on:
  push:
    branches: [main]
  pull_request:

# Keyed on the PR number for PR runs so a new commit supersedes the previous run
# for that same PR -- which is what cancel-in-progress is actually for. Falls
# back to `github.ref` for pushes to main. Before this, cancellation happened
# between two events racing over one commit, which is not a supersede at all.
# Cancellation is for PRs only. On a PR, a newer commit genuinely supersedes the
# older run -- same branch, same question, stale answer. On `main` it does not:
# every push is a DIFFERENT commit, and cancelling one to start the next means
# the superseded commit's CI never finishes.
#
# That is not hypothetical. On 2026-08-07 four `main` runs were cancelled, three
# of them within 31 seconds, because PRs were merged back to back. Each of those
# commits had passed CI as a PR -- but a PR runs against the *merge ref* as main
# stood at that moment, so the run on `main` is the only check of the tree that
# actually resulted. Three merged states were never validated, and `main` deploys
# automatically.
#
# So: supersede on PRs, never on main. The cost is that back-to-back merges queue
# instead of collapsing, which is the correct trade for the deploy branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Lint — advisory, but much closer to a gate than it was.
  #
  # v1.253.2 ran `ruff check --fix` across the app (306 findings: whitespace,
  # import sorting, f-strings, stale noqa) and moved RUF001/2/3 to the ignore
  # list, since every occurrence was deliberate typography — en dashes, `×` in
  # dimensions, a real minus sign — that "fixing" would have rewritten into ASCII.
  # That took the backlog from 429 to 73.
  #
  # THE 73 AND THE FORMAT PASS WERE BOTH WRONG. Re-measured on main at v1.305.0
  # with the pinned ruff 0.8.1: `ruff check` reported 189, not 73 — the backlog
  # grew back as the app did. v1.306.0 retired 41 of those in config alone
  # (UP038 on ruff's own "this results in slower code" advice, RUF012 scoped to
  # test stubs), leaving 148.
  #
  # And the format pass is NOT a prerequisite for anything. THIS FILE CONTAINS NO
  # `ruff format` STEP: the only two ruff invocations are the `ruff check` below
  # and the `--select F821` gate further down, so dropping `continue-on-error`
  # needs `ruff check` clean and nothing else. Formatting the whole repo moves the
  # check backlog by five findings, for a 467-file diff that would also convert
  # 147 space-indented files to tabs — overturning the mixed-indentation
  # convention CLAUDE.md tells every contributor to preserve. Do not run it as
  # part of this.
  #
  # What is left is genuinely editorial, and TASK-2026-01241 tracks it: mostly
  # autofixable idiom (UP030/UP031, RUF005/007/015, I001), plus two decisions —
  # the `# noqa: BLE001` comments that RUF100 calls unused (BLE is not in `select`,
  # so the suppression is dead, but the comments mark deliberate blind `except`
  # handlers that CLAUDE.md calls load-bearing), and B905's `strict=` on 9 call
  # sites. Most of the BLE001 sites were in chat/governance/ and went with that
  # module in v1.426.0; the class of finding did not.
  #
  # F821 is already a hard gate in its own job below; that is the rule that
  # actually catches runtime failures, and it does not wait for this.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.1
      - name: ruff check
        continue-on-error: true
        run: ruff check erpnext_enhancements/ --output-format=github

  # ---------------------------------------------------------------------------
  # JavaScript. New, and a HARD gate on errors — because until now NOTHING linted
  # the JS in this app. `npm run lint` existed and nothing ran it, so every
  # front-end file here has shipped unchecked: ~30k lines of desk pages, the
  # learner runtime, the Triton widget.
  #
  # The first run found 42 errors, and the split is the reason this is worth a
  # job rather than a one-off cleanup. 28 were the linter not knowing this app's
  # own globals — `TR`, the namespace every training desk surface shares, was
  # absent from .eslintrc while `erpnext_enhancements` was present, so four
  # existing pages and one new one all failed on a config gap rather than a bug.
  # A linter that is wrong about your own code is a linter people learn to
  # ignore. The rest were real: four empty `catch (e) {}` blocks (now carrying
  # the reason they swallow), a `hasOwnProperty` read straight off an instance,
  # and a zero-width space sitting inside a comment in the learner runtime.
  #
  # `--quiet` means ERRORS fail and warnings do not. That is deliberate: the 175
  # remaining warnings are all `no-console` in `scripts/*.js`, which are node
  # CLI tools where console IS the output. Gating on them would force either a
  # pointless suppression sweep or a permanently red job, and a permanently red
  # job gates nothing. Errors are at zero today, so any error is a new one.
  eslint:
    name: Lint JS (eslint, errors are a gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # `npm ci` rather than `npm install`: the lockfile pins eslint 8.57.1, and
      # .eslintrc is the flat-config-free format that only v8 reads. An
      # unpinned install would pull v9+, which refuses .eslintrc outright and
      # fails with a migration notice that looks nothing like a lint failure.
      - run: npm ci
      - name: eslint (errors only)
        run: npx eslint . --quiet

  # ---------------------------------------------------------------------------
  # Undefined names — a HARD gate, carved out of the advisory job above.
  #
  # F821 is not style. An undefined name is a NameError at runtime, and this app
  # swallows exceptions on purpose in the places it is most likely to bite:
  # scheduler jobs, doc_events and notification helpers all wrap their bodies in
  # `except Exception: frappe.log_error(...)` so a notification problem cannot
  # cost the work it was reporting on. That guard is correct — and it converts a
  # NameError into silence.
  #
  # It already had. `kpi_dashboards/snapshots.py` used `_()` without importing
  # it, so the marketing data-source alert raised NameError on every firing, got
  # swallowed, and logged under a title reading "KPI marketing web — source
  # alert" — which looks like the ALERTING broke, not the data source. A dead GA4
  # or Search Console feed therefore produced no notification at all, and the one
  # thing standing between a stale marketing number and somebody reading it as
  # real had never once run. Fixed in v1.250.1; this stops it recurring.
  #
  # Separate job rather than a step in "Lint (ruff, advisory)" so that job's name
  # stays honest and a red build here is unambiguous about what broke. Deliberately
  # ONE rule: the wider 433-finding style backlog stays advisory above.
  # ---------------------------------------------------------------------------
  undefined-names:
    name: No undefined names (F821)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.1
      - name: ruff check --select F821
        run: ruff check erpnext_enhancements/ --select F821 --output-format=github

  # ---------------------------------------------------------------------------
  # Standalone unit tests — no Frappe/bench required, so they run fast on every
  # push. Covers the time-kiosk consolidation algorithm, plus the bench-free
  # suites that guard the security-sensitive AI write gate
  # (assistant_tools/_gate.py), the FAC assistant-tool contract, and the
  # Integrations Health tone helpers. The latter three import their tool
  # modules under the sys.modules stubs installed by test_assistant_tools_schema
  # (no live frappe / FAC), so they run here as plain unittest. A final check
  # (test_doctype_modules) asserts every custom DocType sits in its declared
  # module — pure filesystem, no stubs.
  #
  # The QuickBooks Online suite is bench-free too but is plain pytest functions
  # (the `monkeypatch` fixture), which `python -m unittest` silently cannot
  # collect — it ran nowhere in CI and broke unnoticed for weeks. It gets its
  # own pytest step below; any future pytest-style bench-free suite belongs on
  # that step, not the unittest module list.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Standalone unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip httpx pytest jinja2
      - run: python -m unittest test_sync_time_kiosk.py -v
      # The A1 read tools each wrap a function that returns more than a reader
      # should see: a live billable Google Maps browser key, the e-signature
      # evidence (token hashes, the agreement text as signed, signature image,
      # signer IP, consent wording), a certificate's verification code, and
      # per-learner answers behind an "aggregate" item analysis. Static, and
      # checked against the live doctypes, so a field renamed later cannot drop
      # out of the list it is supposed to be in.
      - name: AI gate + assistant-tool contract + integrations health + device mgmt
        run: >-
          python -m unittest
          erpnext_enhancements.tests.test_assistant_tools_schema
          erpnext_enhancements.tests.test_ai_gate_unit
          erpnext_enhancements.tests.test_ai_gate_per_call
          erpnext_enhancements.tests.test_integrations_health
          erpnext_enhancements.tests.test_device_management
          erpnext_enhancements.tests.test_mdm_integration
          erpnext_enhancements.tests.test_drive_match -v
      - name: Assistant tool redaction (what the read tools must never return)
        run: python -m unittest erpnext_enhancements.tests.test_assistant_tools_redaction -v
      # Its own step, and NOT appended to the assistant-tool step above, because that
      # step runs under the sys.modules stub set test_assistant_tools_schema installs
      # and this suite deliberately imports no frappe at all -- item_naming_rules takes
      # only `re` and `typing`, which is what puts it in this tier in the first place.
      #
      # It guards the rule that made the hand-written version of this check wrong in
      # both directions. A block-allocated number is occupied by any code beginning with
      # the prefix and exactly the declared digits, however badly the rest of that record
      # is named -- `^PDT-[0-9]{4}$` reports PDT-0008 free while the sole record of that
      # product holds it -- and by nothing whose digits run wider, or the five-digit
      # "(deleted)" family lands on four-digit slots that are genuinely free. Asserted
      # against the literal production strings, because both defects are defects of
      # character and a paraphrased fixture rounds exactly those off.
      - name: Item naming schema (the block-occupancy boundary, on the real strings)
        run: python -m unittest erpnext_enhancements.tests.test_item_naming_rules -v
      # Its own step for the same reason as the one above: this suite imports no frappe at
      # all -- party_naming_rules takes only `re` and `typing` -- and appending it to a step
      # that installs sys.modules stubs would put it under a stub set it does not want.
      #
      # It guards the two properties the obvious implementation gets wrong. First, matching
      # the party is NOT equality: of 164 Projects using the separator, 55 lead with the
      # customer name verbatim and 42 with a shortening of it, so an equality rule would flag
      # 42 records that are right and the people maintaining them would stop reading. Second,
      # out of scope is silence rather than a pass -- 101 of 644 Projects are internal and
      # excluded by their own project_type, which is what keeps leftover stage templates and
      # the software backlog out without anybody maintaining a list.
      - name: Party naming (a shortening of the party passes; internal records are silent)
        run: python -m unittest erpnext_enhancements.tests.test_party_naming_rules -v
      # KPI Snapshot's DocPerms had to widen past System Manager for the KPI
      # assistant tool to be visible to the managers who own the numbers, and a
      # DocPerm is doctype-wide -- so the widening only stays safe while the row
      # filter ships with it. This pins both halves together, and pins that
      # "HR User" is never granted: it is one keystroke from the correct role and
      # every employee on this site holds it.
      - name: KPI Snapshot permissions (widened reads stay department-scoped)
        run: python -m unittest erpnext_enhancements.tests.test_kpi_snapshot_permissions -v
      # Three UOM patches whose ORDER is load-bearing: the Gallon rename has to
      # land before the disable pass, or that pass sees `Gallon` unused and
      # switches off a UOM three live documents point at. Also pins that the
      # rename is an EXACT match -- `Pound/Gallon (UK)` and friends are densities,
      # and a substring rename would merge two different units in a system that
      # prices by them.
      - name: UOM cleanup (rename, disable, default)
        run: python -m unittest erpnext_enhancements.tests.test_uom_cleanup -v
      # Notification recipients. Two things that are easy to get wrong and
      # invisible when they are: `company@` is the WHOLE-COMPANY mailing list, so
      # a routine alert there mails everyone; and the document-field recipients
      # (New ToDo -> allocated_to, Remind Me -> user) are personal BY DESIGN, so
      # "point everything at groups" applied literally breaks the one case where a
      # named individual is the entire purpose. Also pins that every Notification
      # fixture carries an explicit `enabled: 1` -- without it they import
      # disabled and re-disable on every migrate.
      - name: Notification recipients (group addresses, and the exceptions)
        run: python -m unittest erpnext_enhancements.tests.test_notification_recipients -v
      # A fixture is the WHOLE document. `sync_fixtures` deletes each record and
      # re-inserts it from the JSON, and `frappe.get_doc(dict).insert()` applies no
      # DocField defaults -- so a field the JSON omits comes back NULL rather than at
      # its default, on every migrate, with nothing in any diff to show it. That is
      # how all nineteen Notification conditions went dead at once in v1.331.0
      # (`condition_type` NULL => frappe skips the condition and sends
      # unconditionally). Pins the fields where NULL is observably different.
      - name: Fixture completeness (fields migrate would silently erase)
        run: python -m unittest erpnext_enhancements.tests.test_fixture_completeness -v
      # The activity feed and its stylesheet are two halves of one behaviour, and
      # they fail silently apart: a class nothing styles, or a rule nothing sets.
      # Also pins that the first tab is found POSITIONALLY -- several of our
      # doctypes have renamed Details to Overview or Summary, so a title check
      # would quietly stop matching and the feed would follow you around again.
      - name: Activity feed on the first tab only (JS + CSS agree)
        run: python -m unittest erpnext_enhancements.tests.test_activity_first_tab_only -v
      # The glass theme blurs `.page-head` and `.btn`, and `backdrop-filter` makes a
      # STACKING CONTEXT of whatever carries it -- so both menus frappe opens INSIDE
      # those elements (the page "..." menu, the list sort menu) were sealed into a
      # context the page body then painted over. Every rule that undoes it is an
      # override of an earlier rule in the same stylesheet, three of them
      # `!important`, and an override that loses the cascade fails SILENTLY: the
      # menu is simply behind the page again. So this resolves the cascade rather
      # than grepping for the strings, the way the activity-feed suite above does --
      # that one shipped inert for six weeks with a green test written the naive way.
      # It also pins the deleted band-aid absent: `position: relative` plus a z-index
      # on `.sort-selector` is what trapped the sort menu in the first place.
      - name: Desk menus are not trapped in a stacking context (cascade resolved)
        run: python -m unittest erpnext_enhancements.tests.test_dropdown_stacking -v
      # The payment step's follow-up button and its two whitelisted endpoints.
      # The suites that exercise the real behaviour need a bench and so never
      # run here -- which is why the seam is pinned statically: a renamed
      # endpoint or a dropped STEP_ACTIONS entry raises nowhere, the button
      # just stops working in production. Also pins the step rename, which
      # lives in three places at once (seed patch, migration, prose).
      - name: Initial-payment follow-up wiring + step rename
        run: python -m unittest erpnext_enhancements.tests.test_payment_followup_wire -v
      - name: DocType module placement
        run: python -m unittest erpnext_enhancements.tests.test_doctype_modules -v
      # Whether the nightly offsite backup ships the file archives is one membership
      # test -- `include_files = backup_type in FULL_TYPES`. Drop the scheduled type out
      # of that tuple and the run silently reverts to database-only: it still succeeds,
      # still writes a green Offsite Backup Log row, and still satisfies the watchdog,
      # because the tier the watchdog queries is the same type that just stopped
      # including files. Nothing fails until a restore comes back with every row and
      # none of the attachments. AST + JSON only, no frappe stub, so it sits on this
      # pure-filesystem step.
      - name: Offsite backup schedule (every automatic run ships the files)
        run: python -m unittest erpnext_enhancements.tests.test_offsite_backup_schedule -v
      # How the Visit Wizard renders authored text. Filesystem-only, no stub. Both
      # guarded mistakes shipped and neither shows up in a diff: passing Text Editor
      # HTML through frappe.utils.xss_sanitise (which escapes by default) renders
      # markup as literal <ul><li><b> in the technician's guidance panel, and writing
      # a regex character class with raw control bytes instead of unicode escape sequences makes
      # git treat the whole file as binary.
      - name: Visit Wizard renders instructions as markup, not tags
        run: python -m unittest erpnext_enhancements.tests.test_visit_wizard_markup -v
      # Desk home-grid tile artwork. Filesystem + xml only -- no stub, so it sits on a
      # plain step beside the other pure-filesystem suite. Guards a failure mode that is
      # entirely silent: setup/desktop_icon_map.py names an SVG per tile and the
      # after_migrate reconciler writes that path into Desktop Icon.logo_url, so a
      # renamed label or a tile added without regenerating produces a 404 on an <img>
      # and an empty square on the desk -- no exception, nothing in any log.
      - name: Desk tile artwork matches the tile map
        run: python -m unittest erpnext_enhancements.tests.test_desktop_icons -v
      # The Enhancement Request lifecycle, and the boundary the feedback feature exists to
      # hold. `test_feedback_states` pins the state enum against the DocType's own Select
      # options (renaming one needs a data patch or existing rows refuse to save) and
      # enumerates the whole transition cross-product, so `Submitted -> Tasks Created` cannot
      # become reachable by accident — that pair IS the human approval gate.
      #
      # `test_feedback_endpoint_surface` asserts POST-only on every endpoint, that every name
      # the SPA dials resolves, and — the one worth the most — that only
      # product_feedback/task_writer.py constructs a Task. A model proposes, a human confirms,
      # one module writes; that is easy to restate in a docstring and easy to undo in a hurry.
      # Verified by reintroducing the bug: adding a Task literal to breakdown.py fails it.
      - name: Enhancement Request states + feedback endpoint surface
        run: >-
          python -m unittest
          erpnext_enhancements.tests.test_feedback_states
          erpnext_enhancements.tests.test_feedback_endpoint_surface -v
      # Filesystem + ast only, its own step like every other bench-free suite that
      # installs no stub set. Guards the marketing data model's three silent-failure
      # promises: POSITIVE_DIALS agreeing with the JSON defaults it heals to, the
      # identity fields the record names are built from staying set_only_once (the
      # restate-as-upsert guarantee), and no credential-shaped field appearing on a
      # doctype Sales Manager can read.
      # test_marketing_publishing (TASK-2026-01479, v1.507.0) shares the step: also stub-free.
      # It pins the P2 publishing gate (master switch AND the network's own switch; the ad
      # switches publish nothing), that every publishing switch ships off and only System
      # Manager can flip one, and decision 3 once writes exist: no spend-capable OAuth scope
      # (pages_manage_ads would boost a post into paid spend) anywhere in marketing/.
      # test_marketing_outbox (TASK-2026-01481, v1.509.0), also stub-free: the publishing
      # outbox's state machine against an in-memory store. A job that may have sent never
      # returns to Pending by itself (lease expiry / 5xx / timeout -> Unconfirmed), a
      # scheduled post waits on available_at rather than a queued RQ job, switches stop even
      # approved posts, approval needs a second person and media cleared for social, and a
      # duplicate platform post ID is success. Plus AST checks on the sweeper's wiring.
      # test_marketing_meta_publisher (TASK-2026-01483, v1.511.0), stub-free too: the Facebook
      # and Instagram publisher against a scripted Graph API. Nothing public happens in
      # prepare(); a timed-out media_publish is settled by asking the container (PUBLISHED =
      # success, FINISHED = NotPublished, else ambiguous), never by re-sending; nothing after the
      # public step raises; and Meta's own limits are checked before approval.
      # test_marketing_linkedin_publisher (TASK-2026-01484, v1.512.0): uploads registered, PUT and
      # read back AVAILABLE before anything public; the token cannot reach a non-LinkedIn host; a
      # timed-out post is looked for among the Page's latest, never re-sent, and not-found stays
      # ambiguous; little-text escaping keeps hashtags; LinkedIn's limits checked before approval.
      # test_marketing_youtube_publisher (TASK-2026-01485, v1.513.0): prepare opens the resumable
      # session and uploads nothing; a failed chunk is settled by asking the session (308 resumes
      # from YouTube's Range, 201 is the video, unanswerable stays ambiguous, endless incomplete is
      # NotPublished); a spent quota waits as a 429; thumbnail and playlist are warnings only.
      # test_marketing_approval (TASK-2026-01486, v1.514.0), stub-free (the rules live in the
      # frappe-free publish/workflow.py): a Marketing Manager approves, never the author or last
      # editor, and only from a signed-in browser -- a token, job or console request is refused
      # whatever roles it holds (Triton holds Marketing Manager); a post edited after it was
      # opened is refused; a save cannot type "Approved"; Marketing Team is granted on five
      # Marketing doctypes and nowhere else; every action is POST-only and checks edit permission
      # first. test_marketing_outbox covers the other half: the attempt log and cancel.
      # test_marketing_spa (TASK-2026-01487, v1.515.0), stub-free (rules in publish/spa_rules.py):
      # the /marketing app's server side. Only the three marketing roles get in; the composer
      # writes an allowlist of fields (never status, approver or owner); times are site-local and
      # a new one must be in the future; every endpoint is POST-only and checks access first; the
      # client's M map and the whitelisted functions are the same set; one route rule serves the
      # subtree and the shell bakes in no post data. The client half runs in node, below.
      # test_marketing_metrics (TASK-2026-01488, v1.516.0), stub-free: links to our own site go
      # out tagged (utm_source=<network>, utm_medium=social, utm_content=<post>; never utm_id,
      # which the ad-spend report reads as paid), the same in Python and the composer's JS
      # (tracking_vectors.json, also run by scripts/test_marketing_client.js), and the checks
      # count the tagged link. The engagement pull-back: a row is a lifetime total as of its
      # date, YouTube's trailing days restated, the cursor moves only on a clean pull, a 401
      # stops that network only; parsers on recorded shapes with 2026's metric names; every read
      # a GET on the allowlist; posts joined to leads and revenue on their tags.
      - name: Marketing settings dials + ad-model identity + publishing gate + outbox + approval + app + metrics + publishers
        run: python -m unittest erpnext_enhancements.tests.test_marketing_settings erpnext_enhancements.tests.test_marketing_publishing erpnext_enhancements.tests.test_marketing_outbox erpnext_enhancements.tests.test_marketing_approval erpnext_enhancements.tests.test_marketing_spa erpnext_enhancements.tests.test_marketing_metrics erpnext_enhancements.tests.test_marketing_meta_publisher erpnext_enhancements.tests.test_marketing_linkedin_publisher erpnext_enhancements.tests.test_marketing_youtube_publisher -v
      # Publishing rate limits (TASK-2026-01482, v1.510.0). Each rule is a pure Python function
      # (the spec) mirrored by a Redis Lua script; this runs THE REAL LUA (fakeredis + lupa)
      # against the spec over randomized sequences, so the two cannot drift. Also: YouTube's
      # Pacific quota day checked against the tz database, Meta usage headers, Retry-After, and
      # admit() for each network. Own step: it needs fakeredis + lupa, pinned. The suite FAILS
      # rather than skips its Lua half when CI is set and they are missing (GitHub sets CI=true).
      - name: Publishing rate limits, Python spec vs Redis Lua (bench-free)
        run: |
          python -m pip install fakeredis==2.38.0 lupa==2.8
          python -m unittest erpnext_enhancements.tests.test_marketing_ratelimit -v
      # The read-only ad-spend connectors (TASK-2026-01476, v1.503.0), built against
      # recorded-shape fixtures because API access is still pending. Pins, in order: nothing
      # outside the read-only allowlist is ever sent (and no mutate-shaped string exists in
      # marketing/), no token reaches an error / log / archived URL, retries only on
      # 408/429/5xx, restate + upsert + cursor-only-on-clean-run end to end, each platform's
      # parser quirks, and an OAuth state bound to the user who clicked Connect.
      # Since v1.508.0 (TASK-2026-01480) it also covers the publishing connections:
      #   - the publish transport's own allowlist, with each transport refusing the other's paths;
      #   - writes never retried on their own, and one retry after a 401;
      #   - Meta's Connect keeping only the Page token and refusing a spend-capable grant;
      #   - LinkedIn's non-rolling refresh, and YouTube's refresh-every-use;
      #   - daily upkeep clearing a dead credential but not a merely-down one.
      # Two shared fixes: Meta's dead-token 400/190 reads as an auth failure, and a token-server
      # outage no longer does.
      # Own step: installs a frappe stub (frappe, frappe.utils, frappe.model) and removes it.
      - name: Ad-spend + publishing connectors (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_marketing_connectors -v
      # The spend -> Lead -> Opportunity -> Project -> invoice join (TASK-2026-01477, v1.504.0).
      # Pins the 2026-09-22 decisions: utm_id then gclid, a paid lead nothing matches is its own
      # row (never a free lead), cohorts by the month the ad touched the customer, a 365-day
      # window so repeat business does not count against the original ad, two revenue columns,
      # and no ratio over zero. roas.py is stdlib-only, so no stub.
      - name: Ad Spend ROAS join (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_ad_spend_roas -v
      # Search Console property forms + snapshot backfill (TASK-2026-01474, v1.505.0). Prod
      # stores a bare domain, which names no property and draws the same 403 as a missing
      # grant; pins sc-domain: first, then the URL prefixes, the working form cached, a
      # non-refusal still raising, and a backfill that reuses the live 30-day window, touches
      # only gsc_ok = 0 nights and is not whitelisted. Own step: stubs frappe AND the Google
      # client libraries (CI installs neither) and removes them.
      - name: Search Console property + backfill (bench-free)
        run: python -m unittest erpnext_enhancements.tests.test_search_console -v
      # The placement test above says a DocType is in the right folder. This one says the
      # folder gets INSTALLED. Adding a module to modules.txt is not sufficient on an
      # already-installed site: frappe.model.sync.sync_for() iterates
      # frappe.local.app_modules, a snapshot taken once at frappe.init() from redis that no
      # part of `bench migrate` rebuilds. A migrate that starts with a stale snapshot walks
      # the PREVIOUS release's module list, skips the whole new module folder, creates no
      # table, logs nothing and exits 0 -- and the post_model_sync patches that touch those
      # tables burn their Patch Log entries against a schema that is not there, which in
      # Frappe means they can never run again. v1.261.0 shipped the Chat module exactly
      # that way on 2026-08-09. Unittest (TestCase-based), so it belongs on this step list
      # and NOT on a pytest step.
      - name: Module installability (modules.txt alone does not install a module)
        run: python -m unittest erpnext_enhancements.tests.test_module_installability -v
      # Same failure shape as the www/ controller check: Frappe computes a script
      # report's import path from scrub(report_name) rather than reading the
      # directory, so a plausibly-misnamed folder migrates cleanly, lists in the
      # desk, and only 500s when somebody opens the report. Two "Hand-Off ..."
      # reports shipped that way -- scrub() turns the hyphen into its own
      # underscore (hand_off_), the hand-written folder said handoff_.
      - name: Report module placement (folder == scrub(report_name))
        run: python -m unittest erpnext_enhancements.tests.test_report_modules -v
      # hooks.py is one big dict literal, and Python resolves a repeated key by keeping
      # the LAST and silently discarding the earlier value -- no error, no warning, the
      # hooks just never fire. Two duplicated doc_events keys cost six live handlers
      # (recurring task generation, project date sync, next-visit dates) and nobody
      # noticed, because the symptom is absence. ruff flags it as F601 but that job is
      # advisory here, so it does not fail a PR. This does.
      - name: hooks.py integrity (no duplicate keys or handlers)
        run: python -m unittest erpnext_enhancements.tests.test_hooks_integrity -v
      # A literal '%' in a query string that also binds a named parameter. MySQLdb
      # mogrifies with Python's own % operator, so the percent is a conversion
      # specifier: the query either dies with "not enough arguments for format
      # string" before it reaches MariaDB, or -- worse -- silently interpolates the
      # argument dict into the SQL. v1.342.4 put "shown 0%." in a /* comment */
      # inside get_procurement_status's union query and took the whole project
      # procurement panel down. It is valid SQL and a valid SQL comment; only Python
      # objects, and only at runtime.
      - name: SQL percent escaping (parameterised queries)
        run: python -m unittest erpnext_enhancements.tests.test_sql_percent_escaping -v
      # `tabSingles` has exactly three columns -- doctype, field, value -- while
      # db.get_value and friends default to ORDER BY creation. So a get_value aimed
      # at "Singles" is not a read that can fail, it is one that CANNOT SUCCEED, on
      # every site every time. v1.395.0 shipped one in a patch; a raising patch aborts
      # `bench migrate`, which on this repo is the deploy, so it half-installed prod.
      - name: Singles table is not queried through the ORM
        run: python -m unittest erpnext_enhancements.tests.test_singles_table_access -v
      # A cost code that points at the wrong MasterFormat section does not raise -- it
      # prints on a Schedule of Values and an AIA G702/G703 that a general contractor
      # reads, and comes back as a rejected submittal weeks later. The catalog this
      # replaced was the retired 1995 16-division list mechanically reformatted, so
      # `22 3100` (Pumps) was Domestic Water Softeners and `22 5100` (Nozzles) was
      # Swimming Pool Plumbing Systems. The gate is the published-section LIST, not a
      # regex: `01 5433` has a legal Level-4 shape inside a real family whose children
      # stop at 01 54 26, so a pattern check passes it. Two numbers also became live
      # collisions AFTER adoption (02 03 00 and 09 03 00 exist in MF2016, not MF2011).
      - name: Cost codes name real MasterFormat sections (list check, not a regex)
        run: python -m unittest erpnext_enhancements.tests.test_cost_codes -v
      # The audit roster answers a DATE, not today. Every derived-status write in the
      # HR and Training modules goes through db_set(update_modified=False), which never
      # reaches save_version() -- so a stored status is a fact about TODAY and
      # track_changes=1 recorded nothing about how it got there. A sheet handed to an
      # insurer that silently restates today over a past date is worse than no sheet.
      - name: HR audit roster (dates not statuses; leavers included)
        run: python -m unittest erpnext_enhancements.tests.test_hr_qualification_roster -v
      # The four employee feedback requests shipped in v1.455.0. Each assertion pins a
      # decision where the OBVIOUS edit is the wrong one and produces no error: a
      # `default` on the new PO item status would stamp ~700 historical rows during the
      # ALTER; a Custom Field named expected_delivery_date collides with the native v16
      # one; Asset.asset_type defaulting to anything but "Existing Asset" makes the form
      # unsaveable again via validate_gross_and_purchase_amount; an unguarded
      # ItemQuickEntryForm subclass leaks fixed-asset defaults into every Item created
      # later in the session; and moving the inspection completeness gates from
      # before_submit to validate makes a half-walked checklist unsaveable.
      # test_po_received_qty_column (ER-2026-458194) rides the same step: a grid column's
      # position is the doctype's field order, so `in_list_view` alone puts received_qty
      # off the right edge; `depends_on` is evaluated per row, so it must be cleared or
      # unreceived lines show a blank; and the columns before Rate must still sum to 12.
      - name: Feedback ER batch invariants (PO fields, Asset form, rental inspections)
        run: python -m unittest erpnext_enhancements.tests.test_feedback_er_batch erpnext_enhancements.tests.test_po_received_qty_column -v
      # The maintenance sweeps had NO automated coverage of any kind before this:
      # test_sapphire_maintenance and test_maintenance_sections both build real
      # documents, so neither runs without a bench and neither is named in this file.
      # Meanwhile `{"end_date": ["<", today]}` on a NULLABLE column force-expired
      # fifteen of the site's sixteen contracts -- and `status = "Active"` gates both
      # visit scheduling and recurring billing, so they stopped producing either.
      # This suite is bench-free, installs its own frappe stub, and RUNS the sweeps.
      - name: Maintenance expiry/billing filters (nullable columns)
        run: python -m unittest erpnext_enhancements.tests.test_maintenance_expiry_filters -v
      # `exp_end_date` is a nullable Datetime, so `("<", today)` matched every open task
      # with NO deadline -- and because both callers order by `exp_end_date asc` and take
      # a page, and MariaDB sorts NULLs FIRST, the coalesced rows filled the whole budget
      # and pushed the genuinely overdue ones off the end. Prod had 330 deadline-less
      # tasks against 1,066 real ones, and all 21 rows the query returned were the
      # former. test_briefing and test_wall_dashboard both need a bench, so neither runs
      # here -- which is why this had no coverage at all.
      - name: Task overdue/today filters (nullable columns)
        run: python -m unittest erpnext_enhancements.tests.test_task_overdue_filters -v
      # `TrainingAssignment._default_due_date` leaves the date BLANK on an optional
      # library course, and says why: "putting one on an optional library course would
      # make it overdue and start chasing people over something nobody asked them to
      # do." Three sweeps did precisely that through the ifnull sentinel -- marked them
      # Overdue, emailed a nudge, and counted them as non-compliance -- while the
      # controller's own `_derive_overdue` guarded the same rule correctly in Python.
      # The two halves disagreed on the same row because only one went through SQL.
      - name: Training assignment due-date filters (nullable columns)
        run: python -m unittest erpnext_enhancements.tests.test_training_due_date_filters -v
      # ONE guard for the whole class, and the durable outcome of the 2026-09-13 audit.
      # Frappe wraps a comparison on a nullable column in ifnull(col, <minimum of the
      # type>), so `<` and `<=` MATCH every NULL row while `>`/`>=`/`between`/`is set`
      # do not. Twelve instances existed across the app that day; five were live, and
      # the worst force-expired 15 of 16 maintenance contracts, stopping both visit
      # scheduling and invoicing. It fails by doing MORE than asked, so every one of
      # them looked like it was working. The named field list in that file is the
      # memory -- add to it the moment another nullable date turns up.
      - name: Nullable date comparisons carry an `is set` clause
        run: python -m unittest erpnext_enhancements.tests.test_nullable_date_filters -v
      # `@frappe.whitelist()` decorates whatever def comes next, and blank lines between
      # them are legal. On 2026-09-13 a refactor inserted two helpers BETWEEN an existing
      # decorator and the endpoint it was written for: the file parsed, imported and
      # deployed, `get_task_dashboard_data` silently stopped being whitelisted (the Task
      # Dashboard failed for every user) and a filter builder became a public endpoint.
      # Nothing caught it because the module still imports and the helpers still test
      # green -- an endpoint only fails when a browser calls it.
      - name: Whitelist decorators sit on endpoints, not helpers
        run: python -m unittest erpnext_enhancements.tests.test_whitelist_placement -v
      # `frappe.db.get_value` returns None, not a row of Nones, so `a, b = get_value(...)`
      # raises TypeError on a missing row. A sweep on 2026-09-13 found nine; seven are
      # fine and are allowlisted with the reason. The two that were not sat where the
      # exception is expensive -- a scheduler job that dies takes every later step with
      # it, and a whitelist endpoint that dies loses a completed call's record.
      - name: No unguarded tuple-unpack of frappe.db.get_value
        run: python -m unittest erpnext_enhancements.tests.test_get_value_unpacking -v
      # The won-opportunity nag has over-reported twice: 228 (the ifnull sentinel on a
      # nullable won-date) and then 31, because it asked about ONE of the three fields
      # that link an Opportunity to a Project. The honest figure is 11. Bench-free and
      # own step, because `test_status_alerts.py` subclasses FrappeTestCase and so runs
      # nowhere in CI.
      - name: The unconverted-wins nag counts and links the same set
        run: python -m unittest erpnext_enhancements.tests.test_unconverted_nag -v
      # RUNS the roster's print guard rather than reading it, and that distinction is
      # the whole reason this step exists. The previous defect on this report was a
      # print template that had never once been rendered: a double brace inside an HTML
      # comment became a live expression (frappe.template.compile rewrites those across
      # the entire file before parsing), the name it read is not in the render context,
      # and under `with(obj)` that is a ReferenceError -- so Print and Download PDF
      # produced NOTHING from v1.397.0 to v1.424.0 while every static check stayed
      # green. The guard added in v1.425.0 monkey-patches core's print_report/pdf_report
      # on the report instance, and whether core's menu actually reaches the wrapper is
      # not something reading the file can tell you.
      - name: Roster print guard (executed, not grepped)
        run: node scripts/test_roster_print_guard.mjs
      # The training player's URL is read BACK as the source of truth -- `start()` on
      # every page load and the popstate handler both do queryParam("course") -- so a
      # stale `?course=` is not cosmetic: refreshing the catalogue silently reopened the
      # last course. `route()` emitted `course=` from state while `go("catalog")` never
      # cleared it; `lesson=` was guarded by view and `course=` was not. Extracts the
      # real route() and calls it once per view, because a table of view names passes a
      # static check just as happily with the wrong members in it.
      - name: Training player routing (executed, not grepped)
        run: node scripts/test_training_route.mjs
      # Checkpoint completeness moved from validate to publish. BOTH halves are
      # asserted in that one suite on purpose: shipping the relaxation without the
      # publish gate lets a checkpoint with no correct option reach _split_lesson,
      # which writes an answer key of "correct": [] -- a checkpoint nobody can pass,
      # holding the lesson open forever with nothing raising anywhere.
      - name: Checkpoint model (relaxed at save, refused at publish)
        run: python -m unittest erpnext_enhancements.tests.test_training_checkpoint_model -v
      # Guards the silent workspace failure mode: `content` (the layout) and the
      # child tables (the data) are joined by label and nothing keeps them in sync,
      # so a block with no row renders an empty div and a row with no block never
      # appears. v1.146.0 shipped exactly that across seven widgets.
      # A one-letter class-name mismatch gets a DocType FORCE-DELETED on every migrate, with
      # nothing in the Error Log and the table left behind. Frappe resolves a controller as
      # doctype.replace(" ","").replace("-","") -- it strips spaces and does NOT title-case, so
      # "Project Scope of Work" wants `ProjectScopeofWork`, lower-case o. get_controller raises
      # ImportError when the class is absent and remove_orphan_doctypes() force-deletes anything
      # that raises. Cost this repo two consecutive deploys (v1.452.1, v1.452.2).
      - name: DocType controller class names (Frappe strips spaces, it does not title-case)
        run: python -m unittest erpnext_enhancements.tests.test_doctype_controller_names -v
      # Same shape one layer up, in JS. make_quick_entry's 4th argument REPLACES the doc
      # frappe would have built, so an object literal without a `doctype` key goes to
      # frappe.client.save as-is and raises `"doctype" is a required key` before the
      # controller is reached. The Task form's "Create Child Task" button shipped that way
      # and 500'd on every press while the dialog looked entirely normal. Source-only, no
      # stub set, so its own step.
      - name: Quick Entry docs carry their own doctype (make_quick_entry replaces, not merges)
        run: python -m unittest erpnext_enhancements.tests.test_quick_entry_doctype_key -v
      - name: Workspace structure (content <-> child rows, WI-018)
        run: python -m unittest erpnext_enhancements.tests.test_workspaces -v
      # The Quality module (WI-075) sits beside erpnext's own Quality Management, which owns
      # a workspace named `Quality`, the Desk tile that goes with it, and 22 DocTypes. Every
      # way of colliding with those is silent: workspaces are TIMESTAMP-gated (not hash-gated
      # like DocTypes), so a file at core's docname does not conflict -- it rewrites core's
      # row, `module` included, on whichever migrate has the newer stamp. Tiles are keyed by
      # workspace LABEL and inherit that workspace's roles. And a Page sharing a workspace
      # slug never renders, per-user, so it reads as a permissions bug. Nothing logs any of it.
      - name: Quality module name collisions (workspace, tile, DocType, page slug)
        run: python -m unittest erpnext_enhancements.tests.test_quality_naming_collisions -v
      # Acceptance-criterion identity (WI-075 sub-phase B1). Every downstream record in the
      # quality chain -- template row, inspection result, NCR, Quality Action -- joins on
      # `criterion_key`, so the property that matters is that a key, once minted, NEVER
      # changes. Re-minting on every save looks completely normal in a diff and in a smoke
      # test, and only shows itself when somebody inserts a criterion mid-list a year later
      # and a closed NCR silently repoints at a different standard.
      - name: Scope acceptance criteria (stable keys, inspectable rows)
        run: python -m unittest erpnext_enhancements.tests.test_scope_criteria -v
      # The inspection milestone catalog (WI-075 sub-phase C). Build and Products milestones
      # fire on values of the EXISTING Project.custom_build_status Select. Rename one of those
      # options and the trigger stops matching -- silently, because a trigger that matches
      # nothing is indistinguishable from a milestone that has not come round yet. Pins every
      # trigger value against the live options in the fixture that owns them.
      - name: Inspection milestones (triggers match the live build statuses)
        run: python -m unittest erpnext_enhancements.tests.test_inspection_milestones -v
      # THE freeze (WI-075 sub-phase D). An inspection that already happened must not change
      # because the template it came from changed the following week. An implementation that
      # re-reads the master at render looks completely normal -- the form populates, the checks
      # are right -- until somebody tightens a tolerance and last year's passes quietly become
      # failures, or its failures quietly become passes, with nothing in any log. Asserted by
      # mutating the source after generation and demanding the rows and their hash are untouched.
      - name: Inspection merge and freeze (a template edit cannot reach a generated inspection)
        run: python -m unittest erpnext_enhancements.tests.test_inspection_merge -v
      # The NCR / Quality Action state machines (WI-075 sub-phase E). Two total-but-invisible
      # failures. A status vocabulary lives in a Property Setter's options string AND in the
      # Python that writes a status, with nothing keeping them in sync -- and a value outside a
      # Select's options makes the row permanently unsaveable by anybody. Separately, ERPNext's
      # QualityAction.validate is one line writing "Completed" whenever resolutions is empty,
      # which is exactly what a punch-list item is: under core every punch item is born closed,
      # and once the Property Setter lands that literal is not an option so EVERY save raises.
      # The override and the Property Setter are one indivisible change; this asserts both.
      - name: Quality lifecycle (Select options match the code; the Action override is wired)
        run: python -m unittest erpnext_enhancements.tests.test_quality_lifecycle -v
      # Carry-forward and re-verification (WI-075 sub-phase F) -- the mechanism that stops
      # "we fixed it" being taken on faith. Every failure mode here is quiet: a fix that
      # closes without being looked at turns the two-step closure into one step wearing a
      # longer name; an escalation that ratchets twice on a cancelled-and-resubmitted
      # inspection moves the one field nobody audits; and two inspections carrying the same
      # item both answer it, with the second submitted silently overwriting the first verdict.
      - name: Carry-forward (a fix closes only when somebody looked at it again)
        run: python -m unittest erpnext_enhancements.tests.test_carry_forward -v
      # Critical NCR alerting (WI-075 sub-phase G). Three failures that look like success from
      # outside: an alert nobody received (a prod deploy FLUSHDBs the queue redis and destroys
      # every pending job, so the acknowledgement row survives while the email never went);
      # one person holding two of the three notified roles getting two emails and a
      # half-finished acknowledgement, which on a nineteen-user site is the expected case and
      # not an edge one; and a sweep that re-sends hourly until people filter the one message
      # that must not be filtered.
      - name: Critical NCR alerting (who is paged, and when they are chased again)
        run: python -m unittest erpnext_enhancements.tests.test_quality_alerting -v
      # The advisory inspector-qualification check (WI-075 sub-phase H). It never blocks a save,
      # which is exactly why it needs tests -- nothing downstream ever fails because it got the
      # answer wrong, so a warning wrong in the QUIET direction is indistinguishable from one
      # that is right. The load-bearing case: Position carries an integer tier, so the obvious
      # implementation compares tiers, and a bare `tier >= tier` passes a tier-3 Designer as a
      # qualified tier-2 Technician. It PASSES, so nobody investigates it.
      - name: Inspector qualification (a tier means nothing across job families)
        run: python -m unittest erpnext_enhancements.tests.test_inspector_qualification -v
      # The field inspection wizard (WI-075 sub-phase H). Guards the freeze's last line of
      # defence -- the server's row allowlist -- because a wizard that could write `min_value`
      # could turn a failing measurement into a passing one from a phone, on site, with nothing
      # in the diff. Plus the Visit Wizard's own scars: escaped Text Editor markup renders as
      # visible tags while the panel still LOOKS populated, and a silent failed autosave loses a
      # whole inspection on a bad signal, discovered after the inspector has left the site.
      - name: Inspection wizard (frozen rows stay frozen; a failed save is never silent)
        run: python -m unittest erpnext_enhancements.tests.test_inspection_wizard -v
      # When an inspection is due (WI-075 sub-phase I). Sub-phase C seeded seventeen milestones
      # carrying a trigger_basis and nothing read it; this is the engine that does. Two silent
      # failures are guarded. `custom_build_status` is a Select somebody types into, not a
      # workflow, so a project can jump Procurement -> Ready for Install in one save: an
      # equality trigger was never true at any moment a sweep looked, the commissioning check
      # never comes up, and afterwards it is indistinguishable from a project that has not got
      # there yet. And a renamed or blank status cannot be placed on the scale at all -- calling
      # that "not due" would make every sweep report clean forever, on every project.
      - name: Inspection due (a skipped stage does not skip its inspection)
        run: python -m unittest erpnext_enhancements.tests.test_inspection_due -v
      # The strawman checklists. Two properties make seeding a draft checklist safe at all, and
      # both are asserted here. Every template is created DRAFT -- a Draft template generates
      # nothing, so a milestone keeps reporting due-and-blocked until a person reads it and sets
      # it Active, which is what adoption means. And every check carries a pass standard and a
      # verification method: the programme's own principle is that a criterion which cannot be
      # inspected should not be in the contract, and a checklist row with no standard is the
      # same failure on the other side of the wall. Also pins the four chemistry ranges, which
      # are the one set of numbers taken verbatim from a live Sapphire record.
      - name: Draft checklists (seeded Draft, never Active; every check has a standard)
        run: python -m unittest erpnext_enhancements.tests.test_draft_templates -v
      # Goals and period reviews (WI-075 sub-phase J). Every failure guarded here reports GOOD
      # news, which is why it is a test and not a comment. An empty period divides by zero and
      # rounds up to a perfect score, so a quarter in which nobody inspected anything would
      # report 100% first-pass yield. Half the metrics are better when smaller and core's
      # objective row carries no direction, so the obvious comparison marks "NCRs raised: target
      # 2" as failed every time the company does well. `target` is a Data field, so an
      # unreadable one treated as zero marks a goal Passed forever. And ERPNext's own daily
      # scheduler owns Daily/Weekly/Monthly/Quarterly -- generating those here too would put a
      # second review beside every one it made, so review_due RAISES if asked about them.
      - name: Quality goals (an empty period decides nothing, and fewer can be better)
        run: python -m unittest erpnext_enhancements.tests.test_quality_goals -v
      # Change orders (WI-075 sub-phase K). A commercial instrument, so every failure guarded
      # here is a wrong number somebody argues about months later rather than a crash somebody
      # fixes the same afternoon. A credit stored as a positive magnitude beside an
      # Addition/Credit Select is totalled as an addition the first time the two disagree; a
      # naming series makes the third change order on one job CO-047; a stored status beside
      # docstatus is two states for one document, free to disagree; and frappe's amend appends
      # -1, producing a second commercial instrument with almost the same name as the first.
      - name: Change orders (a credit cannot be totalled as an addition)
        run: python -m unittest erpnext_enhancements.tests.test_change_orders -v
      # MSA expiry, rates and order attribution (WI-075 sub-phase L). `validate_msa_gate` asks
      # whether an agreement was ever SIGNED and never whether it is still IN FORCE, so one
      # signed in 2019 gates a Statement of Work issued today just as well. The load-bearing case
      # is that UNKNOWN is a third answer: none of the sixteen live contracts records an expiry,
      # so treating unknown as expired blocks every SOW the company can issue on deploy day,
      # and treating it as valid is the vacuous pass. Also pins the purchase-order union --
      # either project field alone drops orders silently (40 of 148 live pending lines carry no
      # row project, 32 of those under a header that names the job).
      - name: MSA rates (unknown expiry is neither valid nor expired)
        run: python -m unittest erpnext_enhancements.tests.test_msa_rates -v
      # Project budgets and reallocations (WI-075 sub-phase M). Every failure here is a wrong
      # number that looks right. Measured on prod 2026-09-14: tabTimesheet holds 0 rows and no
      # Purchase Invoice has submitted lines, so a naked `actual` column would read 0.00 on every
      # line of every project forever while looking correct -- the trailing-space failure in
      # another costume. Hence the coverage verdict beside every figure, saying whether the zero
      # is about the project or about the instrument. Also pins: a percentage of a zero budget is
      # None rather than 0% ("on budget") or a huge number; a reallocation is net zero, so it
      # cannot rewrite the project total that WI-058 will divide by; and the second approval a
      # protected category needs cannot come from the requester or the PM who already approved,
      # because a control one person satisfies by clicking twice is a control in appearance only.
      - name: Project budgets (a zero nobody recorded is not a zero that was spent)
        run: python -m unittest erpnext_enhancements.tests.test_project_budgets -v
      # Subcontractor scorecards (WI-075 sub-phase N). A vendor scorecard is the one artifact
      # in this programme that gets PRINTED AND CARRIED INTO A NEGOTIATION, so its failure mode
      # is not a crash -- it is a page asserting every subcontractor is flawless. Measured on
      # prod 2026-09-14 that is exactly what this would produce: every quality doctype holds 0
      # rows, no Project Contract is a subcontractor MSA (all sixteen are `maintenance` with
      # party_type Customer), and rework hours and certificates of insurance are recorded
      # nowhere at all. So: nothing judgeable must yield NO score (None, never 0 and never 100);
      # a ratio with an empty denominator is unanswerable; the score is a count of thresholds
      # met and never a weighted composite; a figure from an instrument nobody uses is not
      # evidence; an unknown agreement is a gap in OUR record, never scored against them; and a
