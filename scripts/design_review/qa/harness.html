<!doctype html>
<!--
  The Review Room shell (www/review.html) for the browser test, minus Jinja: the same root, the
  same boot object, the real bundle's CSS and JS (served unbundled as ES modules), and a fetch
  mock in place of /api/method. /site.css is the website stylesheets a real site loads first
  (run_room.js fetches them when SITE_CSS names them), so their resets are in play too. run_room.js serves this at /review and every path under it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design Review</title>
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/css/design_review.bundle.css">
</head>
<body>
<div id="ee-review-root" class="rr-root" role="application" aria-label="Design Review">
	<div class="rr-boot" role="status"><div class="rr-boot-text">Loading the review…</div></div>
</div>
<script>
window.EE_REVIEW_BOOT = { user: "pat@example.com", full_name: "Pat", moderator: true, csrf_token: "test", build: "qa" };
(function () {
	// An in-memory server with get_review's and get_content's shapes. Writes change `state`, so
	// what the page shows after a save is what it read back, as it is on a real site.
	var mock = null;
	var calls = (window.QA_CALLS = []);
	var load = fetch("/mock.json").then(function (r) { return r.json(); }).then(function (m) { mock = m; });
	var realFetch = window.fetch.bind(window);
	var seq = 0;
	function reply(message, status) {
		return new Response(JSON.stringify(status ? { exception: "frappe.exceptions.ValidationError: " + message } : { message: message }), {
			status: status || 200, headers: { "content-type": "application/json" },
		});
	}
	function tally(track) {
		var codes = mock.content.options.filter(function (o) { return o.track === track; }).map(function (o) { return o.code; });
		var points = {}; codes.forEach(function (c) { points[c] = 0; });
		var v = mock.state.my_votes[track];
		if (v) v.ranking.forEach(function (c, i) { points[c] += codes.length - i; });
		var first = {}; if (v) first[v.ranking[0]] = ["Pat"];
		return { live: { points: points, first: {}, voters: v ? 1 : 0 }, imported: { points: {}, first: {}, voters: 0 }, live_first: first, imported_first: {} };
	}
	var handlers = {
		list_reviews: function () { return { reviews: [{ name: "DR-2026-001", title: mock.state.title, status: mock.state.status, description: mock.state.description, participant: true }], me: mock.state.me }; },
		get_review: function () {
			mock.content.tracks.forEach(function (t) { mock.state.tallies[t.id] = tally(t.id); });
			return JSON.parse(JSON.stringify(mock.state));
		},
		get_content: function () { return mock.content; },
		find_people: function (a) { return [{ name: "HR-EMP-0001", employee_name: "Ana Lopez" }].filter(function (p) { return p.employee_name.toLowerCase().indexOf(a.text.toLowerCase()) >= 0; }); },
		cast_vote: function (a) { mock.state.my_votes[a.track] = { ranking: JSON.parse(a.ranking) }; return { track: a.track }; },
		cast_verdict: function (a) {
			var key = a.option_code + ":" + a.screen_code;
			if (a.verdict) mock.state.verdicts.mine[key] = a.verdict; else delete mock.state.verdicts.mine[key];
			var c = { Yes: 0, Maybe: 0, No: 0 }; if (a.verdict) c[a.verdict] = 1;
			mock.state.verdicts.live[key] = c;
			return { verdict: a.verdict || null };
		},
		add_note: function (a) {
			var m = /^([A-Z][A-Z0-9]*)-([A-Z][A-Z0-9]*)-E(\d+)$/.exec(a.code);
			var opt = mock.content.options.filter(function (o) { return o.code === m[1]; })[0];
			var parts = mock.content.parts[opt.track + ":" + m[2]] || [];
			var part = parts.filter(function (p) { return p[0] === Number(m[3]); })[0];
			var name = "DN-2026-" + (++seq);
			mock.state.notes.push({ name: name, code: a.code, track: opt.track, option_code: m[1], screen_code: m[2], part_number: Number(m[3]), part_name: part ? part[1] : "", text: a.text, status: "Open", author_name: "Pat", raised_by_name: a.raised_by ? "Ana Lopez" : "", mine: true, is_imported: 0 });
			return { name: name };
		},
		delete_note: function (a) { mock.state.notes = mock.state.notes.filter(function (n) { return n.name !== a.note; }); return { deleted: a.note }; },
		set_status: function (a) { mock.state.status = a.status; return { status: a.status }; },
		set_note_status: function (a) { mock.state.notes.forEach(function (n) { if (n.name === a.note) n.status = a.status; }); return { status: a.status }; },
	};
	window.fetch = function (url, init) {
		var m = /^\/api\/method\/erpnext_enhancements\.api\.design_review\.(\w+)$/.exec(String(url));
		if (!m) return realFetch(url, init);
		var args = init && init.body ? JSON.parse(init.body) : {};
		calls.push({ method: m[1], args: args });
		return load.then(function () {
			var h = handlers[m[1]];
			if (!h) return reply("not mocked: " + m[1], 417);
			return reply(h(args));
		});
	};
})();
</script>
<script type="module" src="/js/design_review.bundle.js"></script>
</body>
</html>
