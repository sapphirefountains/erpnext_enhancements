<!-- My Priority Tasks ("Home Dashboard Tasks") — the viewer's own open tasks. Source of truth: this folder. -->
<div class="mpt-card">
    <div class="mpt-head">
        <span class="mpt-title">My Priority Tasks</span>
        <span class="mpt-sub" id="mpt-count"></span>
        <button class="mpt-refresh" id="mpt-refresh" type="button" title="Refresh" aria-label="Refresh">&#10227;</button>
    </div>
    <p class="mpt-how" id="mpt-how">Top company priority projects first, then each project's tasks together, then Urgent, High, Medium, Low.</p>
    <div class="mpt-body" id="mpt-body">
        <div class="mpt-muted">Loading&hellip;</div>
    </div>
    <div class="mpt-foot">
        <button class="mpt-more" id="mpt-more" type="button" hidden>Show more</button>
    </div>
</div>
