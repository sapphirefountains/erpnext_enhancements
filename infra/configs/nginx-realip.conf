# Recover the real client address behind the Google Cloud load balancer.
#
# Installed as /etc/nginx/conf.d/00-realip.conf by startup_script.sh on every boot.
# This file is the source of truth; the copy on the VM is a deployment of it.
#
# The chain is GCLB -> nginx -> bench (there is no Cloudflare in front of erp; only
# www is Cloudflare-fronted). The load balancer connects from a Google Front End in
# 35.191.0.0/16 or 130.211.0.0/22 and APPENDS to X-Forwarded-For, so the header
# arrives as
#
#     <anything the caller sent>, <client>, <load balancer address>
#
# Without this file nginx's $remote_addr is the front end, bench's
# `proxy_set_header X-Forwarded-For $remote_addr` hands frappe that address, and
# frappe.local.request_ip is a rotating pool of Google addresses shared by every
# visitor. That was the state from 2026-07-18 to 2026-08-03: IP-keyed rate limits
# became one global bucket, and login forensics recorded no client at all.
#
# real_ip_recursive walks the header from the RIGHT, skipping trusted entries, and
# stops at the first untrusted one. That is what makes a forged header harmless: the
# caller's own value sits to the left of the address the load balancer appended, so
# it is never reached. Verified on prod 2026-09-22 with a forged
# `X-Forwarded-For: 203.0.113.77` -- the rate limiter keyed on the real caller.
#
# ALL THREE KINDS of entry must be trusted. Drop the front-end ranges and nothing is
# rewritten. Drop the load balancer's own address and the walk stops on it, so every
# visitor is recorded as 136.68.113.208. utils/client_ip.py holds the same list and
# tests/test_client_ip.py fails the build if the two disagree.

# Google Front End ranges -- the load balancer's source addresses, and the health checks'.
set_real_ip_from 35.191.0.0/16;
set_real_ip_from 130.211.0.0/22;

# Forwarding-rule addresses. The load balancer appends its own address after the
# client's. prod = production-glb (erp.sapphirefountains.com); beta = the spot VM's
# load balancer (beta.erp.sapphirefountains.com). Trusting the other environment's
# address is harmless -- it is a Google anycast address, never a real visitor -- and
# lets one file serve both VMs, which share this startup script.
set_real_ip_from 136.68.113.208;
set_real_ip_from 34.149.67.36;

real_ip_header X-Forwarded-For;
real_ip_recursive on;
