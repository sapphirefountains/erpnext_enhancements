# `systemctl restart frappe-bench` at the end restarts every bench process on both kinds of
# VM, so this file does not change when a VM is cut over to gunicorn:
#   * cut over: frappe-bench.service is an umbrella, and gunicorn, socketio, the workers,
#     the scheduler and both Redis instances are each PartOf it (infra/configs/systemd/);
#   * not yet: it runs `honcho start` on the development Procfile (`bench serve`).
# The deploy user's sudoers line allows exactly that command (deploy_user_sudo_command).
# Runbook: infra/docs/production-web-tier.md.
#
# Before anything on the VM changes, infra/bench_update.sh checks that both Redis instances
# answer (a migrate started while one is down stops partway), then takes a database-only
# backup of every site into <bench>/pre-migrate-backups and keeps the newest five. When
# either fails, or there is not enough free disk, the `&&` chain stops there: no code reset,
# migrate, build, redis flush or restart, so the site keeps running the release it had.
# The order is fetch, Redis check, backup, reset. After the fetch only the script itself is
# checked out of the fetched commit, so the check and the backup are always done by the
# script being deployed (and the first deploy that carries the script can run it); the
# app's code moves after the backup.
#
# One run at a time, through two flock(1) locks in the one `&&` chain:
#   * the deploy user's own, ~/.frappe-bench-deploy.lock, held by the remote shell from its
#     first command to its last, the restart included. The upstream file takes the same
#     one, so two triggered runs never overlap anywhere;
#   * the bench's, <bench>/.deploy.lock, held by the frappe user's shell from before the
#     fetch to after the redis flush. infra/bench_update.sh takes the same one for an
#     update, so a deploy also waits for an update a person is running by hand, and its
#     backup is never taken while another run is migrating. Before the fetch, because
#     the fetch replaces the script that a run already in progress is reading.
# The frappe user cannot restart the bench and the deploy user is not assumed able to open
# a file inside it, hence two files. Each waits up to 900s and says so (`--verbose`); a
# run that cannot get one stops there with nothing changed. Every command after the
# bench's lock ends with `9>&-`: the shell alone holds the lock, so nothing a command
# leaves running (git's background gc, a process a hook starts) can keep it. The last
# command of all closes the deploy user's lock, and is there so that the restart is not
# the last: a shell runs its last command in its own place, and the lock would go with it
# before the restart had run.
# Runbook: infra/README.md, section 13.
steps:
  - name: 'google/cloud-sdk:latest'
    id: 'Deploy'
    entrypoint: 'sh'
    secretEnv: ['DEPLOY_SSH_KEY']
    args:
      - '-c'
      - |
        set -e
        mkdir -p /root/.ssh && chmod 700 /root/.ssh
        echo "$$DEPLOY_SSH_KEY" > /root/.ssh/id_rsa
        chmod 600 /root/.ssh/id_rsa
        ssh-keygen -y -f /root/.ssh/id_rsa > /root/.ssh/id_rsa.pub 2>/dev/null

        VM="$_VM_NAME"
        ZONE="$_VM_ZONE"
        STATUS=$(gcloud compute instances describe "$$VM" --zone="$$ZONE" \
          --format="value(status)" 2>/dev/null || echo "NOT_FOUND")

        if [ "$$STATUS" != "RUNNING" ]; then
          if [ "$_ALLOW_SKIP" = "true" ]; then
            echo "⚠️  $$VM is $$STATUS — skipping"
            exit 0
          else
            echo "❌  $$VM is $$STATUS — aborting"
            exit 1
          fi
        fi

        echo "🚀 Deploying to $$VM"
        gcloud compute ssh deploy@"$$VM" \
          --zone="$$ZONE" \
          --ssh-key-file=/root/.ssh/id_rsa \
          --tunnel-through-iap \
          --command="exec 9>>\$$HOME/.frappe-bench-deploy.lock && \
            flock --verbose -w 900 9 && \
            sudo -u frappe bash -c 'cd /home/frappe/frappe-bench && \
            export PATH=\$$PATH:/home/frappe/.local/bin && \
            exec 9>>.deploy.lock && \
            flock --verbose -w 900 9 && \
            git -C apps/erpnext_enhancements fetch upstream main 9>&- && \
            git -C apps/erpnext_enhancements checkout FETCH_HEAD -- infra/bench_update.sh 9>&- && \
            bash apps/erpnext_enhancements/infra/bench_update.sh redis 9>&- && \
            bash apps/erpnext_enhancements/infra/bench_update.sh backup 9>&- && \
            git -C apps/erpnext_enhancements reset --hard FETCH_HEAD 9>&- && \
            bench --site all migrate 9>&- && \
            bench build 9>&- && \
            redis-cli -p 13000 FLUSHDB 9>&- && \
            redis-cli -p 11000 FLUSHDB 9>&-' && \
            sudo systemctl restart frappe-bench && \
            exec 9>&-"
        echo "✅  $$VM updated"

# 2100s, up from 600s: 600s more for the backup, and up to 900s waiting for another run to
# finish (one lock wait: a second one can only stack when a person is running an update by
# hand as well). A timeout ends the SSH session mid-migrate.
timeout: '2100s'
options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _ALLOW_SKIP: 'false'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/DEPLOY_SSH_KEY/versions/latest
      env: 'DEPLOY_SSH_KEY'
